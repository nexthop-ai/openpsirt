# A pinned SHA is a pin nobody moves unless something moves it.
#
# Every action is pinned to the commit of a release rather than to a tag,
# because a tag moves and an action that moves is code running with this
# repository's token on a day nobody chose. What that costs is that a pin goes
# stale silently — the version stops receiving fixes and nothing says so.
# This is what says so: an update arrives as a pull request, through the same
# queue and the same gate as any other change, and the commit it pins is
# visible in the diff.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request rather than one per action. These move together and
      # each is a line in a workflow file; separately they are noise nobody
      # reads by the fourth one.
      actions:
        patterns: ["*"]

  # The images the container is built from.
  #
  # "Nothing watches the base, the scanner or the inventory tool" is written
  # into DESIGN-packaging.md's limits, next to the measurement that found all
  # three two or more releases behind in one week. Past a base's end of life
  # its packages receive no security backports, and pinning without watching
  # is how that happened.
  #
  # The Go toolchain is here for a second reason: the build stage's golang tag
  # is the one pin of the Go patch release. Both workflows install the release
  # it names, so this pull request moves the toolchain everything is built and
  # tested with, standard-library fixes included, and passes `pins-check` on
  # its own: go.mod's go line is held at or below the image's, not equal to it.
  #
  # **A bump to the node image will fail `pins-check`, and should.** The
  # version the image builds the interface with is written in the Dockerfile
  # and in ci.yml, and the check compares them — so the pull request needs
  # ci.yml moved with it. Red there means half an update, not a broken bot.
  #
  # The golang tag is a group of its own, so a node bump held red by that
  # check never holds the toolchain's standard-library fixes with it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ["golang"]
      images:
        patterns: ["*"]
        exclude-patterns: ["golang"]

  # The Go modules. A module that needs a newer Go than the image raises
  # go.mod's go line past it, and `pins-check` fails that pull request until
  # the image's own has landed. Red there means the toolchain moves first.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # The interface's packages, moved in the lockfile the build installs from.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  # The documentation build's Python closure. The lock is generated from
  # requirements.in with a hash for every package, and the update regenerates
  # it the same way.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
