# A pinned SHA is a pin nobody moves unless something moves it.
#
# Every action is pinned to the commit of a release rather than to a tag,
# because a tag moves and an action that moves is code running with this
# repository's token on a day nobody chose. What that costs is that a pin goes
# stale silently — the version stops receiving fixes and nothing says so.
# This is what says so: an update arrives as a pull request, through the same
# queue and the same gate as any other change, and the commit it pins is
# visible in the diff.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request rather than one per action. These move together and
      # each is a line in a workflow file; separately they are noise nobody
      # reads by the fourth one.
      actions:
        patterns: ["*"]

  # The images the container is built from.
  #
  # "Nothing watches the base, the scanner or the inventory tool" is written
  # into DESIGN-packaging.md's limits, next to the measurement that found all
  # three two or more releases behind in one week. Past a base's end of life
  # its packages receive no security backports, and pinning without watching
  # is how that happened.
  #
  # The Go toolchain is here for a second reason: the build stage's golang tag
  # is the one pin of the Go patch release. Both workflows install the release
  # it names, so this pull request moves the toolchain everything is built and
  # tested with, standard-library fixes included, and passes `pins-check` on
  # its own: go.mod's go line is held at or below the image's, not equal to it.
  # The node tag is the one pin of the interface's Node in the same way.
  #
  # A Go release can outrun a tool built against the previous one: the linter
  # reads the compiler's export data, and a release writing a newer format
  # fails it on every package. The tools' own pull request below brings the
  # release that reads it, and lands first. Red there means the tools move
  # first.
  #
  # The golang tag is a group of its own, so an image bump held red never holds
  # the toolchain's standard-library fixes with it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ["golang"]
      images:
        patterns: ["*"]
        exclude-patterns: ["golang"]

  # The Go modules. A module that needs a newer Go than the image raises
  # go.mod's go line past it, and `pins-check` fails that pull request until
  # the image's own has landed. Red there means the toolchain moves first.
  #
  # The database layer is a group of its own: the query builder, the drivers
  # and the migration runner. A release there can change an interface every
  # store is written against, and the work it needs should hold nothing else
  # back. A module goes to the first group whose pattern it matches.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      database:
        patterns:
          - "github.com/uptrace/bun*"
          - "github.com/jackc/*"
          - "github.com/go-sql-driver/*"
          - "github.com/pressly/goose/*"
          - "modernc.org/*"
      go:
        patterns: ["*"]

  # The Go tools the gate runs, one module each under tools/. The makefile and
  # the image run each at the version its module requires, so this pull
  # request moves the tool everywhere it runs.
  - package-ecosystem: gomod
    directories: ["/tools/*"]
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]

  # The interface's packages, moved in the lockfile the build installs from.
  #
  # The group carries minor and patch releases. A major release arrives as a
  # pull request of its own, because it is the kind that needs work, and one
  # that does should hold nothing else back.
  #
  # TypeScript's major releases are not offered. The linter's TypeScript
  # support and the API client generator each declare the compiler releases
  # they accept as a peer, and neither accepts 7, so npm refuses the install.
  # This lifts when both accept it.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The documentation build's Python closure. The lock is generated from
  # requirements.in with a hash for every package, and the update regenerates
  # it the same way.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
