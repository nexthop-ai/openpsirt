name: CI

# bash with pipefail everywhere. GitHub's default shell is `bash -e`, which
# takes the *last* command's status in a pipeline — so `go test | tee` reports
# tee's status, which is always 0. The engine guards below pipe into tee, and
# without this they announce success over a failing suite. Measured, not
# assumed: the local gate had the same hole and passed a deliberately broken
# test.
defaults:
  run:
    shell: bash -euo pipefail {0}

on:
  push:
    branches: [main]
  pull_request:
  # A queue entry is a different event from the pull request it came from, and
  # a workflow that does not name it reports no check there. The aggregator in
  # pr.yml waits for the checks that exist and cannot tell one that will never
  # run from one that has not started — so a queue entry with no checks on it
  # would satisfy the only required check vacuously.
  merge_group:

permissions:
  contents: read

# A superseded run tells you nothing worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs the Go toolchain, in one job.
  #
  # This was six jobs — build and test, the interface, static analysis,
  # vulnerabilities and licenses, the OpenAPI document, and the bill of
  # materials. Five of them declared nothing but a checkout and a Go setup
  # before running a make target: same runner image, same toolchain, same
  # module cache, no services and no conditions. So they were six clones and
  # six toolchain restores to run one machine's worth of work.
  #
  # **What it runs is the command a developer runs.** `make check` is defined
  # as everything CI checks, and `make gate full` is `make check &&
  # make check-engines`. Naming the targets separately here is how the two
  # drifted: CI was running neither `reserved`, nor `readable`, nor
  # `pins-check`, all three of which `make check` has run for as long as it has
  # existed. A gate nobody notices is missing is the failure `check-engines`
  # was written to prevent, one level up.
  checks:
    name: Build, test and check
    runs-on: ubuntu-latest

    # All four supported engines run the same suite. SQLite alone would catch
    # none of the portability traps the design is written around, so a green
    # run here is the only thing that makes "runs on four engines" a fact.
    #
    # The servers are the ones "make engines-up" starts, from the one list in
    # mk/engines.mk, so a developer's pass and this one run the same servers.
    # A job's service containers start one after another before the checkout,
    # 29 to 51 s; started by a step, they pull and start while the toolchains
    # and caches are restored.

    env:
      # Whether this run writes the Go build, linter and interface caches.
      # One spelling, read by the steps that mark, prune and save them.
      SAVES_CACHES: ${{ github.ref == 'refs/heads/main' }}
      OPENPSIRT_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/openpsirt?sslmode=disable
      OPENPSIRT_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/openpsirt
      OPENPSIRT_TEST_MARIADB_URL: mariadb://root:test@127.0.0.1:3307/openpsirt
      OPENPSIRT_TEST_TOO_OLD_URL: postgres://postgres:test@127.0.0.1:5433/openpsirt?sslmode=disable
      # The servers are throwaways, so the harness may turn off their commit
      # durability, which is global on MySQL and MariaDB.
      OPENPSIRT_TEST_RELAX_DURABILITY: "1"
      # The servers on the runner's own network, each on its port above, so no
      # proxy process carries the suite's traffic to them.
      ENGINE_NETWORK: host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The whole history, so the vulnerability gates can find where this
          # change left main and fail only what it introduced. Commits and
          # trees alone: the few files read from the base are fetched as read.
          fetch-depth: 0
          filter: blob:none
      # Every processor's time, every five seconds until the job ends, which
      # the last step reads against the times test-all prints.
      - name: Sample the processors
        run: |
          ( while :; do echo "$(date +%s) $(head -1 /proc/stat)"; sleep 5; done \
              > "$RUNNER_TEMP/cpu.log" ) > /dev/null 2>&1 &
      # In the background, so the pulls and the servers' start overlap the
      # steps below; the step before "make check" waits for it.
      - name: Start the database servers
        run: |
          ( status=0; make engines-up > "$RUNNER_TEMP/engines.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/engines.status" ) > /dev/null 2>&1 &
      # The Go release is the one the image builds with. The Dockerfile's
      # golang tag is the one pin of the patch, and go.mod's go line is only
      # the oldest release the module accepts.
      - name: Read the Go release the image builds with
        id: go
        run: |
          version=$(make -s --no-print-directory go-version)
          [ -n "$version" ] || { echo "::error::the Dockerfile names no golang release"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The toolchain itself, where setup-go looks for one already installed.
      # Downloading it takes setup-go under a second; copying it into the tool
      # cache file by file takes 20 s more, and a restored one is found there.
      # One release never changes, so the key is the release.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: go-toolchain
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.go.outputs.version }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Off, because setup-go keeps the modules and the build cache in one
          # entry under one key, and the two answer different questions. Left
          # on, the entry holding both is downloaded and extracted over the top
          # of the two below, and grows to hold the merged copy.
          cache: false
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: env.SAVES_CACHES == 'true' && steps.go-toolchain.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.go.outputs.version }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}
      # The modules, keyed on what decides their content: the module's own and
      # each tool's under tools/, which the same directory holds. The
      # downloaded archives are left out: every module is also kept extracted,
      # and nothing in the job reads an archive again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            !~/go/pkg/mod/cache/download/**/*.zip
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/*/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      # The build cache, kept current.
      #
      # setup-go's key is a hash of go.mod, and a cache is written only when
      # its key is new. So what a run restores is the compilation of whatever
      # the tree looked like the last time a dependency was added or the Go
      # version moved — go.mod moves less often than the checksum file — and
      # everything changed since is compiled again. It is the largest block in
      # this job that is not a test.
      #
      # Written on main and read everywhere. A branch restores what the last
      # merge left, which is at most one merge stale, and writing from every
      # branch would churn a shared ten gigabytes for entries nothing reads
      # twice. Go's build cache is content-addressed, so a stale entry is
      # ignored rather than used: the failure mode is a slow run, never a
      # wrong one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: go-build-${{ runner.os }}-
      # The linter's results, kept the way the build cache is and for the same
      # reason: they are content-addressed, so an entry for a file that has
      # since changed is never read, and a cold run analyzes every package.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.run_id }}
          restore-keys: golangci-lint-${{ runner.os }}-
      - name: Read the Node release the image builds the interface with
        id: node
        run: |
          version=$(make -s --no-print-directory node-version)
          [ -n "$version" ] || { echo "::error::the Dockerfile names no node release"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # The version the image builds the interface with. "make check" runs
          # the interface checks, so the toolchain for them belongs here.
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The interface checks' own caches: the type checker's build information,
      # and the formatter's and linter's results per file by content. Kept as
      # the build cache is, and keyed on the lockfile and the tools'
      # configuration as well, so a change to either starts them empty.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: web/.cache
          key: web-checks-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/tsconfig.json', 'web/eslint.config.js', 'web/.prettierrc.json', 'web/.prettierignore') }}-${{ github.run_id }}
          restore-keys: web-checks-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/tsconfig.json', 'web/eslint.config.js', 'web/.prettierrc.json', 'web/.prettierignore') }}-

      - name: Wait for the database servers
        run: |
          for _ in $(seq 300); do
            [ -e "$RUNNER_TEMP/engines.status" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/engines.log"
          [ "$(cat "$RUNNER_TEMP/engines.status" 2>/dev/null)" = 0 ] \
            || { echo "::error::the database servers did not start"; exit 1; }

      - name: Mark every restored cache entry as unused
        # Both caches record a use by moving an entry's modification time to
        # now, but only where it is more than an hour old, and they trim what
        # is more than five days old. Two hours back puts every entry between
        # the two, so each one this run reads is moved past the marker and
        # nothing is trimmed before it is read.
        if: env.SAVES_CACHES == 'true'
        run: |
          for cache in ~/.cache/go-build ~/.cache/golangci-lint; do
            if [ -d "$cache" ]; then
              find "$cache" -mindepth 2 -maxdepth 2 -exec touch -m -d '2 hours ago' {} +
            fi
          done
          touch "$RUNNER_TEMP/caches-marked"

      - name: Everything the local gate checks
        # Deliberately one target rather than a list of them. "make check" is
        # the definition of what CI checks, so a target added to it is run
        # here without anybody remembering to add a step, which is the half
        # that had already gone wrong three times over.
        #
        # It covers: the linter (which is also the vet),
        # unreachable exported code, decisions no design document names,
        # invented names an engine reserves, source files a text tool cannot
        # read, the pinned versions agreeing with each other, the four-engine
        # race-detected suite,
        # known vulnerabilities, dependency licenses, the OpenAPI document
        # being current, the bill of materials, and the interface.
        # Its output is kept for the processor report at the end.
        run: make check 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Drop the cache entries this run did not read
        # An entry is a file or, for a built program, a directory, two levels
        # down. What is left is what this tree needs, so the cache saved below
        # is the size of one tree's build rather than of every tree built on
        # main in the last five days.
        if: env.SAVES_CACHES == 'true'
        run: |
          for cache in ~/.cache/go-build ~/.cache/golangci-lint; do
            before=$(du -sm "$cache" | cut -f1)
            find "$cache" -mindepth 2 -maxdepth 2 ! -newer "$RUNNER_TEMP/caches-marked" -exec rm -rf {} +
            echo "$cache: ${before} MB before, $(du -sm "$cache" | cut -f1) MB kept"
          done

      # Written here rather than beside the restore, so what is stored is the
      # compilation this job did rather than what it started with.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: env.SAVES_CACHES == 'true'
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: env.SAVES_CACHES == 'true'
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: env.SAVES_CACHES == 'true'
        with:
          path: web/.cache
          key: web-checks-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/tsconfig.json', 'web/eslint.config.js', 'web/.prettierrc.json', 'web/.prettierignore') }}-${{ github.run_id }}

      - name: Confirm every engine ran, and that each was the engine it claimed
        # A skipped engine passes silently, which would make the matrix
        # decorative. The target greps each engine by name, and — because a
        # grep for a *label* only proves a subtest with that label ran, while
        # the connection comes from an environment variable — asks each server
        # what it is and compares that against the label. With the old server
        # configured above it also checks the version floor refused it rather
        # than skipped, and that the migration lock was exercised on each of
        # the three servers.
        run: make check-engines

      # Written by "make check" above, by way of the sbom target. Published
      # because we ingest these for other people's software and publishing one
      # for our own is the same promise kept.
      #
      # It describes a binary built from this tree, and is not the inventory a
      # release publishes — that one is read out of the image, is attached to
      # the release, and does not expire. Two documents of one name invites
      # somebody to treat this one as the release's.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openpsirt-sbom
          path: bin/openpsirt.cdx.json
          if-no-files-found: error

      # Whatever happened above, so a run that ran out of memory or filled a
      # server's data directory says which. The processors' idle share is
      # given while both test passes ran, while one ran with the other checks
      # beside it, and while either ran alone, from the samples and the line
      # each printed as it finished.
      - name: Report the runner's memory and processors, and each server's
        if: always()
        run: |
          free -m
          make engines-status
          idle() {
            awk -v from="$1" -v to="$2" '$1 >= from && $1 <= to {
                total = 0; for (i = 3; i <= 10; i++) total += $i
                if (!n++) { t0 = total; i0 = $6 + $7 }
                t1 = total; i1 = $6 + $7
              }
              END { if (n > 1 && t1 > t0) printf "%.0f%% idle", 100 * (i1 - i0) / (t1 - t0); else printf "too short to sample" }' \
              "$RUNNER_TEMP/cpu.log"
          }
          ends() {
            sed -n "s/^\[$1\] *finished at \([^,]*\), \([0-9]*\) s after the start$/\1 \2/p" \
              "$RUNNER_TEMP/check.log" 2>/dev/null | tail -1
          }
          echo "processors: $(nproc); whole job $(idle 0 9999999999)"
          read -r race_at race_s <<< "$(ends 'sqlite -race')" || true
          read -r servers_at servers_s <<< "$(ends servers)" || true
          if [ -z "${race_at:-}" ] || [ -z "${servers_at:-}" ]; then
            echo "test-all did not finish both passes, so its idle share is not reported"
            exit 0
          fi
          race_end=$(date -d "$race_at" +%s); servers_end=$(date -d "$servers_at" +%s)
          start=$((race_end - race_s))
          first=$((race_end < servers_end ? race_end : servers_end))
          last=$((race_end < servers_end ? servers_end : race_end))
          alone=$([ "$race_end" -lt "$servers_end" ] && echo "the server pass" || echo "the race pass")
          echo "test-all: race pass ${race_s} s, server pass ${servers_s} s"
          echo "  both passes, $((first - start)) s: $(idle "$start" "$first")"
          read -r checks_at checks_s <<< "$(ends checks)" || true
          if [ -z "${checks_at:-}" ]; then
            echo "  $alone alone, $((last - first)) s: $(idle "$first" "$last")"
            exit 0
          fi
          checks_end=$(date -d "$checks_at" +%s)
          echo "  the other checks ended ${checks_s} s after the start"
          if [ "$checks_end" -le "$last" ]; then
            echo "  $alone with the checks, $((checks_end - first)) s: $(idle "$first" "$checks_end")"
            echo "  $alone alone, $((last - checks_end)) s: $(idle "$checks_end" "$last")"
          else
            echo "  $alone with the checks, $((last - first)) s: $(idle "$first" "$last")"
            echo "  the checks alone, $((checks_end - last)) s: $(idle "$last" "$checks_end")"
          fi

  # The two below are not steps of the job above, and each for a reason of
  # its own rather than for tidiness.
  #
  # A third was here: dependency review, the action applying the license
  # policy to what a pull request adds. It needs GitHub Advanced Security on
  # a private repository, which is a paid add-on nothing else in this
  # organization buys, and it could never be run locally — so what it checked
  # is now checked by "make licenses" and "make web-audit", which the job
  # above runs along with everything else. REQ-75 asks for a finding that
  # reproduces locally with one documented command, and the action was the
  # one gate that could not.

  image:
    name: Container image and chart
    # buildx and helm rather than Go, and it carries a build cache of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: openpsirt:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          # Exported from main alone. A pull request's run reads main's layers
          # and writes none: what its build would export is keyed to its own
          # commit, which no later run builds, and a branch's scope is read by
          # nothing but that branch.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      # The same checks the local target runs, against the image just built.
      # Written twice they drifted: the image's scanner was checked here and
      # not there, the chart's refusal to render without a database there and
      # not here, and the messages had come to differ — so whichever a
      # developer ran, some of the guards went unexercised.
      - name: Everything check-packaging checks
        run: make check-packaging CHECK_IMAGE=openpsirt:ci

  docs:
    name: Documentation builds
    # Python, and nothing else here needs it.
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the pages name the newest release tag reachable
      # from the commit, and a shallow checkout has none, so the build refuses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      # --require-hashes refuses any distribution the lock does not name by
      # hash, transitive ones included — the guarantee go.sum and the npm
      # lockfile already give the other two ecosystems here.
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: make docs-site

  # The upload client on the two other systems a pipeline runs it on. Paths,
  # drive letters and line endings are seen there as a build host sees them,
  # and nowhere else here.
  #
  # Both runners cost several Linux ones, so they start only when one of the
  # client's sources moved. The list is the makefile's, which a test holds to
  # the client's imports; the step here only compares the change against it.
  client-changes:
    name: Upload client sources
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      packages: ${{ steps.compare.outputs.packages }}
      go: ${{ steps.compare.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Compare the change against the client's sources
        id: compare
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          echo "go=$(make -s --no-print-directory go-version)" >> "$GITHUB_OUTPUT"
          echo "packages=$(make -s --no-print-directory client-packages)" >> "$GITHUB_OUTPUT"
          # A base that cannot be fetched, such as the first push of a
          # branch, runs the jobs rather than skipping them.
          changed=true
          if [ -n "$BASE" ] && git fetch -q --depth=1 origin "$BASE" 2>/dev/null; then
            # The list is split into words on purpose: it is paths.
            # shellcheck disable=SC2046
            if git diff --quiet "$BASE" HEAD -- $(make -s --no-print-directory client-sources); then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "the upload client's sources changed: $changed"

  client:
    name: Upload client on ${{ matrix.os }}
    needs: client-changes
    if: needs.client-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The client imports nothing outside the standard library, so there is
      # no module to cache, and its tests compile in seconds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ needs.client-changes.outputs.go }}
          cache: false
      - name: The upload client's tests
        env:
          PACKAGES: ${{ needs.client-changes.outputs.packages }}
        # The list is split into words on purpose: it is package paths.
        run: go test -count=1 $PACKAGES
