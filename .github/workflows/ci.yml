name: CI

# bash with pipefail everywhere. GitHub's default shell is `bash -e`, which
# takes the *last* command's status in a pipeline — so `go test | tee` reports
# tee's status, which is always 0. The engine guards below pipe into tee, and
# without this they announce success over a failing suite. Measured, not
# assumed: the local gate had the same hole and passed a deliberately broken
# test.
defaults:
  run:
    shell: bash -euo pipefail {0}

on:
  push:
    branches: [main]
  pull_request:
  # A queue entry is a different event from the pull request it came from, and
  # a workflow that does not name it reports no check there. The aggregator in
  # pr.yml waits for the checks that exist and cannot tell one that will never
  # run from one that has not started — so a queue entry with no checks on it
  # would satisfy the only required check vacuously.
  merge_group:

permissions:
  contents: read

# A superseded run tells you nothing worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What "make check" runs, as three jobs rather than one. The command a
  # developer runs is "make check", which is check-static and test-all; test-all
  # is the race pass and the server pass; so the three jobs are the three
  # halves, named here and in the makefile's definition of check, and nowhere
  # a target can be added without reaching one of them.
  #
  # Three runners rather than one, because a runner for a private repository
  # has two cores. On one runner the two passes of the suite ran one package at
  # a time each, and the job took twenty minutes, sixteen of them in make check.
  static:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Off in every job: setup-go keeps the modules and the build cache
          # in one entry under one key, and the two answer different
          # questions. Each is restored below under a key of its own.
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      # The build cache, one per job, because each compiles something
      # different: this one the binary and the tools, the race job the tree
      # instrumented, the engine job the test binaries plain.
      #
      # Written on main and read everywhere. A branch restores what the last
      # merge left, which is at most one merge stale, and writing from every
      # branch would churn a shared ten gigabytes for entries nothing reads
      # twice. Go's build cache is content-addressed, so a stale entry is
      # ignored rather than used: the failure mode is a slow run, never a
      # wrong one.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/go-build
          key: go-build-static-${{ runner.os }}-${{ github.run_id }}
          restore-keys: go-build-static-${{ runner.os }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # The version the image builds the interface with. check-static
          # runs the interface checks, so the toolchain for them belongs here.
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Confirm a developer's engines are the engines run here
        # The servers the engine job declares are started locally by "make
        # engines-up", which pins the same versions. Two pinned lists drift,
        # and the drift is invisible exactly when it matters: a suite green
        # locally against an engine this workflow no longer runs proves
        # nothing about the one it does. The target compares the two lists in
        # both directions, so an engine added here and nowhere else is caught.
        run: make engines-check

      - name: Everything make check runs except the suite
        # One target rather than a list of them, so that a target added to it
        # is run here without anybody remembering to add a step.
        run: make check-static

      # Written here rather than beside the restore, so what is stored is the
      # compilation this job did rather than what it started with.
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-static-${{ runner.os }}-${{ github.run_id }}

      # Written by check-static, by way of the sbom target. Published because
      # we ingest these for other people's software and publishing one for our
      # own is the same promise kept.
      #
      # It describes a binary built from this tree, and is not the inventory a
      # release publishes — that one is read out of the image, is attached to
      # the release, and does not expire. Two documents of one name invites
      # somebody to treat this one as the release's.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openpsirt-sbom
          path: bin/openpsirt.cdx.json
          if-no-files-found: error

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ runner.os }}-${{ github.run_id }}
          restore-keys: go-build-race-${{ runner.os }}-
      - name: The suite on SQLite, with the race detector
        run: make test-race
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ runner.os }}-${{ github.run_id }}

  engines:
    name: Database engines
    runs-on: ubuntu-latest

    # All four supported engines run the same suite. SQLite alone would catch
    # none of the portability traps the design is written around, so a green
    # run here is the only thing that makes "runs on four engines" a fact.
    #
    # The data directories stay on the runner's disk. The runner's memory is
    # what the suite runs in, and the disk a runner has pays little for a
    # schema change: the migrations package takes 25 s here against 109 s on a
    # workstation's disk.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openpsirt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: openpsirt
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ptest --silent" --health-interval 5s
          --health-timeout 5s --health-retries 20
      # Deliberately below the floor, so the refusal is exercised. Without it
      # that test skips in every run, and the design claims it is proved.
      postgres-old:
        image: postgres:13-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openpsirt
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: openpsirt
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      OPENPSIRT_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/openpsirt?sslmode=disable
      OPENPSIRT_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/openpsirt
      OPENPSIRT_TEST_MARIADB_URL: mariadb://root:test@127.0.0.1:3307/openpsirt
      OPENPSIRT_TEST_TOO_OLD_URL: postgres://postgres:test@127.0.0.1:5433/openpsirt?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/go-build
          key: go-build-engines-${{ runner.os }}-${{ github.run_id }}
          restore-keys: go-build-engines-${{ runner.os }}-
      - name: The suite on PostgreSQL, MySQL and MariaDB
        run: make test-engines
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-engines-${{ runner.os }}-${{ github.run_id }}

      - name: Confirm every engine ran, and that each was the engine it claimed
        # A skipped engine passes silently, which would make the matrix
        # decorative. The target greps each engine by name, and — because a
        # grep for a *label* only proves a subtest with that label ran, while
        # the connection comes from an environment variable — asks each server
        # what it is and compares that against the label. With the old server
        # configured above it also checks the version floor refused it rather
        # than skipped, and that the migration lock was exercised on each of
        # the three servers.
        run: make check-engines

  # The two below are not parts of make check, and each is a job for a reason
  # of its own rather than for tidiness.
  #
  # A third was here: dependency review, the action applying the license
  # policy to what a pull request adds. It needs GitHub Advanced Security on
  # a private repository, which is a paid add-on nothing else in this
  # organization buys, and it could never be run locally — so what it checked
  # is now checked by "make licenses" and "make web-audit", which the static
  # job runs along with everything else. REQ-75 asks for a finding that
  # reproduces locally with one documented command, and the action was the
  # one gate that could not.

  image:
    name: Container image and chart
    # buildx and helm rather than Go, and it carries a build cache of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: openpsirt:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          # Exported from main alone. A pull request's run reads main's layers
          # and writes none: what its build would export is keyed to its own
          # commit, which no later run builds, and a branch's scope is read by
          # nothing but that branch.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      # The same checks the local target runs, against the image just built.
      # Written twice they drifted: the image's scanner was checked here and
      # not there, the chart's refusal to render without a database there and
      # not here, and the messages had come to differ — so whichever a
      # developer ran, some of the guards went unexercised.
      - name: Everything check-packaging checks
        run: make check-packaging CHECK_IMAGE=openpsirt:ci

  docs:
    name: Documentation builds
    # Python, and nothing else here needs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      # --require-hashes refuses any distribution the lock does not name by
      # hash, transitive ones included — the guarantee go.sum and the npm
      # lockfile already give the other two ecosystems here.
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: make docs-site
