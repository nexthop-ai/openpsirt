name: Release

# Publishing what "make dist" builds.
#
# The assets are not assembled here. `make dist` builds every one of them and
# checks that each names the same version, and this workflow runs that command
# — so what a developer can build locally and what is published are the same
# recipe, and a release failure reproduces with one command. What is here is
# only the part a checkout cannot do: pushing to the registry, signing against
# a workload identity, and creating the release.
#
# The release is named by a job that runs no build tool: its version, image,
# chart registry and which aliases move. The build runs every dependency's
# code, the interface's build tools among them, holds nothing but a read of
# the repository, and passes on nothing but the image's sum. The publish job
# holds the write, package and signing permissions and runs no code from the
# repository or its dependencies: it takes the build's files and image, checks
# them against the sums the build recorded, and publishes them under the
# names the naming job chose.
# A build-time dependency gone bad reaches what it builds either way; split,
# it cannot also sign other things, push other tags or rewrite other
# releases. The documentation is split the same way: built with a read, and
# pushed by a job that runs none of its build tools.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every name the publish job pushes, signs or moves comes from here, where
  # nothing but git and the shell runs. A step output of the build job is
  # written by whatever ran in it, a dependency's code included, so the
  # build's outputs choose no tag.
  name:
    name: Name the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      charts: ${{ steps.release.outputs.charts }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      minor: ${{ steps.release.outputs.minor }}
      latest: ${{ steps.release.outputs.latest }}
      newest_on_line: ${{ steps.release.outputs.newest_on_line }}
      previous: ${{ steps.release.outputs.previous }}

    steps:
      # Full history: the release is named against every other tag, and the
      # tag is checked against the main it fetched. A shallow checkout has
      # neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag pointing at a commit that never reached main is a release of
      # something nothing gated. Everything on main arrived through the merge
      # queue with CI green; a tag on a side branch did not, and the assets
      # would be indistinguishable afterwards.
      # Nothing derived from the tag is substituted into a script in this file.
      # A ${{ }} value is expanded when the script is written, so a tag name
      # carrying shell syntax — which the ref format permits — would run as
      # script, and the failure path of the check meant to refuse it is one of
      # the places it would run. Every such value is passed through `env:` and
      # read as a variable, which the shell treats as data.
      - name: Confirm the tag is on main
        run: |
          git merge-base --is-ancestor "${{ github.sha }}" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      # Named from the tags where no build tool runs, so nothing the build
      # fetches can move a tag this reads.
      - name: Name this release
        id: release
        run: |
          # A release tag is a version: the globs and outputs below read it.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::$GITHUB_REF_NAME is not a release version"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A registry reference is lower case, and the repository's name need
          # not be. Every later reference to the image or the chart is one of
          # these two. The signing identity keeps the repository's own case,
          # because the certificate carries it.
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          charts="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/charts"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          # Anything with a hyphen after the patch number is a prerelease:
          # 0.1.0-rc.1 is, 0.1.0 is not. A prerelease moves no alias and takes
          # no floating tag — it exists to be tried, not to be landed on by
          # somebody who asked for the current version.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          # "latest" is the newest release, and "<major>.<minor>" the newest
          # patch on its line. A fix to an older line moves neither past a
          # newer release, so each moves only where this tag is the newest of
          # its kind. The tag has matched the release pattern above, so it
          # holds nothing a glob or a shell acts on.
          newest=$(git tag -l 'v*' | grep -v -- - | sort -V | tail -1)
          line=$(git tag -l "v${version%.*}.*" | grep -v -- - | sort -V | tail -1)
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then latest=true; else latest=false; fi
          if [ "$line" = "$GITHUB_REF_NAME" ]; then newest_on_line=true; else newest_on_line=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "newest_on_line=$newest_on_line" >> "$GITHUB_OUTPUT"
          # The release the notes count from: the newest stable tag below this
          # one for a stable release, and the newest tag of any kind below it
          # for a prerelease. Empty for the first release, where the notes
          # count from the start of the history. A hyphen becomes a tilde for
          # the sort, which orders 0.1.0-rc.1 below 0.1.0 as semantic
          # versioning does; a ref name cannot hold a tilde, so nothing else
          # is changed by the round trip.
          case "$version" in
            *-*) candidates=$(git tag -l 'v*') ;;
            *)   candidates=$(git tag -l 'v*' | grep -v -- -) ;;
          esac
          previous=$(printf '%s\n%s\n' "$candidates" "$GITHUB_REF_NAME" | grep . \
            | sed 's/-/~/' | sort -uV | sed 's/~/-/' \
            | awk -v tag="$GITHUB_REF_NAME" '$0 == tag { print prev; exit } { prev = $0 }')
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: name
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_sum: ${{ steps.saved.outputs.sum }}

    steps:
      # Full history: `git describe` derives the version from the tag, and a
      # shallow checkout has none. The token is not left in the checkout,
      # where the build's code could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The Go release is the one the image builds with. The Dockerfile's
      # golang tag is the one pin of the patch, and go.mod's go line is only
      # the oldest release the module accepts.
      - name: Read the Go release the image builds with
        id: go
        run: |
          version=$(make -s --no-print-directory go-version)
          [ -n "$version" ] || { echo "::error::the Dockerfile names no golang release"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true
      # A database a release builds applies exactly the migrations it shipped,
      # so a release is frozen before it is tagged: its record holds each file
      # and the schema it builds on every engine. A tag nobody froze, or one
      # whose tree has moved past what was frozen, publishes nothing.
      - name: Confirm the release's migrations are frozen
        run: make release-check VERSION="$GITHUB_REF_NAME"
      # "make dist" builds the interface before it builds the binaries, because
      # the binary embeds it. The version is the one the image builds with,
      # read from the Dockerfile, and "make pins-check" refuses a workflow
      # naming one of its own.
      - name: Read the Node release the image builds the interface with
        id: node
        run: |
          version=$(make -s --no-print-directory node-version)
          [ -n "$version" ] || { echo "::error::the Dockerfile names no node release"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
      # No buildx setup step here: one makes a container builder the
      # default, and that driver does not load what it builds
      # into the daemon's image store — "make dist" builds the image and then
      # reads the two inventories out of it, so the image has to be there.

      # Every asset, and the check that each names one version: the version
      # and the image this workflow pushes, handed to the build rather than
      # worked out again beside it, so what is pushed is what was built.
      - name: Build the release
        env:
          IMAGE: ${{ needs.name.outputs.image }}
        run: make dist VERSION="$GITHUB_REF_NAME" DIST_IMAGE="$IMAGE"

      # The image crosses to the publish job as an archive, and every file
      # beside it. The archive's sum is a job output, and SHA256SUMS covers
      # the rest, so the publish job checks what arrived against what was
      # built before it pushes or signs anything.
      - name: Save the image
        id: saved
        env:
          VERSION: ${{ needs.name.outputs.version }}
          IMAGE: ${{ needs.name.outputs.image }}
        run: |
          mkdir -p bin/image
          docker save "$IMAGE:$VERSION" -o bin/image/image.tar
          echo "sum=$(sha256sum bin/image/image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            bin/dist/
            bin/image/
          if-no-files-found: error
          # Long enough to re-run a failed publish the next week; a rebuild
          # would make an image with another digest.
          retention-days: 14

  publish:
    name: Publish
    needs: [name, build]
    runs-on: ubuntu-latest
    permissions:
      # The release.
      contents: write
      # The image and the chart, both to ghcr.
      packages: write
      # Keyless signing and provenance: the identity is the workflow's own,
      # so there is no key to hold, rotate, or lose to whoever holds it next.
      id-token: write
      attestations: write

    # No checkout: nothing from the repository or its dependencies runs here.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: bin

      - name: Check what the build made
        env:
          IMAGE_SUM: ${{ needs.build.outputs.image_sum }}
        run: |
          (cd bin/dist && sha256sum --check --strict SHA256SUMS)
          # Every file published is one the sums name, and nothing beside them.
          listed=$(cd bin/dist && awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | sort)
          present=$(cd bin/dist && ls -1 | grep -v -x -e SHA256SUMS | sort)
          [ "$listed" = "$present" ] \
            || { echo "::error::bin/dist holds files SHA256SUMS does not name"; diff <(echo "$listed") <(echo "$present"); exit 1; }
          [ -n "$IMAGE_SUM" ] || { echo "::error::the build recorded no sum for the image"; exit 1; }
          echo "$IMAGE_SUM  bin/image/image.tar" | sha256sum --check --strict
          docker load -i bin/image/image.tar

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image "make dist" already built and read the inventories out of,
      # pushed under the tags the design gives it. The exact tag never moves;
      # the others do, each only to the newest release of its kind, and
      # neither is applied to a prerelease.
      - name: Push the image
        id: image
        env:
          VERSION: ${{ needs.name.outputs.version }}
          IMAGE: ${{ needs.name.outputs.image }}
          MINOR: ${{ needs.name.outputs.minor }}
          PRERELEASE: ${{ needs.name.outputs.prerelease }}
          LATEST: ${{ needs.name.outputs.latest }}
          NEWEST_ON_LINE: ${{ needs.name.outputs.newest_on_line }}
        run: |
          image=$IMAGE
          version=$VERSION
          docker push "$image:$version"
          if [ "$PRERELEASE" = "false" ] && [ "$NEWEST_ON_LINE" = "true" ]; then
            docker tag "$image:$version" "$image:$MINOR"
            docker push "$image:$MINOR"
          fi
          if [ "$PRERELEASE" = "false" ] && [ "$LATEST" = "true" ]; then
            docker tag "$image:$version" "$image:latest"
            docker push "$image:latest"
          fi
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The digest is kept because the copy operators are told to install is
      # this one, and a registry copy is signed by digest. The identical
      # archive attached to the release is covered by SHA256SUMS; this one was
      # covered by nothing.
      - name: Push the chart
        id: chart
        env:
          VERSION: ${{ needs.name.outputs.version }}
          CHARTS: ${{ needs.name.outputs.charts }}
        run: |
          # helm push names the chart from the Chart.yaml inside the archive,
          # so the archive is held to this release's name and version before
          # anything is pushed.
          chart="bin/dist/openpsirt-$VERSION.tgz"
          name=$(helm show chart "$chart" | yq '.name')
          version=$(helm show chart "$chart" | yq '.version')
          [ "$name" = "openpsirt" ] && [ "$version" = "$VERSION" ] \
            || { echo "::error::the chart archive holds $name $version, not openpsirt $VERSION"; exit 1; }
          out=$(helm push "$chart" "oci://$CHARTS" 2>&1)
          echo "$out"
          digest=$(printf '%s\n' "$out" | awk '/^Digest: /{print $2}')
          [ -n "$digest" ] || { echo "::error::helm push named no digest, so the chart cannot be signed"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ needs.name.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Sign the chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
          CHARTS: ${{ needs.name.outputs.charts }}
        run: |
          cosign sign --yes "$CHARTS/openpsirt@$DIGEST"

      # One signature over the checksum file rather than one per asset: the
      # file already covers every asset, so a verifier checks one signature
      # and then the hashes.
      - name: Sign the checksums
        run: |
          cosign sign-blob --yes \
            --bundle bin/dist/SHA256SUMS.cosign.bundle \
            bin/dist/SHA256SUMS

      # A signature nobody has verified is a signature nobody has tested. This
      # is the command a third party runs, with the identity they would pin,
      # so a release that cannot be verified fails here rather than for them.
      - name: Verify the signature the way somebody else would
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          IMAGE: ${{ needs.name.outputs.image }}
          CHARTS: ${{ needs.name.outputs.charts }}
        run: |
          identity="^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            "$IMAGE@$IMAGE_DIGEST" > /dev/null
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            "$CHARTS/openpsirt@$CHART_DIGEST" > /dev/null
          echo "the image and the chart verify against this workflow's identity at $GITHUB_REF_NAME"

      # The same principle as the step above, for the signature that covers
      # everything a person downloads rather than the image. It was produced
      # and never read back, so a bundle signed over the wrong file, or one an
      # option change left empty, would have been found by a downloader.
      - name: Verify the checksums the way somebody else would
        run: |
          cosign verify-blob \
            --bundle bin/dist/SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/" \
            bin/dist/SHA256SUMS
          echo "SHA256SUMS verifies against this workflow's identity at $GITHUB_REF_NAME"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.name.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "bin/dist/*"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.name.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ needs.name.outputs.image }}
          CHARTS: ${{ needs.name.outputs.charts }}
          PRERELEASE: ${{ needs.name.outputs.prerelease }}
          LATEST: ${{ needs.name.outputs.latest }}
          PREVIOUS: ${{ needs.name.outputs.previous }}
        run: |
          version=$VERSION
          # The list of what changed is GitHub's, built from the titles of the
          # pull requests merged between the previous tag and this one and
          # grouped as .github/release.yml says. The previous tag is named
          # rather than left to GitHub, so the range is the one chosen above.
          if [ -n "$PREVIOUS" ]; then set -- -f previous_tag_name="$PREVIOUS"; else set --; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" "$@" --jq .body > /tmp/changes.md
          {
            cat /tmp/changes.md
            echo
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull $IMAGE:$version"
            echo '```'
            echo
            echo "Digest \`$IMAGE_DIGEST\`, signed with cosign against this workflow's identity."
            echo
            echo "## Helm chart"
            echo
            echo '```'
            echo "helm install openpsirt oci://$CHARTS/openpsirt --version $version"
            echo '```'
            echo
            echo "## Everything else"
            echo
            echo "The binaries, the CycloneDX inventories of the binaries and the image, \`SHA256SUMS\` and its cosign bundle are attached."
            echo "\`openpsirt-upload\` is the upload client a pipeline runs to send an analyzer's results, built for Linux, macOS and Windows."
            echo "Inventories are published because this tool ingests them for other people's software."
            echo
            echo "### Checking what you downloaded"
            echo
            echo '```'
            echo "cosign verify-blob \\"
            echo "  --bundle SHA256SUMS.cosign.bundle \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/' \\"
            echo "  SHA256SUMS"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "The signature covers \`SHA256SUMS\`, which covers every file above."
          } > /tmp/notes.md
          if [ "$PRERELEASE" = "true" ]; then set -- --prerelease; else set --; fi
          # GitHub marks a new release Latest unless told otherwise, so a fix
          # to an older line is told which it is, as the image tags are.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file /tmp/notes.md \
            --latest="$LATEST" \
            "$@" \
            bin/dist/*

  # The documentation is built where nothing can write: mkdocs and its
  # plugins run here, from pip. The pages branch it commits leaves as a git
  # bundle, and the job holding the write only fetches and pushes it.
  # Neither job is in the group docs.yml uses: a newer run queued in a group
  # cancels the one waiting there, and a release's pages would be lost. Two
  # builds racing on gh-pages cannot leave a version directory with no entry
  # in the switcher, because the publish job pushes only a fast-forward of
  # the branch the build started from, and refuses the other.
  docs-build:
    name: Build the documentation
    needs: [name, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      # --require-hashes refuses any distribution the lock does not name by
      # hash, transitive ones included — the guarantee go.sum and the npm
      # lockfile already give the other two ecosystems here.
      - run: pip install --require-hashes -r docs/requirements.txt
      - name: Configure committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A repository that has published nothing has no branch yet, and
          # mike makes one.
          if git rev-parse --verify -q origin/gh-pages > /dev/null; then
            git branch gh-pages origin/gh-pages
          fi
      # The published set is versioned so a reader can tell which release
      # they are looking at. A prerelease publishes under its own version and
      # moves nothing, and nor does a fix to an older line: "latest" has to
      # keep meaning the newest release somebody is meant to be running.
      # The pages name the release a reader deploys, and this build names the
      # tag it was started by rather than looking for the newest one.
      - name: Build under this version
        env:
          LATEST: ${{ needs.name.outputs.latest }}
          DOCS_RELEASE: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) mike deploy "$version" ;;
            *)   if [ "$LATEST" = "true" ]; then
                   mike deploy --update-aliases "$version" latest
                   mike set-default latest
                 else
                   mike deploy "$version"
                 fi ;;
          esac
          mkdir -p bin
          # The bundle holds what is new since the published branch, or the
          # whole branch where there is none.
          published=$(git rev-parse --verify -q origin/gh-pages || true)
          git bundle create bin/pages.bundle gh-pages ${published:+"^$published"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pages
          path: bin/pages.bundle
          if-no-files-found: error

  docs:
    name: Publish the documentation
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every branch, so the published one is here where it exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pages
          path: ${{ runner.temp }}/pages
      # Only a commit on top of the published branch is pushed, so a build
      # gone bad can add pages and never rewrite their history. The push is
      # never forced, so the remote refuses anything else as well; the check
      # says why.
      - name: Push the pages
        env:
          BUNDLE: ${{ runner.temp }}/pages/pages.bundle
        run: |
          git fetch "$BUNDLE" gh-pages:refs/heads/built
          if git rev-parse --verify -q origin/gh-pages > /dev/null; then
            git merge-base --is-ancestor origin/gh-pages built \
              || { echo "the published branch moved after the pages were built: re-run both documentation jobs"; exit 1; }
          fi
          git push origin built:gh-pages
