name: Release

# Publishing what "make dist" builds.
#
# The assets are not assembled here. `make dist` builds every one of them and
# checks that each names the same version, and this workflow runs that command
# — so what a developer can build locally and what is published are the same
# recipe, and a release failure reproduces with one command. What is here is
# only the part a checkout cannot do: pushing to the registry, signing against
# a workload identity, and creating the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # The release, and the documentation branch mike pushes to.
      contents: write
      # The image and the chart, both to ghcr.
      packages: write
      # Keyless signing and provenance: the identity is the workflow's own,
      # so there is no key to hold, rotate, or lose to whoever holds it next.
      id-token: write
      attestations: write

    steps:
      # Full history: `git describe` derives the version from the tag, and
      # mike needs the documentation branch. A shallow checkout has neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # A tag pointing at a commit that never reached main is a release of
      # something nothing gated. Everything on main arrived through the merge
      # queue with CI green; a tag on a side branch did not, and the assets
      # would be indistinguishable afterwards.
      # Nothing derived from the tag is substituted into a script in this file.
      # A ${{ }} value is expanded when the script is written, so a tag name
      # carrying shell syntax — which the ref format permits — would run here,
      # in a job holding the write, package and signing permissions, and the
      # failure path of the check meant to refuse it is one of the places it
      # would run. Every such value is passed through `env:` and read as a
      # variable, which the shell treats as data.
      - name: Confirm the tag is on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "${{ github.sha }}" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # "make dist" builds the interface before it builds the binaries, because
      # the binary embeds it. The version is the one the image builds with, and
      # "make pins-check" is what holds every copy of that number together.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # builder the default, and that driver does not load what it builds
      # into the daemon's image store — "make dist" builds the image and then
      # reads the two inventories out of it, so the image has to be there.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every asset, and the check that each names one version.
      - name: Build the release
        run: make dist

      - name: Name this release
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Anything with a hyphen after the patch number is a prerelease:
          # 0.1.0-rc.1 is, 0.1.0 is not. A prerelease moves no alias and takes
          # no floating tag — it exists to be tried, not to be landed on by
          # somebody who asked for the current version.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      # The image "make dist" already built and read the inventories out of,
      # pushed under the tags the design gives it. The exact tag never moves;
      # the others do, and neither is applied to a prerelease.
      - name: Push the image
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MINOR: ${{ steps.release.outputs.minor }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          image=ghcr.io/$GITHUB_REPOSITORY
          version=$VERSION
          docker push "$image:$version"
          if [ "$PRERELEASE" = "false" ]; then
            docker tag "$image:$version" "$image:$MINOR"
            docker tag "$image:$version" "$image:latest"
            docker push "$image:$MINOR"
            docker push "$image:latest"
          fi
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The digest is kept because the copy operators are told to install is
      # this one, and a registry copy is signed by digest. The identical
      # archive attached to the release is covered by SHA256SUMS; this one was
      # covered by nothing.
      - name: Push the chart
        id: chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          out=$(helm push "bin/dist/openpsirt-$VERSION.tgz" \
            "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts" 2>&1)
          echo "$out"
          digest=$(printf '%s\n' "$out" | awk '/^Digest: /{print $2}')
          [ -n "$digest" ] || { echo "::error::helm push named no digest, so the chart cannot be signed"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/$GITHUB_REPOSITORY@$DIGEST"

      - name: Sign the chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/openpsirt@$DIGEST"

      # One signature over the checksum file rather than one per asset: the
      # file already covers every asset, so a verifier checks one signature
      # and then the hashes.
      - name: Sign the checksums
        run: |
          cosign sign-blob --yes \
            --bundle bin/dist/SHA256SUMS.cosign.bundle \
            bin/dist/SHA256SUMS

      # A signature nobody has verified is a signature nobody has tested. This
      # is the command a third party runs, with the identity they would pin,
      # so a release that cannot be verified fails here rather than for them.
      - name: Verify the signature the way somebody else would
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          identity="^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST" > /dev/null
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            "ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/openpsirt@$CHART_DIGEST" > /dev/null
          echo "the image and the chart verify against this workflow's identity at $GITHUB_REF_NAME"

      # The same principle as the step above, for the signature that covers
      # everything a person downloads rather than the image. It was produced
      # and never read back, so a bundle signed over the wrong file, or one an
      # option change left empty, would have been found by a downloader.
      - name: Verify the checksums the way somebody else would
        run: |
          cosign verify-blob \
            --bundle bin/dist/SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/" \
            bin/dist/SHA256SUMS
          echo "SHA256SUMS verifies against this workflow's identity at $GITHUB_REF_NAME"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "bin/dist/*"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          version=$VERSION
          {
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ghcr.io/$GITHUB_REPOSITORY:$version"
            echo '```'
            echo
            echo "Digest \`$IMAGE_DIGEST\`, signed with cosign against this workflow's identity."
            echo
            echo "## Helm chart"
            echo
            echo '```'
            echo "helm install openpsirt oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/openpsirt --version $version"
            echo '```'
            echo
            echo "## Everything else"
            echo
            echo "The binaries, both CycloneDX inventories, \`SHA256SUMS\` and its cosign bundle are attached."
            echo "Inventories are published because this tool ingests them for other people's software."
            echo
            echo "### Checking what you downloaded"
            echo
            echo '```'
            echo "cosign verify-blob \\"
            echo "  --bundle SHA256SUMS.cosign.bundle \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/' \\"
            echo "  SHA256SUMS"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "The signature covers \`SHA256SUMS\`, which covers every file above."
          } > /tmp/notes.md
          if [ "$PRERELEASE" = "true" ]; then set -- --prerelease; else set --; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$version" \
            --notes-file /tmp/notes.md \
            "$@" \
            bin/dist/*

  # A job of its own, in the group docs.yml uses, because both push to the
  # same branch. Two mike runs racing on gh-pages is how a published set ends
  # up with a version directory and no entry in the switcher.
  docs:
    name: Publish the documentation
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      # --require-hashes refuses any distribution the lock does not name by
      # hash, transitive ones included — the guarantee go.sum and the npm
      # lockfile already give the other two ecosystems here.
      - run: pip install --require-hashes -r docs/requirements.txt
      - name: Configure committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # The published set is versioned so a reader can tell which release
      # they are looking at. A prerelease publishes under its own version and
      # moves nothing: "latest" has to keep meaning the newest release
      # somebody is meant to be running.
      - name: Publish under this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) mike deploy --push "$version" ;;
            *)   mike deploy --push --update-aliases "$version" latest
                 mike set-default --push latest ;;
          esac
