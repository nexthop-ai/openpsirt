# Any number of replicas run the same binary with no leader; every one serves,
# reads scans and runs the scanner, and the database coordinates them. That
# rules SQLite out for more than one: it is a file inside one pod, so the chart
# refuses a SQLite URL with replicaCount above 1.
replicaCount: 2

# How long Kubernetes waits for a pod to stop before killing it. The process
# drains requests for its shutdown grace (15 seconds unless
# OPENPSIRT_SHUTDOWN_GRACE says otherwise) and then waits the same again for a
# scan mid-application, so this is twice that with room to spare. Raise both
# together if the grace is raised through extraEnv.
terminationGracePeriodSeconds: 60

# Scratch space for the process, since the root filesystem is read-only. An
# emptyDir without a limit is node disk that a stray file can fill.
tmp:
  sizeLimit: 1Gi

image:
  # Published by the release workflow, one image per tag. While the repository
  # is private this needs a pull secret your cluster can use; see
  # imagePullSecrets below. The image is single-architecture: `linux/amd64`.
  #
  # There is no image before the first tag. Until then, build one from the
  # repository and push it somewhere your cluster can reach, then point this
  # there — left as it stands with nothing published, you get a pod that
  # cannot pull.
  repository: ghcr.io/nexthop-ai/openpsirt
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

database:
  # Where the database is and how to reach it. Supply exactly one of these.
  #
  #   url          set it here, and the chart creates a Secret holding it
  #   existingSecret  name a Secret you manage yourself
  #
  # Putting a password in values.yaml means it ends up in your release history
  # and probably in version control, so existingSecret is the better habit.
  #
  # The connection is encrypted where the server offers it and accepted
  # without encryption where it does not, on every engine. That is a floor,
  # not a guarantee, and the rows are undisclosed findings — so a deployment
  # crossing anything it does not own says so in the URL: sslmode=verify-full
  # for PostgreSQL, tls=true for MySQL and MariaDB. Whatever the URL says
  # about the transport is left as written.
  #
  # existingSecretKey names the key inside a Secret you manage. It is read only
  # when existingSecret is set: a Secret the chart creates holds the value
  # under a key of the chart's own, and the same is true of every pair below.
  url: ""
  existingSecret: ""
  existingSecretKey: "database-url"

# Who may sign in, and how. **The process refuses to start until somebody can
# administer it**, because a deployment nobody can administer has one route
# back in — editing the database by hand — and nobody discovers that at a good
# moment.
#
# The minimum for a working install is bootstrapAdmins plus one provider.
auth:
  # Identities granted administration at every startup, not just the first.
  # That makes this the recovery path as well as the bootstrap: lose access,
  # add yourself here, and restart.
  #
  # An identity is what the provider calls the person — the OIDC username
  # claim, the GitHub login, or whatever the trusted header carries. Written
  # plainly, with no prefix: one provider is configured at a time, and the same
  # name from the trusted header is the same person. Naming somebody grants
  # them a role; it does not let them in without signing in.
  bootstrapAdmins: []
  # Where this deployment answers, as people reach it — written in full, with
  # a scheme and no path below it: https://psirt.example.com
  #
  # A provider sends somebody back to an address and compares it against what
  # it was registered with, so it is stated rather than taken from whatever a
  # request claims its host is. Required once any provider is configured.
  #
  # A bare host is refused at startup. With no scheme there is no host to read,
  # so the same-origin check on every state-changing browser request fell back
  # to the address the request itself claimed.
  baseURL: ""

  # Sign-in through an OpenID Connect provider. Leave issuer empty to skip.
  # One provider is configured at a time: setting this alongside github.clientID
  # below stops the process.
  oidc:
    name: oidc
    issuer: ""
    clientID: ""
    # Set clientSecret here and the chart puts it in a Secret, or name one you
    # manage yourself — one of the two, never both. A secret in values.yaml
    # ends up in your release history and probably in version control. The
    # process refuses to start without one, so an install that names an issuer
    # and no secret is refused here rather than becoming a pod that never
    # starts.
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: "oidc-client-secret"
    # Which claim carries the username. **Required**, with no default: it is
    # what an authorization written for somebody who has not signed in yet is
    # redeemed against, and a provider that lets people choose their own is a
    # question only this deployment's operator can answer. The configuration
    # reference names the usual answer for each provider.
    usernameClaim: ""
    # Which claim carries group membership. Empty means the provider's usual
    # one.
    groupsClaim: ""

  # Sign-in through GitHub. Leave clientID empty to skip. Not to be set
  # alongside oidc.issuer above.
  github:
    clientID: ""
    # As above: one of the two, never both, and one is required.
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: "github-client-secret"
    # Restrict to members of one organization. Empty means anybody with a
    # GitHub account, which is rarely what you want.
    org: ""

  # Sign-in asserted by something in front of this — an identity-aware proxy.
  # **Both parts are required together**: a header named with nothing to trust
  # it from is either a mistake or the first half of one, and the process stops
  # rather than accepting a header anybody can set.
  trustedHeader:
    name: ""
    # Addresses or CIDR ranges the header is believed from. Anything else
    # presenting it is ignored.
    sources: []
    # Where group membership arrives, if the proxy asserts it.
    groupsHeader: ""
    groupsDelimiter: ","

# Mail is how anything leaves the application. Leave server empty and this
# deployment tells nobody anything outside it, which is a supported way to run:
# the notification area in the interface still works. Who gets what is each
# person's own setting rather than a deployment one.
mail:
  # Both together, or neither: one without the other fails at render, since a
  # server with nobody to send as sends nothing and nothing is what an
  # operator would never notice.
  server: ""
  from: ""
  # Credentials, where the server wants them. They are sent only over a
  # connection STARTTLS secured; a server that will not secure one is refused
  # rather than handed the password anyway.
  username: ""
  # Set password here and the chart puts it in a Secret, or name one you
  # manage yourself. A secret in values.yaml ends up in your release history
  # and probably in version control.
  password: ""
  existingSecret: ""
  existingSecretKey: "mail-password"

# Schema changes are applied at startup by default, which makes an upgrade
# just a deployment. Turn this off to run "openpsirt migrate up" yourself,
# under different credentials, at a time you choose.
autoMigrate: true

log:
  level: info
  # json rather than the binary's own default of text: a collector reads these,
  # and the configuration reference says which default belongs to which.
  format: json

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openpsirt.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Sized for two processes, not one. The server reads a document within the
# ingest bounds, and it also execs the scanner, which is a child in the same
# cgroup — so the scanner's own memory comes out of this number. Sized for the
# server alone, the kernel picks the scanner as the process to kill, and the
# scan fails as a run that failed while the pod stays up.
#
# The largest single draw is the scanner importing its vulnerability database,
# which happens on every start unless the cache below is kept. Keep the cache
# and the steady state is much lower than the ceiling here.
#
# Raise both together with the ingest bounds. `OPENPSIRT_INGEST_*` allows about
# 250 MB for one document being read, and that is the server's half.
#
# Patch branch lookups, where `patchBranches.enabled` turns them on, add git as a
# third process in the same cgroup: 1.3 GB at the peak of a first fetch of the
# kernel from kernel.org, which can coincide with a scan. Raise the limit to 4Gi
# before turning them on; over the limit, the kernel may kill the server itself.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# Nothing here needs root, a writable filesystem, or any capability.
podSecurityContext:
  runAsNonRoot: true
  # Pinned in the image, not chosen by the package manager.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Migrations run before the service starts answering. A schema change over a
# large table can take a while, and a startup probe that gives up part way
# through kills the pod and starts the migration again from the beginning.
# failureThreshold x periodSeconds is how long a migration may take.
startupProbe:
  periodSeconds: 5
  failureThreshold: 120

livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# The vulnerability scanner ships in the image. This deployment runs the scan
# rather than trusting whatever a producer's pipeline installed, so that counts
# are comparable between products rather than being a property of somebody's
# build image.
scanner:
  # Where it keeps its vulnerability data. The image sets the same path, and
  # changing it here without changing it there leaves the data on the
  # read-only root filesystem, where it cannot be written.
  cacheDir: /var/cache/openpsirt/grype
  # Keeping the vulnerability database across restarts is the difference
  # between importing it once and importing it on every start. The import is
  # the largest thing this pod does with memory, so a deployment that restarts
  # is a deployment that pays that peak repeatedly — which is what the
  # resources above have to be large enough to survive.
  #
  # Scratch space is the default, so an install needs no storage to work.
  persistence:
    # Have the chart create the claim. Off by default: a chart that provisions
    # storage on an upgrade surprises an installation that had none.
    #
    # The access mode has to match replicaCount. ReadWriteOnce is one node, so
    # more than one replica needs ReadWriteMany, a storage class that allows
    # it, or a replicaCount of 1 — otherwise the pods that do not land on the
    # volume's node stay Pending. Render-time refusals catch the pairing the
    # chart can see.
    enabled: false
    # Empty takes the cluster's default class.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    # A claim made elsewhere, used instead of one this chart creates. Set this
    # and `enabled` is not consulted.
    existingClaim: ""
    # The bound on the scratch space used when neither of the two above is
    # set. It is node disk, so it is bounded rather than left open.
    sizeLimit: 10Gi

# Where nothing is fetched from: no repository a patch link names and no
# supplier's directory. A report and a supplier's own description choose the
# hosts, so list your internal domains and networks here. Loopback and private
# address space are refused regardless.
outbound:
  excluded: []
  #   - corp.example.com
  #   - 203.0.113.0/24

# Labeling a patch link with the branches its commit is on, which fetches the
# repositories reports link to. Off unless turned on here. Before turning it on:
#   - raise `resources.limits.memory` to 4Gi
#   - set `outbound.excluded`
#   - name `existingClaim` below, so the copies survive a restart
patchBranches:
  enabled: false
  # How many bytes the copies may hold together, as a whole number. Empty takes
  # the built-in 20 GB, which holds the kernel's full history beside others.
  quota: ""
  # A claim to keep the copies on. Without one they are scratch space and are
  # fetched again after every restart — fifteen minutes and 5 GB for the kernel.
  #
  # With more than one replica: one replica fetches at a time, and every
  # replica serves the branch labels, which live in the database. Use a
  # ReadWriteMany claim shared by all of them. A ReadWriteOnce claim leaves the
  # replicas on other nodes Pending, and the chart cannot catch that because it
  # cannot see the access mode of a claim it did not make. With no claim, each
  # pod keeps its own scratch copy and fetches again whenever the work moves
  # to it.
  existingClaim: ""
  # The bound on that scratch space. Empty follows the quota with a fifth
  # beside it, 24 GB for the built-in one: a copy arriving adds to the copies
  # kept, and scratch space past its bound gets the pod evicted, after which
  # the copies are fetched again and it happens again. A claim of your own
  # needs the same headroom.
  sizeLimit: ""

