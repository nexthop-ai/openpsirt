{{- if and .Values.auth.trustedHeader.name .Values.networkPolicy.enabled }}
{{- $controller := .Values.networkPolicy.ingressController }}
{{- $namespaces := dict }}
{{- $pods := dict }}
{{- if $controller.enabled }}
{{- $namespaces = $controller.namespaceLabels | default dict }}
{{- $pods = $controller.podLabels | default dict }}
{{- /* Defaults applied here rather than in values.yaml: Helm merges an operator's map into a default map, so a controller's own labels would be kept beside ingress-nginx's and match no pod. */}}
{{- if not (or $namespaces $pods) }}
{{- $namespaces = dict "kubernetes.io/metadata.name" "ingress-nginx" }}
{{- $pods = dict "app.kubernetes.io/name" "ingress-nginx" }}
{{- end }}
{{- end }}
{{- if not (or $namespaces $pods .Values.networkPolicy.from) }}
{{- fail "set networkPolicy.ingressController or networkPolicy.from: sign-in is asserted by a header, and a policy that admits nobody would refuse the proxy that sets it. Set networkPolicy.enabled=false only where something else keeps other pods from reaching this one" }}
{{- end }}
# Only the ingress controller, and what networkPolicy.from names, may reach the
# pods: the sign-in header is believed by address alone, and every other pod in
# the cluster would otherwise be able to assert it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openpsirt.fullname" . }}
  labels: {{- include "openpsirt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "openpsirt.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if or $namespaces $pods }}
        {{- /* A podSelector alone selects pods in this namespace only, so a controller named by its pods alone is looked for in every namespace. */}}
        - {{- if $namespaces }}
          namespaceSelector:
            matchLabels: {{- toYaml $namespaces | nindent 14 }}
          {{- else }}
          namespaceSelector: {}
          {{- end }}
          {{- with $pods }}
          podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
        {{- with .Values.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
