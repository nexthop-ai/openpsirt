info:
  description: Track vulnerabilities in the products you ship.
  title: OpenPSIRT
  version: dev
openapi: 3.1.0
paths:
  /v1/administration/changes:
    get:
      description: |-
        Who changed a setting, a role grant, a routing rule, a support date, a credential, an account, a team or an issue's names — with what it held before and what it holds now.

        This is the layer above the triage record rather than part of it. Three of the things listed here silently rewrite what the tool reports: the deadline windows recompute every open finding's deadline, the triage floor takes the deadline off everything below it, and an end-of-life date takes it off everything past it.

        Newest first, and paged: it only grows.

        **Requires:** administrator
      operationId: list-administrative-changes
      parameters:
        - description: Keep only changes of one kind
          explode: false
          in: query
          name: kind
          schema:
            description: Keep only changes of one kind
            enum:
              - setting
              - role
              - routing
              - support
              - release
              - credential
              - account
              - team
              - case
              - alias
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-administrative-changesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List administrative changes
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/advisories:
    get:
      description: |-
        Every advisory published from this deployment in a period, newest first, with which flaw it was about, which revision it was, who published it and what the document hashed to at the time.

        **Advisories are about flaws in our own product**, recorded here by hand. Known issues in third-party components are tracked and fixed rather than published about, and the document for those is a VEX statement per build.

        `ordinal` above one is a revision of an advisory already out, which is the entry a period is usually read for.

        Narrowed by what you may see: a flaw nobody has disclosed is absent for anybody who may not read it, and a count is as much a disclosure as a row.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-published-advisories
      parameters:
        - description: Limit to one product, by name
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name
            type: string
        - description: How far back to look, by when the advisory went out
          explode: false
          in: query
          name: days
          schema:
            default: 365
            description: How far back to look, by when the advisory went out
            format: int64
            maximum: 3650
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyWentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List advisories that have gone out
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/approval-batches/{batch}:
    delete:
      description: |-
        Withdraws every approval recorded under this batch name, returning those decisions to the review queue. The decisions themselves stand — only the approvals are undone. Returns how many were affected.

        Only decisions you may reach are touched.

        **Requires:** approver or public-triage or private-triage on the product. What you hold decides what comes back rather than whether you may ask. A batch is one reviewer's afternoon and may span products, so it is undone as far as you reach and no further.
      operationId: undo-batch
      parameters:
        - in: path
          name: batch
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Undo-batchResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Undo a bulk approval
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - approver
          - public-triage
          - private-triage
        note: A batch is one reviewer's afternoon and may span products, so it is undone as far as you reach and no further.
        narrowed: true
  /v1/approvals/scrutiny:
    get:
      description: |-
        Five answers about approvals over a period, for somebody auditing whether they mean anything here.

        `alone` is risk standing with nobody's agreement behind it, by outcome. That is not a failure by itself: a short deferral and an upgrade promised inside the deadline the work already had are both deliberately exempt. A dismissal in this list is a different matter.

        `bulk` is agreements given as one act over many claims, `pairs` is who agrees with whom and what share of everything ran between them, `lapsed` is agreements standing from somebody who no longer holds the right to give one, and `grew` is what somebody agreed to against what the same claim reaches now — a claim reaches by matching, so a build appearing afterwards is covered with nobody acting.

        Everything is dated by when the claim was proposed, not by when it was agreed to, and narrowed by what you may see.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-approval-scrutiny
      parameters:
        - description: Limit to one product, by name
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name
            type: string
        - description: How far back to look, by when a claim was proposed
          explode: false
          in: query
          name: days
          schema:
            default: 90
            description: How far back to look, by when a claim was proposed
            format: int64
            maximum: 3650
            minimum: 1
            type: integer
        - description: How many rows each section carries at most. capped says a section reached it
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: How many rows each section carries at most. capped says a section reached it
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrutinyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get approval coverage
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/assessments:
    get:
      description: |-
        Every claim about an issue you may be told about, or those in one state, or those belonging to one product. The ones waiting are milder ratings somebody has proposed and nobody has agreed to yet, which are the ones not yet affecting anything.

        A rating belongs to one product, so a row says which. Two products may rate the same issue differently and both rows appear, each narrowed by what you may read in its own product.

        A claim carries the severity recorded against its issue, so claims about findings you cannot read are absent rather than refused.

        **Requires:** any signed-in person, and not a pipeline key. Narrowed to issues you may read a finding of in the product the rating belongs to. A rating is about one product, and an issue this deployment minted for a flaw nobody has announced is not public knowledge.
      operationId: list-assessments
      parameters:
        - description: Limit to one product, by name
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name
            type: string
        - description: Limit to one state
          explode: false
          in: query
          name: state
          schema:
            description: Limit to one state
            enum:
              - proposed
              - live
              - withdrawn
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyAssessmentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List issue assessments
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Narrowed to issues you may read a finding of in the product the rating belongs to. A rating is about one product, and an issue this deployment minted for a flaw nobody has announced is not public knowledge.
  /v1/assessments/{id}:
    delete:
      description: |-
        The rating in force in that product returns to the published one, and everything that reads it — where a finding sits in the list, how long it has, whether it is above the line the product triages — follows it back. No other product is touched.

        Asked of triage **on the product the rating belongs to**: taking a rating back is making one.

        **Requires:** public-triage or private-triage on the product. The product is the rating's own, not one in the path.
      operationId: withdraw-assessment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw an assessment, and take the published rating back
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
        note: The product is the rating's own, not one in the path.
  /v1/assessments/{id}/agreement:
    post:
      description: |-
        Only a milder rating waits for this. Somebody other than whoever proposed it, for the same reason every other second person here is somebody else: a control one person can complete alone is not a control.

        The second person holds their role **on the product the rating belongs to**. Agreeing is what puts a milder rating into force, so it moves that product's deadlines and its triage line; a rating in a product you hold nothing on answers as one that is not there.

        **Requires:** approver or public-triage or private-triage on the product. The proposer may not approve their own. The product is the rating's own, not one in the path.
      operationId: agree-assessment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a rating assessment
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - approver
          - public-triage
          - private-triage
        note: The proposer may not approve their own. The product is the rating's own, not one in the path.
  /v1/assignments:
    get:
      description: |-
        Returns everyone holding open work you can see, with how much.

        Counted in pieces of work — an issue in a component in a product — which is the unit the list behind each person is in. `places` says how many findings those cover: one flaw in a kernel is one thing to answer and can be dozens of rows to write.

        The number worth watching is not how many findings exist but how many are waiting behind somebody: an idle account holding nothing is harmless, and work stuck behind a person who has gone is the problem — nothing tells this software that somebody has left.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-holdings
      parameters:
        - description: Limit to work held in one product, by name. Empty means every product you can see; a name you cannot see is refused rather than answered empty
          explode: false
          in: query
          name: product
          schema:
            description: Limit to work held in one product, by name. Empty means every product you can see; a name you cannot see is refused rather than answered empty
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyHoldingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List assignment totals
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/attachments/{token}:
    delete:
      description: |-
        Takes the bytes back out and leaves the record. The reference in the text stays and says the file was removed, which is the difference between a redaction and a hole in the record.

        Administrators only. A reason is required, and it is recorded and shown wherever the text referred to the file.

        **Requires:** administrator
      operationId: redact-attachment
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Redact-attachmentRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove an attached file
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
    get:
      description: |-
        Authorized against the issue the file hangs off — whoever may read the text may read what it refers to — and only then served.

        **Two shapes, and a caller has to follow both.** An image displayed in the page is sent from here; everything else answers 303 with a short-lived address at the store. Either way the content type and the disposition are the ones decided at upload, never the ones the file arrived with.

        A file an administrator removed answers 410: the record and the reference remain, and the bytes are gone on purpose.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: fetch-attachment
      parameters:
        - description: "The identifier text refers to, without the attachment: prefix"
          in: path
          name: token
          required: true
          schema:
            description: "The identifier text refers to, without the attachment: prefix"
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Fetch an attached file
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/audit:
    get:
      description: |-
        Every judgment recorded in a period, newest first, with what it was about, the reasoning it rests on, who proposed it and when, and who agreed and when — including agreements later taken back.

        The period is the date a judgment was **proposed**, not approved: a judgment belongs to when it was argued, and dating it by its agreement would move it out of that period whenever an approval came late, which is the ordinary case.

        Narrowed by what you may see, like every other list here. Nothing about this view is exempt from the visibility rules — a report showing more than the screens it summarizes would be a way around them.

        `alone=true` returns judgments no second person has a standing agreement on. That population is large and legitimate on its own — an outcome that hides nothing needs no second person, and a short deferral stands alone — so ask it with an outcome. Asked of a dismissal it should return nothing: `not-applicable`, `wont-fix` and `already-fixed` all require approval, so a row in that answer is a control that failed.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-audit
      parameters:
        - description: Limit to these products, by name. Repeatable; any of them matches
          explode: true
          in: query
          name: product
          schema:
            description: Limit to these products, by name. Repeatable; any of them matches
            items:
              type: string
            type:
              - array
              - "null"
        - description: Limit to these kinds of judgment. Repeatable; any of them matches
          explode: true
          in: query
          name: outcome
          schema:
            description: Limit to these kinds of judgment. Repeatable; any of them matches
            items:
              enum:
                - affected
                - not-applicable
                - deferred
                - wont-fix
                - already-fixed
                - upgrade-needed
                - patch-needed
              type: string
            type:
              - array
              - "null"
        - description: Limit to these states. Repeatable; any of them matches
          explode: true
          in: query
          name: state
          schema:
            description: Limit to these states. Repeatable; any of them matches
            items:
              enum:
                - proposed
                - approved
                - withdrawn
                - lapsed
              type: string
            type:
              - array
              - "null"
        - description: Only judgments proposed on or after this date, as YYYY-MM-DD
          explode: false
          in: query
          name: from
          schema:
            description: Only judgments proposed on or after this date, as YYYY-MM-DD
            type: string
        - description: Only judgments proposed before this date, as YYYY-MM-DD
          explode: false
          in: query
          name: to
          schema:
            description: Only judgments proposed before this date, as YYYY-MM-DD
            type: string
        - description: Only judgments no second person has a standing agreement on. Asked of a dismissal this should answer nothing
          explode: false
          in: query
          name: alone
          schema:
            description: Only judgments no second person has a standing agreement on. Asked of a dismissal this should answer nothing
            type: boolean
        - description: Only judgments this person proposed, by sign-in identity
          explode: false
          in: query
          name: proposed_by
          schema:
            description: Only judgments this person proposed, by sign-in identity
            type: string
        - description: Only judgments this person has a standing agreement on, by sign-in identity. An agreement later taken back does not match
          explode: false
          in: query
          name: approved_by
          schema:
            description: Only judgments this person has a standing agreement on, by sign-in identity. An agreement later taken back does not match
            type: string
        - description: Only judgments about this vulnerability, under the name it is filed here
          explode: false
          in: query
          name: issue
          schema:
            description: Only judgments about this vulnerability, under the name it is filed here
            type: string
        - description: Only judgments about this component, by name
          explode: false
          in: query
          name: component
          schema:
            description: Only judgments about this component, by name
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-auditResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List judgments with who made them and who agreed
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/audit.{format}:
    get:
      description: |-
        The audit list as a file: every judgment the same filters would show, not one page of them.

        **One row per judgment**, with who proposed it, who has a standing agreement on it, and whether a second person does. Approvals are joined with `;` in the CSV because a spreadsheet has one cell per column and an auditor reads them as a list; the JSON keeps them as one field of the same shape.

        **Read with your own visibility, as it streams.** Nothing about a report is exempt from the rules the screens follow — a file showing more than the screen that summarizes it would be a way around them.

        Takes every filter the audit list takes, including the period.

        **Requires:** any signed-in person, and not a pipeline key. Exports only what you may see.
      operationId: export-audit
      parameters:
        - description: Limit to these products, by name. Repeatable; any of them matches
          explode: true
          in: query
          name: product
          schema:
            description: Limit to these products, by name. Repeatable; any of them matches
            items:
              type: string
            type:
              - array
              - "null"
        - description: Limit to these kinds of judgment. Repeatable; any of them matches
          explode: true
          in: query
          name: outcome
          schema:
            description: Limit to these kinds of judgment. Repeatable; any of them matches
            items:
              enum:
                - affected
                - not-applicable
                - deferred
                - wont-fix
                - already-fixed
                - upgrade-needed
                - patch-needed
              type: string
            type:
              - array
              - "null"
        - description: Limit to these states. Repeatable; any of them matches
          explode: true
          in: query
          name: state
          schema:
            description: Limit to these states. Repeatable; any of them matches
            items:
              enum:
                - proposed
                - approved
                - withdrawn
                - lapsed
              type: string
            type:
              - array
              - "null"
        - description: Only judgments proposed on or after this date, as YYYY-MM-DD
          explode: false
          in: query
          name: from
          schema:
            description: Only judgments proposed on or after this date, as YYYY-MM-DD
            type: string
        - description: Only judgments proposed before this date, as YYYY-MM-DD
          explode: false
          in: query
          name: to
          schema:
            description: Only judgments proposed before this date, as YYYY-MM-DD
            type: string
        - description: Only judgments no second person has a standing agreement on. Asked of a dismissal this should answer nothing
          explode: false
          in: query
          name: alone
          schema:
            description: Only judgments no second person has a standing agreement on. Asked of a dismissal this should answer nothing
            type: boolean
        - description: Only judgments this person proposed, by sign-in identity
          explode: false
          in: query
          name: proposed_by
          schema:
            description: Only judgments this person proposed, by sign-in identity
            type: string
        - description: Only judgments this person has a standing agreement on, by sign-in identity. An agreement later taken back does not match
          explode: false
          in: query
          name: approved_by
          schema:
            description: Only judgments this person has a standing agreement on, by sign-in identity. An agreement later taken back does not match
            type: string
        - description: Only judgments about this vulnerability, under the name it is filed here
          explode: false
          in: query
          name: issue
          schema:
            description: Only judgments about this vulnerability, under the name it is filed here
            type: string
        - description: Only judgments about this component, by name
          explode: false
          in: query
