  /v1/products/{product}/findings/components.{format}:
    get:
      description: |-
        One row per component and version, with how many distinct issues are open against it and how many places those sit at — every row, not one page.

        This is the shape a release meeting argues over: where the weight is rather than what is wrong. On a switch operating-system image the kernel carried 4,943 of 6,822 findings rows and the next largest contributor carried 58, which is a one-line answer here and invisible in a list of issues.

        Takes the same filters as the by-component list, and the line this deployment triages at is stated in the file.

        **Requires:** any signed-in person, and not a pipeline key. Exports only what you may see.
      operationId: export-finding-components
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: format
          required: true
          schema:
            enum:
              - csv
              - json
            type: string
        - explode: false
          in: query
          name: stream
          schema:
            type: string
        - explode: false
          in: query
          name: variant
          schema:
            type: string
        - description: Keep only what sits at this component or anywhere under it — what the dependency tree's cumulative count counts. The name must be in the build; a name that is not, or that the build holds at more than one version, is refused
          explode: false
          in: query
          name: beneath
          schema:
            description: Keep only what sits at this component or anywhere under it — what the dependency tree's cumulative count counts. The name must be in the build; a name that is not, or that the build holds at more than one version, is refused
            type: string
        - description: Keep only groups open in some builds of this selection and not others. Meaningless where the selection is one build, and ignored there
          explode: false
          in: query
          name: differs
          schema:
            description: Keep only groups open in some builds of this selection and not others. Meaningless where the selection is one build, and ignored there
            type: boolean
        - description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
          explode: false
          in: query
          name: severity
          schema:
            description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
            enum:
              - low
              - medium
              - high
              - critical
            type: string
        - description: Keep only issues somebody is known to be exploiting
          explode: false
          in: query
          name: exploited
