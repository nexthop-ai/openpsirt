components:
  schemas:
    AboutPersonBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AboutPersonBody.json
          format: uri
          readOnly: true
          type: string
        admin:
          description: Whether they administer this deployment
          type: boolean
        deactivated_at:
          description: When they left. Absent means they are active
          type: string
        display_name:
          type: string
        held:
          items:
            $ref: "#/components/schemas/HeldChangeBody"
          type:
            - array
            - "null"
        held_total:
          description: How many role changes there are, of which the list above is a page
          format: int64
          type: integer
        holds:
          items:
            $ref: "#/components/schemas/HeldBody"
          type:
            - array
            - "null"
        identity:
          type: string
        record:
          $ref: "#/components/schemas/PersonRecordBody"
        sees_nothing:
          description: Every role they hold is a capability, so they reach no product. A capability is bounded by what its holder may read, so on its own it grants nothing
          type: boolean
        told:
          items:
            $ref: "#/components/schemas/ToldBody"
          type:
            - array
            - "null"
        told_total:
          description: "How many things they were told that you may read, of which the list above is a page. Narrowed like the list: administering decides who may ask, not what the answer contains"
          format: int64
          type: integer
      required:
        - identity
        - held_total
        - record
        - told_total
      type: object
    Acknowledge-all-notificationsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Acknowledge-all-notificationsResponse.json
          format: uri
          readOnly: true
          type: string
        acknowledged:
          description: How many were waiting
          format: int64
          type: integer
      required:
        - acknowledged
      type: object
    Add-outboundRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Add-outboundRequest.json
          format: uri
          readOnly: true
          type: string
        kind:
          description: One notification kind, or * for all of them
          maxLength: 191
          minLength: 1
          type: string
        name:
          maxLength: 191
          minLength: 1
          type: string
        secret:
          description: What requests are signed with. Never returned by any endpoint
          maxLength: 400
          minLength: 16
          type: string
        url:
          description: Where to send it. https only
          maxLength: 1000
          minLength: 1
          type: string
      required:
        - name
        - kind
        - url
        - secret
      type: object
    Add-routing-ruleRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Add-routing-ruleRequest.json
          format: uri
          readOnly: true
          type: string
        beneath:
          description: A component name, matching it and everything under it
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        team:
          description: Where work lands, by team name
          minLength: 1
          type: string
        upstream:
          description: A source package name
          type: string
      required:
        - name
        - team
      type: object
    AffectsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AffectsBody.json
          format: uri
          readOnly: true
          type: string
        added:
          description: Builds it is now filed against that it was not
          format: int64
          type: integer
        closed:
          description: Builds taken back out, closed as invalid because they were never affected
          format: int64
          type: integer
      required:
        - added
        - closed
      type: object
    AgreedBody:
      additionalProperties: false
      properties:
        at:
          description: When they agreed
          type: string
        by:
          description: Their sign-in identity
          type: string
        carried:
          description: Whether this agreement was carried forward from an earlier claim rather than given for this one
          type: boolean
        withdrawn_at:
          description: When the agreement was taken back, by the approver or by somebody editing the words it was given for
          type: string
      required:
        - by
        - at
      type: object
    AlsoBuild:
      additionalProperties: false
      properties:
        stream:
          type: string
        variant:
          type: string
        version:
          description: The version that build ships under this name, where it ships more than one
          type: string
      required:
        - stream
        - variant
      type: object
    AnywhereOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AnywhereOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/FindingBody"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    ApprovalBody:
      additionalProperties: false
      properties:
        approved_at:
          type: string
        approved_by:
          type: string
        batch:
          description: The batch it was approved under, if it was a bulk approval
          type: string
        carried_from:
          description: The approval this was carried forward from, where a re-affirmation stood on an earlier agreement rather than a fresh one
          format: int64
          type: integer
        covered:
          description: Findings this covered when it was agreed to
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        revision_id:
          description: Which revision of the justification was agreed to
          format: int64
          type: integer
        withdrawn_at:
          description: When this approval was taken back, if it was
          type: string
      required:
        - id
        - revision_id
        - approved_by
        - approved_at
      type: object
    AroundBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AroundBody.json
          format: uri
          readOnly: true
          type: string
        above:
          description: What pulls this in — usually short, and the direction people use
          items:
            $ref: "#/components/schemas/NeighborBody"
          type:
            - array
            - "null"
        below:
          description: What it pulls in
          items:
            $ref: "#/components/schemas/NeighborBody"
          type:
            - array
            - "null"
      required:
        - above
        - below
      type: object
    AssessmentBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AssessmentBody.json
          format: uri
          readOnly: true
          type: string
        id:
          format: int64
          type: integer
        mine:
          description: You made this rating, so you may not be the one who agrees
          type: boolean
        needs_approval:
          description: Whether a second person has to agree before it takes effect
          type: boolean
        off_the_list:
          description: How many of them this rating would put below the product's triage line, where they stop being work and carry no deadline
          format: int64
          type: integer
        open:
          description: Open findings of this issue you can see in this product
          format: int64
          type: integer
        product:
          description: The product this rating belongs to, by the name an address takes
          type: string
        product_name:
          description: How that product is spelled on screen
          type: string
        published:
          description: What was published when this was made, kept so a reader can see what we disagreed with
          type: string
        reasoning:
          description: Why. It outlives the version it was made about, so the next person needs the argument
          maxLength: 65536
          minLength: 1
          type: string
        severity:
          description: What this product rates it
          enum:
            - low
            - medium
            - high
            - critical
          type: string
        state:
          enum:
            - proposed
            - live
            - withdrawn
          type: string
        vulnerability:
          description: The issue this is about
          type: string
      required:
        - severity
        - reasoning
      type: object
    Assign-findingRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Assign-findingRequest.json
          format: uri
          readOnly: true
          type: string
        person:
          description: Their sign-in identity, or empty for nobody
          type: string
        team:
          description: "A team to route it to instead, by name. A queue rather than a holding: it stays unheld until somebody takes it"
          type: string
      type: object
    AtComponentBody:
      additionalProperties: false
      properties:
        fixed_in:
          description: The version the report says fixes it, where it names one
          type: string
        places:
          description: How many places in this build it sits at
          format: int64
          type: integer
        severity:
          description: How bad the report rates it
          type: string
        vulnerability:
          type: string
      required:
        - vulnerability
        - places
      type: object
    AttachmentBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AttachmentBody.json
          format: uri
          readOnly: true
          type: string
        content_type:
          description: What it is served as, which is decided here and is not what the uploader called it
          type: string
        filename:
          description: What it was called when it arrived
          type: string
        inline:
          description: Whether it is displayed in the page rather than downloaded. Only a small allowlist of raster image types is
          type: boolean
        redacted:
          description: The file was removed on purpose. The record of it remains
          type: boolean
        redacted_reason:
          description: Why it was removed
          type: string
        reference:
          description: What to paste into a justification or a comment
          type: string
        size:
          description: Bytes
          format: int64
          type: integer
        token:
          description: Refer to this in text as attachment:<token>. It is the only identifier for a file, and never an address
          type: string
        uploaded_at:
          type: string
      required:
        - token
        - reference
        - filename
        - content_type
        - size
        - uploaded_at
      type: object
    BecameBody:
      additionalProperties: false
      properties:
        by:
          description: Who did it, where a person did
          type: string
        claim:
          $ref: "#/components/schemas/ClaimBody"
        decision:
          $ref: "#/components/schemas/DecisionBody"
        decisions:
          description: How many rows the claim wrote
          format: int64
          type: integer
        finding:
          $ref: "#/components/schemas/FindingRefBody"
          description: What the representative decision is about. Absent where no open finding sits at its place
        happened:
          description: What became of the claim
          enum:
            - waiting
            - sent-back
            - approved
            - withdrawn
            - lapsed
            - undone
            - mixed
          type: string
        issues:
          description: How many distinct issues it covers
          format: int64
          type: integer
        outliers:
          $ref: "#/components/schemas/OutliersBody"
          description: What in a bulk claim does not look like the rest. Absent for a claim about one issue and for one nothing can still be held back from
        place:
          $ref: "#/components/schemas/PlaceBody"
        places:
          description: How many distinct places it covers
          format: int64
          type: integer
        reasoning:
          type: string
        when:
          description: When it became that, as a date and time
          type: string
      required:
        - claim
        - decision
        - place
        - happened
        - reasoning
        - decisions
        - issues
        - places
      type: object
    BecameOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BecameOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/BecameBody"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    BindingBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BindingBody.json
          format: uri
          readOnly: true
          type: string
        group:
          description: The group exactly as the provider names it — a team slug, or a claim value. Matched with its capitals, because it is the provider's identity rather than a name typed here
          maxLength: 191
          minLength: 1
          type: string
        product:
          description: The product the role is held against, by the name that addresses it
          type: string
        product_display_name:
          description: What to call that product, where it was declared with a display name
          type: string
        role:
          description: What membership of this group grants
          enum:
            - approver
            - assigner
            - public-read
            - private-read
            - public-triage
            - private-triage
            - admin
          type: string
      required:
        - group
        - role
      type: object
    Branch:
      additionalProperties: false
      properties:
        branches:
          items:
            $ref: "#/components/schemas/Branch"
          type:
            - array
            - "null"
        category:
          type: string
        name:
          type: string
        product:
          $ref: "#/components/schemas/Named"
      required:
        - category
        - name
      type: object
    BucketBody:
      additionalProperties: false
      properties:
        by_severity:
          additionalProperties:
            format: int64
            type: integer
          description: The same count by how the issues were rated. 'unrated' is what nobody scored
          type: object
        days:
          description: Where the stretch starts, so these can be ordered without reading the label
          format: int64
          type: integer
        label:
          type: string
        open:
          format: int64
          type: integer
        undecided:
          description: How many of them nobody has said anything about. A claim waiting for a second person is not an answer
          format: int64
          type: integer
      required:
        - label
        - days
        - open
        - undecided
      type: object
    BuildCountsBody:
      additionalProperties: false
      properties:
        critical:
          format: int64
          type: integer
        high:
          format: int64
          type: integer
        kind:
          enum:
            - branch
            - tag
          type: string
        last_scanned_at:
          type: string
        low:
          format: int64
          type: integer
        medium:
          format: int64
          type: integer
        stream:
          type: string
        total:
          format: int64
          type: integer
        variant:
          type: string
      required:
        - stream
        - variant
        - critical
        - high
        - medium
        - low
        - total
      type: object
    BuildName:
      additionalProperties: false
      properties:
        stream:
          type: string
        variant:
          type: string
      required:
        - stream
        - variant
      type: object
    BuildStandingBody:
      additionalProperties: false
      properties:
        agreed:
          description: How many are answered at every place by a standing decision
          format: int64
          type: integer
        exploited:
          description: How many somebody is known to be exploiting
          format: int64
          type: integer
        last_scan_at:
          description: When a scan last arrived here. Absent where none ever has
          type: string
        open:
          description: Issues at components, the unit every count here uses
          format: int64
          type: integer
        overdue:
          description: How many of those are past a deadline
          format: int64
          type: integer
        retired:
          description: This build's release is out of support
          type: boolean
        stream:
          type: string
        stream_kind:
          description: Whether the line moves or is fixed
          enum:
            - branch
            - tag
          type: string
        undecided:
          description: How many nobody has claimed anything about
          format: int64
          type: integer
        variant:
          type: string
      required:
        - stream
        - variant
        - open
      type: object
    BulkApprovalBody:
      additionalProperties: false
      properties:
        approved_at:
          type: string
        approved_by:
          type: string
        batch:
          type: string
        claims:
          format: int64
          type: integer
        rows:
          format: int64
          type: integer
      required:
        - batch
        - approved_by
        - approved_at
        - claims
        - rows
      type: object
    BundleBody:
      additionalProperties: false
      properties:
        builds:
          description: How many builds of the selection hold any of it. Absent where the selection is one build
          format: int64
          type: integer
        components:
          description: The packages this one bump moves. More than one where a source package builds several
          items:
            type: string
          type:
            - array
            - "null"
        exploited:
          description: Some of what it closes is being exploited
          type: boolean
        from:
          description: The version in hand
          type: string
        in:
          description: The builds that hold this bump
          items:
            $ref: "#/components/schemas/BuildName"
          type:
            - array
            - "null"
        issues:
          description: Distinct vulnerabilities the bump closes
          format: int64
          type: integer
        places:
          description: How many findings those sit at
          format: int64
          type: integer
        severity:
          description: The worst of what it closes
          type: string
        to:
          description: The version that fixes it, as whoever packages the component wrote it. Never compared against what ships, only grouped
          type: string
        upstream:
          description: "What the bump is of: the source package where one is recorded, and the component's own name otherwise"
          type: string
      required:
        - upstream
        - from
        - to
        - components
        - issues
        - places
        - in
      type: object
    CanBody:
      additionalProperties: false
      properties:
        may_agree:
          description: Agree to somebody else's claim, or send it back. The approver capability or a triage role on the product — a triager may answer somebody else's claim, which is the ordinary shape of a small team; that the two are different people is checked separately and has no override
          type: boolean
        may_assign:
          description: Give work to somebody else, or take what they hold — triage as well as the assigner role. Taking work nobody owns, and handing back your own, need only may_triage
          type: boolean
        may_hide:
          description: Argue about a finding nobody has disclosed
          type: boolean
        may_see:
          description: Read findings that have been disclosed
          type: boolean
        may_triage:
          description: Argue about a finding
          type: boolean
        name:
          description: What to show for it
          type: string
        product:
          type: string
        sees_all:
          description: Read findings nobody has disclosed yet
          type: boolean
      required:
        - product
        - name
        - may_see
        - sees_all
        - may_triage
        - may_assign
        - may_hide
        - may_agree
      type: object
    CarriedBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CarriedBody.json
          format: uri
          readOnly: true
          type: string
        absent:
          description: Cover nothing in the new line
          format: int64
          type: integer
        applying:
          description: Reach it by matching. Nothing to choose
          format: int64
          type: integer
        moved:
          description: The version differs, so each needs a fresh answer
          items:
            $ref: "#/components/schemas/InheritedBody"
          type:
            - array
            - "null"
        postponed:
          description: Deferrals, offered separately and never carried by default
          items:
            $ref: "#/components/schemas/InheritedBody"
          type:
            - array
            - "null"
      required:
        - applying
        - moved
        - postponed
        - absent
      type: object
    CarriedClaimBody:
      additionalProperties: false
      properties:
        justification:
          type: string
        pedigree:
          description: The claim arrived attached to a component — a carried patch saying what it fixes — rather than in a document of its own
          type: boolean
        since:
          description: When the build first said it, by the scan it arrived in
          type: string
        statement:
          description: The build's own reasoning, shown as written and never rendered
          type: string
        status:
          description: What it claimed, in the exchange format's own vocabulary
          type: string
        subject:
          description: What it said the claim was about — a package name, or its identifier where it named no name
          type: string
        suppresses:
          description: Whether it takes a finding off the list. 'affected' and 'under investigation' are information, not answers
          type: boolean
        until:
          description: When it stopped saying it. Absent while it is still being said
          type: string
        vulnerability:
          description: The identifier the build argued about, as it wrote it
          type: string
      required:
        - vulnerability
        - subject
        - status
        - pedigree
        - suppresses
        - since
      type: object
    Carry-decisionsRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Carry-decisionsRequest.json
          format: uri
          readOnly: true
          type: string
        decisions:
          description: Which of the offered judgments to carry
          items:
            format: int64
            type: integer
          minItems: 1
          type:
            - array
            - "null"
      required:
        - decisions
      type: object
    Carry-decisionsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Carry-decisionsResponse.json
          format: uri
          readOnly: true
          type: string
        carried:
          description: How many claims were written, each waiting for a second person
          format: int64
          type: integer
      required:
        - carried
      type: object
    CatchesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CatchesOutputBody.json
          format: uri
          readOnly: true
          type: string
        components:
          description: The components it names, at most twenty
          items:
            type: string
          type:
            - array
            - "null"
        total:
          description: How many distinct components it matches. More than the list where the list was cut
          format: int64
          type: integer
        unheld:
          description: How many of those nobody holds, which is what a rule may place
          format: int64
          type: integer
        work:
          description: Pieces of work at those components — one issue in one component, whatever it sits at
          format: int64
          type: integer
      required:
        - components
        - total
        - work
        - unheld
      type: object
    ChangeBody:
      additionalProperties: false
      properties:
        about:
          type: string
        at:
          type: string
        became:
          type: string
        by:
          description: Who made the change, by sign-in identity
          type: string
        cleared:
          description: This change cleared it
          type: boolean
        kind:
          description: What sort of thing changed
          enum:
            - setting
            - role
            - routing
            - support
            - release
            - credential
            - account
            - team
            - case
            - alias
          type: string
        unset:
          description: Nobody had set it before this
          type: boolean
        was:
          type: string
      required:
        - at
        - by
        - kind
        - about
      type: object
    ChangedBody:
      additionalProperties: false
      properties:
        arrived_from:
          description: The version this was bumped from since the earlier build. Only on still-present entries, where it means the bump did not reach the fix
          type: string
        because:
          description: Why it went. Only on fixed entries
          enum:
            - removed
            - upgraded
            - revised
            - superseded
            - unexplained
          type: string
        closed_by_run:
          description: The run that stopped reporting it. Only on an entry that left the affected list, and absent where a person closed it
          format: int64
          type: integer
        component:
          type: string
        from_version:
          description: The version the place held before the fix. Only on a fixed entry the version moved for
          type: string
        moved_to:
          description: The version the place moved to. Only on a fixed entry the version moved for, so a removed component carries neither
          type: string
        severity:
          type: string
        vulnerability:
          type: string
      required:
        - vulnerability
        - component
      type: object
    ClaimApprovalBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClaimApprovalBody.json
          format: uri
          readOnly: true
          type: string
        batch:
          description: Name a batch to agree to several claims under one name, so they can be undone together. At most 64 characters
          maxLength: 64
          type: string
        because:
          description: Why the rows in except are set aside, in markdown. Required when any are
          type: string
        except:
          description: Decisions in this claim to set aside rather than approve. They return to the proposer as a claim of their own, carrying the reason given in because
          items:
            format: int64
            type: integer
          maxItems: 2000
          type:
            - array
            - "null"
      type: object
    ClaimApprovedBody:
      additionalProperties: false
      properties:
        $schema:
