      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Export when each build was last scanned
      tags:
        - Scans
      x-openpsirt-requires:
        scope: person
        note: Exports only what you may see.
  /v1/score:
    get:
      description: |-
        Returns the base score and the severity band a vector works out to. It reads nothing and records nothing.

        CVSS 3.0 and 3.1 only. Version 4 has a different base formula and version 2 is a different scheme, and scoring either with this one produces a number nothing downstream could tell apart from a real one.

        **Requires:** any signed-in person, and not a pipeline key. Answers a calculation, and reads nothing.
      operationId: score-vector
      parameters:
        - description: A CVSS 3.0 or 3.1 base vector
          explode: false
          in: query
          name: vector
          required: true
          schema:
            description: A CVSS 3.0 or 3.1 base vector
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score-vectorResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Score a CVSS vector
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers a calculation, and reads nothing.
  /v1/session:
    delete:
      description: |-
        Ends the session the request arrived on, everywhere rather than in this browser alone — the session is stored, so it stops working whichever copy of the application answers next.

        **Requires:** your own credential
      operationId: sign-out
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sign out
      tags:
        - Access
      x-openpsirt-requires:
        scope: self
  /v1/session/me:
    get:
      description: |-
        Returns the caller, the products they can reach, and what they may do in each one.

        It answers what a screen has to know before it draws: whether to offer an action at all. Without it a client either hides nothing and lets people find the refusal, or re-implements the mapping from roles to capabilities and drifts from the one the server enforces.

        Capabilities, not roles, for that reason. Which roles produce which capability is the server's rule and stays there.

        **Requires:** your own credential
      operationId: get-current-subject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Describe the current subject
      tags:
        - Access
      x-openpsirt-requires:
        scope: self
  /v1/session/me/digest:
    put:
      description: |-
        Turns the daily digest on or off, and says whether it lists findings nobody owns as well as your own outstanding work.

        Both are off until asked for. The digest carries what nothing else told you: work that became yours without a message, and — where asked for — findings that opened since the last one and nobody has picked up.

        Asking for the second without the first is refused: a digest listing what nobody owns is still a digest.

        Nothing is sent anywhere without an address recorded against you, which `GET /v1/session/me` reports as `reachable`.

        **Requires:** your own credential
      operationId: set-digest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Set-digestRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Choose what is sent to you daily
      tags:
        - Notifications
      x-openpsirt-requires:
        scope: self
  /v1/settings:
    get:
      description: |-
        Returns every setting an operator may change, its value, and what it decides. `default` means nobody has set it and the shipped value is in use.

        The shipped numbers are a starting point rather than a recommendation. What a deployment can hold to is a question about that deployment, and a deadline nobody agreed to produces an estate that is permanently late and a signal everybody ignores.

        **Requires:** administrator
      operationId: list-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodySettingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List this deployment's settings
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/settings/{name}:
    put:
      description: |-
        Sets one value for everybody here. Durations are written the way Go writes them — `72h`, `30m` — and a value that cannot be read is refused rather than stored, since a setting nothing can parse is a policy silently reverting to the shipped one.

        Only the settings this deployment recognizes may be set. A name it does not know is refused, because storing it would create something nothing ever reads.

        **Requires:** administrator
      operationId: set-setting
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Set-settingRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change one setting
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/sign-in:
    get:
      description: |-
        Returns the sign-in providers this deployment has configured, so a sign-in page can offer them.

        **Answered without a credential**, because it is what somebody sees before they have one. It is the only reading endpoint that is, and it reports names an operator configured and nothing else — no account exists or does not exist as far as this is concerned, which is the disclosure that would matter.

        **Requires:** nothing: this is answered before anybody has a credential
      operationId: list-sign-in-providers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyProviderBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List sign-in providers
      tags:
        - Access
      x-openpsirt-requires:
        scope: none
  /v1/teams:
    get:
      description: |-
        Lists the teams work can be routed to.

        A team holds work and grants nothing: no role, no visibility, no capability. One team therefore carries mixed clearance as a matter of course, and what each member sees of the work routed to it is what they could see anyway.

        **Names to anybody, membership to an administrator.** Routing work to a team means naming one, so anybody who may hand work around has to be able to see the names; who is on it is the same question as who is here, and that is answered where the rest of the record is.

        **Requires:** any signed-in person, and not a pipeline key. Membership is listed for an administrator; anybody else sees the names.
      operationId: list-teams
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List teams
      tags:
        - Administration
      x-openpsirt-requires:
        scope: person
        note: Membership is listed for an administrator; anybody else sees the names.
    post:
      description: |-
        Records a team so that work can be routed to it. Recording the same name again returns the team and adds any members named, so a script that sets a deployment up stays runnable.

        Everybody named must already have been recorded: a team cannot bring somebody into the deployment, because it grants nothing and an account that exists is access somebody decided to give.

        **Requires:** administrator
      operationId: record-team
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRecordBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredTeamBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a team
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/teams/{team}:
    delete:
      description: |-
        Takes a team out of use. Nothing new is routed to it and its membership goes, while work already routed to it still names it — the row stays for the same reason an account is deactivated rather than deleted.

        **Requires:** administrator
      operationId: retire-team
      parameters:
        - in: path
          name: team
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retire a team
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/teams/{team}/members/{identity}:
    delete:
      description: |-
        Removes somebody from a team. Work they have already taken stays theirs: membership says where work arrives, not who holds what has arrived.

        **Requires:** administrator
      operationId: remove-from-team
      parameters:
        - in: path
          name: team
          required: true
          schema:
            type: string
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take somebody off a team
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
    put:
      description: |-
        Adds somebody to a team. Saying it twice asserts the same thing.

        It grants them nothing. What they see of the team's work is what they could see anyway, so a team with one member who may read undisclosed work and four who may not is an ordinary arrangement rather than a misconfiguration.

        **Requires:** administrator
      operationId: add-to-team
      parameters:
        - in: path
          name: team
          required: true
          schema:
            type: string
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Put somebody on a team
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/tokens:
    get:
      description: |-
        Lists your own personal tokens: what each is called, when it expires and when it was last used. Never anybody else's, and never the secrets.

        A token is a live reference to you rather than a copy of what you could do when it was made, so what one reaches shrinks the moment your roles do.

        **Requires:** your own credential
      operationId: list-my-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List your API tokens
      tags:
        - Access
      x-openpsirt-requires:
        scope: self
    post:
      description: |-
        Creates a personal token and returns its secret. The secret is shown once and never again — what is stored is a digest.

        Expiry is not optional, and `lifetime` may not exceed the ceiling an administrator has set. A credential that never runs out is one nobody ever revokes, and those are found when somebody leaves and nobody knows what breaks if it is turned off.

        **Requires:** your own credential. Signed in, not through a token: a token cannot mint another.
      operationId: mint-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an API token
      tags:
        - Access
      x-openpsirt-requires:
        scope: self
        note: "Signed in, not through a token: a token cannot mint another."
  /v1/tokens/{name}:
    delete:
      description: |-
        Revokes one of your own tokens by name. It stops working immediately.

        Yours alone. An administrator withdraws anybody else's through the administration paths.

        **Requires:** your own credential. Signed in, not through a token: a token cannot withdraw another.
      operationId: revoke-my-token
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw one of your API tokens
      tags:
        - Access
      x-openpsirt-requires:
        scope: self
        note: "Signed in, not through a token: a token cannot withdraw another."
  /v1/trend:
    get:
      description: |-
        Returns the three counts per step, with open split by severity, across every product you can see.

        **Narrowable to part of a tree.** `component` keeps one package at any version; `beneath` keeps a component and everything under it, which needs a branch and a variant naming exactly one build. A team that owns one area asks for its own three lines this way.

        Three series rather than one, because separately they are three numbers and together they say whether the team is keeping pace: new consistently outrunning resolved is a growing backlog.

        Split by severity because a total that barely moves while its critical share rises is getting worse, and a single line hides exactly that.

        Worked out when it is asked for. Nothing is precomputed or refreshed on a schedule until a measurement says it has to be.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-trend
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - explode: false
          in: query
          name: weeks
          schema:
            default: 12
            format: int64
            maximum: 104
            minimum: 1
            type: integer
        - description: Keep only what is open against components of this name, whatever version
          explode: false
          in: query
          name: component
          schema:
            description: Keep only what is open against components of this name, whatever version
            type: string
        - description: Keep only what sits at this component or anywhere under it. A subtree is a walk over one build's edges, so this needs a branch and a variant naming exactly one build
          explode: false
          in: query
          name: beneath
          schema:
            description: Keep only what sits at this component or anywhere under it. A subtree is a walk over one build's edges, so this needs a branch and a variant naming exactly one build
            type: string
        - description: Which one, where the build holds that name at several versions
          explode: false
          in: query
          name: beneath_version
          schema:
            description: Which one, where the build holds that name at several versions
            type: string
        - description: Which one, for the few names a build holds at one version as two components
          explode: false
          in: query
          name: beneath_ecosystem
          schema:
            description: Which one, for the few names a build holds at one version as two components
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPointBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show new, resolved and open over time
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/trend/releases:
    get:
      description: |-
        One point per tagged release of one product, oldest first, with what is open against it now.

        **The axis follows what is being viewed.** A branch is scanned nightly and has continuous data, so a calendar reads correctly on it. A tag never moves again, and releases months apart make a calendar count read as slow drift rather than the step change it was — the gaps are the chart's whole shape and they are gaps in nothing.

        **Answered against today's vulnerability data**, not as of the day each was cut. That is what re-scanning a shipped release is for.

        **No rates here.** How many appeared and were resolved between two releases is an artifact of how far apart somebody cut them; rates always plot on calendar. And a product must be named: two products' tags interleave by date and mean nothing side by side.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-release-trend
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - description: How many releases, most recent kept
          explode: false
          in: query
          name: limit
          schema:
            default: 12
            description: How many releases, most recent kept
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Get-release-trendResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what each release shipped with
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/unassigned:
    get:
      description: |-
        Returns open findings with no assignee, across every product you can see, most urgent first.

        Deliberately not scoped to one product: work falling between people is exactly what hides when every screen shows one product and nobody looks at the others.

        **One item per issue in a component in a product, not one per build.** The same code built as several variants is one piece of work — a judgment is keyed on the product and the code rather than on the build, so answering it once answers every build holding the same versions. `builds` says how many that is. Where two builds ship different versions of the component they are different work and appear separately.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-unassigned
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-unassignedResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List findings nobody is dealing with
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/version:
    get:
      description: |-
        Identifies the build that is answering, so an operator can tell which version they are looking at.

        **Requires:** any signed-in person, and not a pipeline key. A person rather than a pipeline: a build server has no business asking what version is running.
      operationId: get-version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the server version
      tags:
        - Meta
      x-openpsirt-requires:
        scope: person
        note: "A person rather than a pipeline: a build server has no business asking what version is running."
  /v1/work/set-aside:
    get:
      description: |-
        Returns background work the queue has set aside, newest first, with why each stopped where anything reported a reason. A job is set aside once it has been tried as many times as it is allowed to be, whether it reported a failure or its worker stopped answering.

        At most 200 are returned. `total` is how many are set aside in all, so a clipped page can be told from a complete one.

        **Requires:** administrator
      operationId: list-set-aside-work
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodySetAsideBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List work that stopped being retried
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/work/set-aside/{id}/retry:
    post:
      description: |-
        Puts one set-aside job back in the queue for whichever worker takes it next, with its attempts reset to zero and its last error kept.

        A job that is not set aside is refused rather than moved.

        **Requires:** administrator
      operationId: retry-set-aside-work
      parameters:
        - description: The job to put back
          in: path
          name: id
          required: true
          schema:
            description: The job to put back
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retry work that was set aside
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
