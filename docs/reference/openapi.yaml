  /v1/products/{product}/fix-bundles:
    get:
      description: |-
        One row per upstream bump, with the issues it closes.

        Keyed on the **source package** where one is recorded and on the component's own name otherwise, so packages built from one source are one row — curl, libcurl4t64 and libcurl3t64 bump once.

        Only what has a fix: a bundle is a version to move to, so a finding upstream has released nothing for is not in one.

        Grouping is presentation: one act still writes one decision per component and per place.

        Takes the same selection as the findings list, and six of its filters: severity, exploited, component, search, ecosystem and state. Not the rest: a filter that answers about a place or a deadline has no row here to narrow.

        Ordered worst first, and `sort` takes any of: what the bump would close (`issues`, `places`), how far it reaches (`builds`), how bad the worst of it is (`urgency`, `severity`) and the soonest deadline it would meet (`deadline`). `asc` orders the other way. The default answers what should worry you; `sort=issues` answers what to do this afternoon.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-fix-bundles
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: Limit to one branch or tag
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag
            type: string
        - description: Limit to one variant
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant
            type: string
        - description: Keep only issues rated this badly or worse
          explode: false
          in: query
          name: severity
          schema:
            description: Keep only issues rated this badly or worse
            enum:
              - low
              - medium
              - high
              - critical
            type: string
        - description: Keep only bumps closing something known to be exploited
          explode: false
          in: query
          name: exploited
          schema:
            description: Keep only bumps closing something known to be exploited
            type: boolean
        - description: Keep only bumps moving a component of this name
          explode: false
          in: query
          name: component
          schema:
            description: Keep only bumps moving a component of this name
            type: string
        - description: Keep only rows whose component or issue name contains this
          explode: false
          in: query
          name: q
          schema:
            description: Keep only rows whose component or issue name contains this
            maxLength: 200
            type: string
        - description: Keep only components of one package kind
          explode: false
          in: query
          name: ecosystem
          schema:
            description: Keep only components of one package kind
            type: string
        - description: Keep only groups this far decided
          explode: false
          in: query
          name: state
          schema:
            description: Keep only groups this far decided
            enum:
              - undecided
              - waiting
              - agreed
              - lapsed
            type: string
        - description: Which order to page in. Worst first by default. A bundle with no deadline sorts last whichever direction is asked for
          explode: false
          in: query
          name: sort
          schema:
            description: Which order to page in. Worst first by default. A bundle with no deadline sorts last whichever direction is asked for
            enum:
              - urgency
              - severity
              - issues
              - places
              - builds
              - deadline
            type: string
        - description: Order the other way — fewest, least urgent, nearest deadline first
          explode: false
          in: query
          name: asc
          schema:
            description: Order the other way — fewest, least urgent, nearest deadline first
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-fix-bundlesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List findings by upgrade
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/holders:
    get:
      description: |-
        People and teams that can hold work in this product, for a picker.

        **People are those who can already read what they would be given**, at the visibility asked for. Offering somebody who cannot open what they are handed is how work arrives with a person who cannot act on it — and on an undisclosed finding the offer itself would say a finding exists.

        **Teams are listed whole.** A team holds work and grants nothing, so one carries mixed clearance as a matter of course and what each member sees of what is routed to it is what they could see anyway.

        Narrow with `q`, which matches the identity and the displayed name without regard to capitals. This is not the people list: that is the deployment's directory and needs administration.

        **Requires:** public-read or public-triage or private-read or private-triage on the product. Asking about undisclosed findings needs private-read or private-triage.
      operationId: list-holders
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The visibility of the work being handed over
          explode: false
          in: query
          name: visibility
          schema:
            default: public
            description: The visibility of the work being handed over
            enum:
              - public
              - private
            type: string
        - description: Narrow to names containing this, ignoring capitals
          explode: false
          in: query
          name: q
          schema:
            description: Narrow to names containing this, ignoring capitals
            maxLength: 100
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 25
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyHolderBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who work here can be given to
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-read
          - public-triage
          - private-read
          - private-triage
        note: Asking about undisclosed findings needs private-read or private-triage.
  /v1/products/{product}/issues/{vulnerability}/advisory:
    get:
      description: |-
        Returns a CSAF 2.0 document for a flaw in this product: what it is, and which releases hold it and which no longer do.

        **The document is generated, not published.** Nothing is sent anywhere. Recording that a document was issued is a separate request, and what it keeps is the digest of what was generated, so that whether what you published is still what this would generate can be answered.

        **Only for a flaw in what you ship.** An issue a scanner reported against a third-party component is refused: that is dependency hygiene a consumer can already read out of the inventory, and a vendor advisory for every upstream CVE in a dependency is not what an advisory is.

        **A document about an undisclosed flaw is a draft**, and says so in `tracking.status`. Reaching a disclosure date discloses nothing, so nothing here does either.

        Requires a publisher configured for this deployment: a document naming none is not a valid CSAF document.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-advisory
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The identifier the issue is filed under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The identifier the issue is filed under
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Generate a CSAF advisory for an issue
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/issues/{vulnerability}/advisory/issuance:
    get:
      description: |-
        What has been published about this flaw in this product, newest first: which revision, when, and what the document hashed to at the time.

        **Readable without generating a document.** Every issuance is in the document's own revision history, which is right for a reader of the document — but it made "has an advisory gone out, and is what is published still what we would generate" a question you had to build a CSAF document to answer, and somebody deciding whether to publish a revision is asking before they generate anything.

        The published document itself belongs to whoever published it. The digest is what makes the comparison possible, and it was taken from the document generated here rather than from anything sent.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-advisory-issuances
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The identifier the issue is filed under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The identifier the issue is filed under
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyIssuanceBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the advisories that went out for a flaw
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
    post:
      description: |-
        Records that an advisory for this flaw was published: when, by whom, and a digest of the document as it stands now.

        **A fact about a moment rather than a derived value.** What was published on a date cannot be worked out again once the record it came from has moved on — a release is added, a decision is revised, a fix lands — so if it is not written down when it happens it is gone.

        **It is what lets a second document be a revision.** Without it a second advisory for the same flaw cannot carry a revision history or a higher version, and both are things CSAF validators check; a document that fails validation is one a customer's tooling drops.

        The published advisory itself stays with whoever published it. The digest is what makes "is what is published still what we generate" a question with an answer, and it is taken from the document generated here rather than from anything sent — a digest of whatever a caller says answers nothing.

        **Requires:** public-triage or private-triage on the product
      operationId: record-advisory-issued
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Record-advisory-issuedRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuanceBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record that an advisory went out
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/issues/{vulnerability}/aliases/{alias}:
    put:
      description: |-
        Records that this issue is also known by another identifier — a CVE or a GHSA assigned after we minted our own.

        **Nothing about the finding, the decisions or the approvals moves**, because they are keyed on the issue rather than on what it is called. What changes is that the name travels with it: a report arriving under the new name resolves here rather than opening a second issue, the finding shows it, and the advisory carries it in the field a reader looks in — which is the one lookup a published advisory exists to serve.

        **A name is identity, and identity is deployment-wide.** From here on a scan of any product reporting that name resolves to this issue and inherits its decisions. So this asks for the right to triage the issue in every product it is currently open in, at the visibility each one carries, and is refused rather than partly done.

        Recording a name it already goes by succeeds and changes nothing.

        **Requires:** public-triage or private-triage on the product. Also asks for triage in every other product the issue is open in.
      operationId: add-alias
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - description: The other identifier, as it is written
          in: path
          name: alias
          required: true
          schema:
            description: The other identifier, as it is written
            maxLength: 191
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record another name for an issue
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
        note: Also asks for triage in every other product the issue is open in.
  /v1/products/{product}/issues/{vulnerability}/assessment:
    post:
      description: |-
        Recorded against the **issue**, not against a place, and against **one product**. A published rating being wrong, or a report being disputed, is one statement about the vulnerability in this product — true in every build of it, including builds it has not reached yet, and it does not stop being true because somebody rebuilt something.

        It belongs to a product because a rating is a judgment about how a component is used, and two products do not use one the same way: one may ship the vulnerable configuration and another may not. Two products may record different ratings of the same issue, and neither reaches the other. A product nobody has rated the issue in reads the published rating.

        It changes the order, which is what makes it worth having rather than a note nobody acts on. Rating something **worse** than published takes effect at once: nobody needs protecting from being told something is worse than the world says. Rating it **milder** waits for a second person, because that is the direction that hides things — and it hides more than a position in a list. Severity sets the deadline, so calling a high a low pushes its deadline out by months, and where a product has said what is worth triaging at all, a downgrade below that line takes the finding off the working list and off any clock entirely.

        The published rating is never overwritten. The product's is what ranks there; the world's stays beside it, because a rating of ours shown where the world's goes reads as the world's.

        **Requires:** public-triage or private-triage on the product
      operationId: assess-issue
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record what a product thinks of an issue, as against what was published
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/issues/{vulnerability}/attachments:
    get:
      description: |-
        What text about this issue refers to. An upload nothing refers to yet is not listed, because it is not attached to anything — it becomes visible here when the justification or comment naming it is saved.

        A file an administrator removed is still listed, saying so, because the text that pointed at it still does.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-attachments
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-attachmentsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List files attached to an issue
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
    post:
      description: |-
        Stores one file against an issue and returns the reference to put in text. Refer to it as `attachment:<token>` — as a link for anything downloaded, or as a markdown image for the raster types displayed in the page. An address of the store never appears in text.

        The content type is decided here from the bytes and is never the one that was uploaded. Everything outside a small allowlist of raster images is served as an attachment download whatever it is.

        Refused when the file is larger than this deployment accepts, when it has no room left, or when it would take you past your own share of the store; all three limits are settings. A deployment that has configured no store holds no attachments and says so.

        An upload nothing refers to is removed after a day, so a file attached and then abandoned does not accumulate. Send `evidence=true` where the file hangs off the issue itself — a test case that proves the flaw — rather than off text you are about to write: it is then listed at once and never swept, because the issue is what points at it.

        **Requires:** public-triage or private-triage on the product. A collaborator brought onto this issue may attach to it too.
      operationId: upload-attachment
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The issue, under any identifier it goes by
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, under any identifier it goes by
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              evidence:
                contentType: text/plain
              file:
                contentType: application/octet-stream
            schema:
              properties:
                evidence:
                  type: boolean
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              required:
                - file
                - evidence
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Attach a file to an issue
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
        note: A collaborator brought onto this issue may attach to it too.
  /v1/products/{product}/issues/{vulnerability}/builds:
    put:
      description: |-
        Makes the builds this flaw is filed against exactly the ones named.

        **Widening opens findings; narrowing closes them as `invalid`** — never affected rather than no longer affected, so they count as no fix and appear in no release note. The record stays, with the reason.

        **A reason is required whenever anything is taken out.**

        **Only a flaw recorded here.** Which builds hold an issue a scanner reported is what the scans found, and this would overwrite it.

        `invalid` never means the finding exists but does not apply. That is a triage decision of `not-applicable` with the justification that fits.

        **Requires:** public-triage or private-triage on the product. private-triage where the finding is undisclosed.
      operationId: set-affected-builds
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The identifier it was filed under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The identifier it was filed under
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Set-affected-buildsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffectsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set which builds a recorded flaw affects
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
        note: private-triage where the finding is undisclosed.
  /v1/products/{product}/issues/{vulnerability}/collaborators:
    get:
      description: |-
        Everybody granted this one issue in this product, oldest first.

        **Being on a case is not reading the product.** A collaborator sees this issue wherever it sits here and nothing else, may argue about it and comment on it, and may not agree to anybody's claim.

        **Requires:** private-read or private-triage on the product. Only where you may read undisclosed work.
      operationId: list-collaborators
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyCollaboratorBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who has been brought into a case
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - private-read
          - private-triage
        note: Only where you may read undisclosed work.
  /v1/products/{product}/issues/{vulnerability}/collaborators/{identity}:
    delete:
      description: |-
        Withdraws the grant. The record of it is kept, because who could see an embargoed case, and when, is exactly what is asked afterwards.

        Taking somebody off a case they are not on succeeds and changes nothing.

        **Requires:** private-read or private-triage on the product. Only where you may read undisclosed work.
      operationId: remove-collaborator
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take somebody off a case
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - private-read
          - private-triage
        note: Only where you may read undisclosed work.
    put:
      description: |-
        Grants one person this one issue in this product, without granting them private reading on the product.

        **It is an access change and is recorded as one**: it lands in the administration trail, and they are told at once — in the notification area inside the application, where an undisclosed finding may be named.

        They must already have been recorded here: this grants access to somebody who has some, and cannot bring anybody into the deployment.

        Adding somebody who is already on the case succeeds and changes nothing.

        **Requires:** private-read or private-triage on the product. Only where you may read undisclosed work.
      operationId: add-collaborator
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bring somebody into a case
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - private-read
          - private-triage
        note: Only where you may read undisclosed work.
  /v1/products/{product}/issues/{vulnerability}/disclosure:
    get:
      description: |-
        Every time this embargo was moved, oldest first, with why and by whom.

        Kept in full and never overwritten. One extension is a judgment and six is a policy nobody wrote down, and the difference is invisible if each replaces the last. A request still waiting for agreement is here too: what was asked for is part of how long this stayed hidden, whether or not it was granted.

        **Requires:** private-read or private-triage on the product. Only where you may read undisclosed work.
      operationId: list-disclosure-extensions
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyExtensionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List how an embargo has been moved
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - private-read
          - private-triage
        note: Only where you may read undisclosed work.
    post:
      description: |-
        Moves the end of an embargo, across every undisclosed finding of this issue in this product.

        **A reason is required, always**, however short the extension. One with no reason is a record saying somebody moved it and nothing else.

        **Past a threshold it needs a second person**, and the threshold is measured against everything this embargo has already been moved by rather than against this request alone — measured per request, the exception swallows the rule three weeks at a time. It is the same act a deferral is, and the same shape.

        **An extension that needs agreement moves nothing until it has it.** The request is on record either way; `in_force` says whether the date follows it.

        A date only ever moves later. Bringing one forward is disclosing sooner, which is a different act.

        **Requires:** private-triage on the product. A second person agrees past the threshold.
      operationId: extend-disclosure
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Extend-disclosureRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Ask to move a disclosure date later
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - private-triage
        note: A second person agrees past the threshold.
  /v1/products/{product}/issues/{vulnerability}/notes:
    get:
      description: |-
        Returns the notes written about this issue in this product, oldest first, with who wrote each and when. A note that has been edited also carries when it was last changed.

        A note records no judgment and changes nothing: not what ranks, not a deadline, not a triage line. It is context for whoever decides.

        **It is about the issue in this product, not about one component.** A row in the findings list is one issue at one source package, and one issue is often several rows — so a note kept against a row would be written on one of them and hidden from the rest. What is about a judgment at a place is a comment on that claim instead.

        **Requires:** any signed-in person, and not a pipeline key. Answers where you may read a finding of this issue in this product, at its visibility — an issue with one undisclosed place here is undisclosed for this. Anywhere else it answers as an issue that is not there.
      operationId: list-issue-notes
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyNoteBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List notes on an issue in a product
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers where you may read a finding of this issue in this product, at its visibility — an issue with one undisclosed place here is undisclosed for this. Anywhere else it answers as an issue that is not there.
    post:
      description: |-
        Adds a markdown note about this issue in this product. It records no judgment: nothing about what ranks, what a deadline is, or what the product triages changes because somebody wrote one.

        **This is the way to leave something for whoever decides without deciding.** A comment hangs off a claim; a note does not, so nothing has to be judged before anything can be said.

        It reaches every build of the product and does not lapse when a version moves. Something true of one copy and not another — "we do not call that function in the vendored build" — is about a place, and belongs on the claim there.

        A name written after an `@` is told, where that person may read what the note is about; the response lists the names that reached nobody.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.

        **Requires:** public-triage or private-triage on the product
      operationId: note-on-issue
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Note-on-issueRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteWritten"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a note to an issue in a product
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/issues/{vulnerability}/report:
    get:
      description: |-
        Who reported it, how to reach them, when it arrived, when somebody answered them, and how they wish to be credited.

        **The received date is what the embargo runs from**: a report arriving on 1 June and typed in on 15 June otherwise puts our clock two weeks behind the one the reporter has a publication scheduled against, and they are the party who will publish regardless.

        Answers 404 where nobody recorded a reporter, which is every flaw we found ourselves.

        **Requires:** public-triage or private-triage on the product
      operationId: get-report
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show who reported a flaw
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/issues/{vulnerability}/report/acknowledgement:
    post:
      description: |-
        Records that somebody replied to whoever reported this, and when.

        **It records that it happened rather than doing it.** What reaches a researcher is a mail somebody sends from an address they already have; recording it is what turns "somebody probably replied" into a date the timeline can be evidenced from, and what clears the condition an unanswered report opens.

        Acknowledging twice keeps the first date: when somebody was answered is a fact about the past, and the second person to press it did not change it.

        **Requires:** public-triage or private-triage on the product
      operationId: acknowledge-report
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record that the reporter was answered
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/mentionable:
    get:
      description: |-
        Returns the people who can already read findings of this visibility in this product, so an editor can offer them.

        Only people who can already see the thing. An autocomplete listing everybody teaches somebody to name a colleague who then cannot open what they were called to — and on an undisclosed finding, the mention itself says a finding exists, which is the disclosure the visibility rule prevents.

        `visibility` says which kind of finding the text is about. Asking about undisclosed findings requires being able to read them.

        **Requires:** public-read or public-triage or private-read or private-triage on the product. Asking about undisclosed findings needs private-read or private-triage.
      operationId: list-mentionable
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: Which kind of finding the text is about
          explode: false
          in: query
          name: visibility
          schema:
            default: public
            description: Which kind of finding the text is about
            enum:
              - public
              - private
            type: string
        - description: Narrow to names containing this, ignoring capitals. Matched on the identity and on the displayed name
          explode: false
          in: query
          name: q
          schema:
            description: Narrow to names containing this, ignoring capitals. Matched on the identity and on the displayed name
            maxLength: 100
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 25
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyMentionableBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who may be mentioned here
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-read
          - public-triage
          - private-read
          - private-triage
        note: Asking about undisclosed findings needs private-read or private-triage.
  /v1/products/{product}/overview:
    get:
      description: |-
        One product, with each of its builds: what is open, how much is overdue, how much is exploited, how much nobody has claimed anything about, how much is answered at every place, and when a scan last arrived.

        **Counted as issues at components**, the unit every other count here uses. A component reached twenty ways carries the same issue twenty times, so counting rows would make a build look twenty times worse than the list somebody opens next.

        **"Undecided" and "agreed" are the findings list's own words**, by the same definition and read from the same expression: undecided means no place has a decision, agreed means every place is answered by one that stands. Two screens with two definitions of "decided" is how they come to disagree in front of somebody.

        A build whose release is out of support says so rather than reading as one that stopped being scanned: those are different facts and only one of them is a fault.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-product-overview
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show how one product is doing
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/releases:
    get:
      description: |-
        One number per build, which is what a release-over-release chart is drawn from. The comparison endpoint says what changed between **two** builds; this says whether the estate is getting better or worse across all of them.

        Counted before any triage line is applied, so it agrees with the findings list rather than with whatever a product has decided is worth working on — a line is about what to spend an afternoon on, not about what exists.

        Severities are folded the same four ways everything else here ranks by, through the one expression the working list and the deadline also read, so a chart cannot disagree with a list about what counts as high.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-releases
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyReleaseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report what is open in each build of a product
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/routing-rules:
    get:
      description: |-
        The standing rules for this product, in the order they are tried.

        **First match wins**, and which rule placed a finding is recorded on the finding: an unwritten precedence is forgettable, and the question it answers — where did this come from — is asked months later by somebody who was not there.

        **Requires:** public-triage or private-triage on the product
      operationId: list-routing-rules
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyRuleBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the rules that route work to teams
      tags:
        - Administration
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
    post:
      description: |-
        Records a standing rule and queues it against what is already open.

        **It matches on component identity as well as on a place in the tree.** The source package is the key that matters: one rule naming it catches every binary package built from it, wherever they sit — a kernel is one source package appearing at many places under many consumers, and a subtree rule would need a line per place and would still miss tomorrow's.

        **It places only work nobody holds.** A human assignment always wins, and adding a rule never takes something out of somebody's hands.

        **Turning one on is a bulk write**, so it is queued rather than done here: one rule naming a source package sweeps thousands of existing findings, and saving a form must not hold a transaction open across the estate. The reply says the rule was recorded, not that the sweep has finished.

        **Requires:** assigner on the product. A rule hands work to somebody, continuously, on behalf of whoever wrote it.
      operationId: add-routing-rule
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Add-routing-ruleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a rule that routes work to a team
      tags:
        - Administration
      x-openpsirt-requires:
        scope: product
        any_of:
          - assigner
        note: A rule hands work to somebody, continuously, on behalf of whoever wrote it.
  /v1/products/{product}/routing-rules/preview:
    get:
      description: |-
        Answers what a rule with these keys matches, without recording anything: the components it names, how many pieces of work sit at them, and how many of those nobody holds.

        **A rule whose reach nobody can see before saving is a rule that sweeps the estate on a guess**, and one naming something nothing is called places nothing, silently — which is the worst way for a rule to be wrong, because it still looks like a rule. `*` matches any run of characters in either key.

        **It does not account for the rules already there.** First match wins, so what this catches is what it would place only where no earlier rule claimed it first.

        **Requires:** public-triage or private-triage on the product
      operationId: preview-routing-rule
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: A source package name, with * for any run of characters
          explode: false
          in: query
          name: upstream
          schema:
            description: A source package name, with * for any run of characters
            maxLength: 191
            type: string
        - description: A component name, with * for any run of characters
          explode: false
          in: query
          name: beneath
          schema:
            description: A component name, with * for any run of characters
            maxLength: 191
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatchesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview what a routing rule would catch
      tags:
        - Administration
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/routing-rules/{id}:
    delete:
      description: |-
        Takes a rule out of use. **What it already placed stays placed**: changing a rule never takes something out of somebody's hands, and that holds for a team's queue as much as for a person.

        **Requires:** assigner on the product
      operationId: retire-routing-rule
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retire a routing rule
      tags:
        - Administration
      x-openpsirt-requires:
        scope: product
        any_of:
          - assigner
  /v1/products/{product}/saved-filters:
    get:
      description: |-
        The narrowings you have kept, by name.

        **Personal, and nothing is shared.** No ownership, no permissions and no arguing about whose filter is authoritative — which is also what lets somebody keep one that is half-formed. Yours are the only ones this answers with, whoever asks.

        A saved filter naming something the list no longer offers simply stops narrowing by it, which is a way back to a slightly wider list rather than a refusal to open one.

        **Kept per product.** A filter narrows one product's findings list and its query names branches and variants that usually exist in no other, so one offered everywhere would be offered where it matches nothing.

        **Requires:** any signed-in person, and not a pipeline key. Answers your own and nobody else's.
      operationId: list-saved-filters
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodySavedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List your saved filters
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers your own and nobody else's.
  /v1/products/{product}/saved-filters/{name}:
    delete:
      description: |-
        Drops one of your own. A name you have not kept is not there, which is the same answer as somebody else's — the filters are personal, and the query says so rather than only the screen.

        **Requires:** any signed-in person, and not a pipeline key. Yours alone.
      operationId: forget-filter
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            maxLength: 120
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Forget a saved filter
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Yours alone.
    put:
      description: |-
        Keeps the findings list's current narrowing so it can be opened again. Saving under a name you already use replaces it: the act is deciding what that name means, and refusing would make somebody delete before they could correct.

        **Requires:** any signed-in person, and not a pipeline key. Yours alone.
      operationId: save-filter
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            maxLength: 120
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Save-filterRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Keep a filter under a name
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Yours alone.
  /v1/products/{product}/streams:
    get:
      description: |-
        Every stream declared under this product, with how many variants each has and how much is open in it.

        A stream is a branch or a tag: a branch is scanned nightly and superseded, a tag is immutable and kept. Both are declared before a scan may name one, so a typo in a pipeline is refused rather than quietly creating a line with findings and reports of its own.

        A stream past its end-of-life date is listed and says so. It stops being a place a fix may be declared for, and what is open against it is still counted.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-streams
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyStreamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's branches and tags
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
    post:
      description: |-
        Records a line of a product. A branch moves and is rebuilt; a tag never changes and is what somebody received.

        **Requires:** administrator
      operationId: declare-stream
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredStreamBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a branch or tag
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: deployment
  /v1/products/{product}/streams/{stream}/end-of-life:
    put:
      description: |-
        Sets the date support ends for one release, overriding what its product says. Past it, nothing on the release carries a remediation deadline and a build that stops being scanned is expected rather than a fault.

        An empty date clears the override, so the release follows its product again. Clearing is not the same as stating the product's current date: a release that stated it would stop following when the product changed.

        **Requires:** administrator
      operationId: set-stream-end-of-life
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndOfLifeBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set when a branch or tag goes out of support
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: deployment
  /v1/products/{product}/streams/{stream}/release:
    put:
      description: |-
        Records the day a tag actually shipped, and the branch it was cut from.

        **Both are settable after the fact, because that is when they are usually known.** A tag is declared here so scans can be filed against it, which happens whenever somebody gets to it — before the release, months after, or while backfilling a year. Fixed at declaration, a release recorded late ordered after ones that came out before it, and a year entered in an afternoon plotted as a single day.

        The date orders and labels the release-over-release chart. Left unset, the day the release was declared here stands in.

        **The parent fills in, and never changes.** It is what a branch is compared against for release notes, and a pipeline that does not know declares the tag without it — so saying it late is the same act arriving late, because nothing had been said for it to contradict. Naming a different branch is refused, and so is clearing one: a tag is one frozen point and it came from wherever it came from. It is a branch and nothing is cut from itself; both are refused rather than stored, because a cycle here is a comparison that never returns.

        An empty date clears the date. An empty parent leaves whatever stands alone.

        **Requires:** administrator
      operationId: set-release-details
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Set-release-detailsRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set when a release went out and what it was cut from
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: deployment
  /v1/products/{product}/streams/{stream}/variants:
    get:
      description: |-
        Lists the variants one release was actually built as — a subset of what the product declares.

        A release predating a variant has never been filed against it and does not list it, which is what keeps something introduced later from appearing to have shipped years ago.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-release-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyVariantBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the variants a release was built as
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/carried:
    get:
      description: |-
        Returns what an existing line's decisions would mean for this one, without changing anything. Ask before creating a line: the answer is what somebody is agreeing to.

        Four groups, because they need four different things:

        `applying` reach this line by matching, and there is nothing to choose.

        `moved` held a claim at a version this line does not have. Each would come across as a **proposal carrying the old reasoning**, never as a decision.

        `postponed` were deferrals. Each says how long it has already been put off across every line it has come through, which is the total that carrying it again agrees to.

        `absent` cover nothing here and are left behind.

        **Requires:** public-triage or private-triage on the product
      operationId: preview-carried-decisions
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The stream to inherit from
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The stream to inherit from
            type: string
        - description: That stream's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: That stream's variant
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarriedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what triage a new line would inherit
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
    post:
      description: |-
        Takes the judgments named onto this build as claims waiting for agreement, each carrying the words from the line it came from.

        **Reasoning travels and conclusions do not.** Every one arrives needing approval, however confident whoever carried it was: a version moved, which is exactly what made the old judgment stop applying, so somebody has to look at the new code. What is inherited is the thinking rather than the answer.

        **Only what the preview offered.** A judgment that already applies here has nothing to agree to, and one covering nothing here has nothing to apply to; naming either is refused rather than skipped, because a caller that got the set wrong should hear so.

        A deferral is carried with the date it had, not with a fresh one. Bounded by the same setting that bounds every other action writing many rows.

        **Requires:** public-triage or private-triage on the product
      operationId: carry-decisions
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The line to carry from — a branch or a tag
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The line to carry from — a branch or a tag
            type: string
        - description: That line's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: That line's variant
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Carry-decisionsRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Carry-decisionsResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Carry chosen triage onto a new line
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/carried-patches:
    get:
      description: |-
        Everything this build has argued about in its own inventories: carried patches saying what they fix, and statements it sent alongside.

        **A history rather than a list of what is true tonight.** Each row says when the build first said it and when it stopped, because a claim that stopped is the interesting one — somebody dropped a patch, and the finding it answered is back. A list of what is current would not have that row at all.

        **A carried patch is the only way a backport can be seen here.** No version comparison finds one: the fix is in the package and the version has not moved, so unless the build declares it, the finding sits open with nothing true to say about it.

        `suppresses` says whether a claim takes a finding off the list. Saying it is affected, or that it has not decided, is information rather than an answer.

        Narrow to one package with `component`, matched on what the claim says it is about rather than on a component this build carries — a claim naming something that is no longer here is exactly the row somebody asking why a patch stopped working is looking for.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-carried-patches
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: Narrow to what one package was claimed about
          explode: false
          in: query
          name: component
          schema:
            description: Narrow to what one package was claimed about
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-carried-patchesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what a build says it deals with itself
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/components:
    get:
      description: |-
        Returns the build's own component and what it depends on, most findings first. The root is named separately from the list because it is what the list hangs from rather than a member of it.

        The starting point for walking the graph. A full render is not offered and would not be useful: a real image holds thousands of components and tens of thousands of edges, which neither draws nor reads. Ask for one step at a time.

        Every entry carries how many findings are open against it and how many components it pulls in, so descending follows something rather than being exploration.

        With `q` it searches instead: components anywhere in the build whose name contains that text, most findings first and no root. Nobody finds anything in a graph this size by opening nodes — a real image holds eight thousand components under a root with five thousand children — so searching is the way in, and browsing is for answering "what else is under this" once you are already somewhere.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-top-level-components
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: Find components anywhere in this build whose name contains this, instead of listing what the build pulls in directly
          explode: false
          in: query
          name: q
          schema:
            description: Find components anywhere in this build whose name contains this, instead of listing what the build pulls in directly
            maxLength: 200
            type: string
        - description: How many matches to return. Only read when searching
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many matches to return. Only read when searching
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what a build pulls in directly
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/mine:
    get:
      description: |-
        The build's dependency graph, seen upward from your own work: from each component you hold a finding on, up to the build's root.

        **This is what the tree is for somebody who holds no reading on the product.** Descended from the root, that tree is the inventory of what the product contains — the breadth they were not granted — so it cannot be offered with rows hidden: a container's count would still say how much sits under it. The chain upward is the part that makes a finding judgeable, because it says what pulled the thing in, and every node on it sits above something already granted.

        **The counts are yours.** A node says how much of your own work hangs beneath it along these chains, never how much the build holds there.

        Rows come back in the order they are drawn, parents before children, the fullest branch first. A component the inventory placed nowhere has no chain and sits at the end.

        **Requires:** any signed-in person, and not a pipeline key. Answers what you hold, whether or not you read the product.
      operationId: list-my-components
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OursOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show the chains your own findings sit on
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers what you hold, whether or not you read the product.
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/around:
    get:
      description: |-
        Returns what pulls this component in, and what it pulls in.

        `above` is the direction people actually use. Somebody arrives from a finding and asks why the component is here, which is walking up — and up is short. Walking down is where the size lives.

        A component reached several ways appears once with several parents. It is a graph rather than a tree, so anything drawing it has to expect the same component under many places.

        **A component name is not unique within a build.** Where one ships at several versions, `version` says which — without it, a name that matches more than one is refused with 409, naming the choices, rather than guessed at.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-component-neighbors
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The component's name, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component's name, as the findings list gives it
            type: string
        - description: Which version, where the build ships that name at more than one
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build ships that name at more than one
            type: string
        - description: Which ecosystem, for the few names one build holds at one version as two components
          explode: false
          in: query
          name: ecosystem
          schema:
            description: Which ecosystem, for the few names one build holds at one version as two components
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AroundBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what is directly above and below a component
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/decisions:
    post:
      description: |-
        Records the same claim against every issue you name: one outcome, one justification, one reasoning, and a separate decision for every place each issue sits at, each keyed and expiring on its own.

        You name the issues; the places are resolved here. `selected_by` says how you narrowed the list and is recorded with every claim, so "how were these chosen" has an answer later — but it is never the claim. The reasoning has to hold for every issue in the list, since "these matched a word" is not a defense anybody would accept.

        Always needs a second person to agree, whatever the outcome.

        Bounded. At most 2000 names per request, and a limit on how many findings one action may write, set under `triage.together-cap`. The limit is checked against the findings this resolves to, which is more than the number of names.

        **Requires:** public-triage or private-triage on the product
      operationId: decide-together
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decide-togetherRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decide-togetherResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record one judgment about several issues at once
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/issues:
    get:
      description: |-
        Returns the distinct issues open against this component in this build, most urgent first, with how many places each sits at and the version that fixes it where the report names one.

        `contains` matches the text of a report. It narrows a list; it is not part of any claim made afterwards.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-issues-at-component
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
        - description: Match the text of the report
          explode: false
          in: query
          name: contains
          schema:
            description: Match the text of the report
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-issues-at-componentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the issues open against one component
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}:
    get:
      description: |-
        Returns the full record for one issue in one component of a build: the description, the advisory, every reference the data carries with patches listed first, the score and what it assumes, whether it is known to be exploited and how likely exploitation is, the weakness classification, what upstream has done about it, and every place the component sits at here.

        This is what a triage decision is made from, so it is gathered into one request. Each entry in `places` carries the `place` identity to name when recording a decision about it.

        **A component name is not unique within a build.** Where one ships at several versions, `version` says which — without it, a name that matches more than one is refused rather than guessed at.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: The component's name, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component's name, as the findings list gives it
            type: string
        - description: Which version, where the build ships that name at more than one
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build ships that name at more than one
            type: string
        - description: Which ecosystem, for the few names one build holds at one version as two components — a source repository and the package built from it
          explode: false
          in: query
          name: ecosystem
          schema:
            description: Which ecosystem, for the few names one build holds at one version as two components — a source repository and the package built from it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get everything known about one finding
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}/assignment:
    put:
      description: |-
        Records who is dealing with this issue in this component.

        **It covers the product, not the build named in the path.** The path says which finding is being looked at; what is assigned is every build of the product holding the same component, and every place that component sits at.

        Send `person` as an empty string to hand it back to nobody, which is this same operation rather than one of its own.

        Send `team` instead to route it to a team. That is a queue rather than a holding: it stays unheld until somebody takes it, and anybody on the team may take it with the triage right alone. Routing to a team asks that at least one member may read what is being routed there — not that every member may.

        Findings arriving later under the same component start unassigned.

        **Requires:** public-triage or private-triage on the product. Giving work to somebody else also needs assigner. Taking unowned work, or handing back your own, does not.
      operationId: assign-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assign-findingRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Assign a finding to somebody
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
        note: Giving work to somebody else also needs assigner. Taking unowned work, or handing back your own, does not.
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}/decision:
    post:
      description: |-
        Records the same claim against every place this issue occupies in this component. Naming `places` narrows it; leaving it out covers all of them.

        **A place left out stays open.** Nothing is recorded against it and nothing is asked about it.

        One record is written per place, each keyed and expiring on its own, so this reads later as the several decisions it is rather than as one.

        The ordinary approval rules apply however many places this reaches: covering many places does not on its own require a second person.

        Pass `also` to apply the same judgment to other builds of this product, naming each as the reach gives it. All of it is written in one transaction: the response is what every build recorded, or a refusal and nothing written anywhere. In those builds only the places nothing already stands at are written, because the ones at matching versions are reached by lookup already.

        Pass `extends` to carry an approved claim to this issue: the source must be approved, sit at the same component under the same consumer, and the outcome and justification must match it. The new claim is recorded as an extension of it and still waits for a second person. `similar` on `GET .../findings/{vulnerability}/components/{component}` lists the claims that qualify.

        **`patch-needed` is the backport case**: a fix is being carried into this build and the version does not move, so it requires `committed_to`, the date the work lands. `upgrade-needed` is not recorded here — a bump answers a component and everything open on it, so it is recorded from the component.

        **Requires:** public-triage or private-triage on the product
      operationId: decide-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: The component, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component, as the findings list gives it
            type: string
        - description: Which version, where the build ships more than one under that name
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build ships more than one under that name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingDecisionBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecidedBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record one judgment about a finding, covering its places
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}/reach:
    get:
      description: |-
        The same three parts the per-place answer gives, for every place the finding sits at, merged.

        A judgment is made about an issue in a component, which is a group of places rather than one — a kernel flaw sits at sixty. Asking per place is a request each, so a screen doing that samples, and a sample decides which other builds it can offer to include: one reachable only from a place the sample missed is never offered and the judgment does not travel there.

        A build reached from two places of the finding is one thing to agree to, and carries the places of both.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-finding-reach
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
        - description: Which version, where the build holds that name at more than one
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build holds that name at more than one
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show how far a decision about this finding would reach
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}/tags/{tag}:
    delete:
      description: |-
        Removes a tag. Taking off one that is not there succeeds and changes nothing.

        **Requires:** public-triage or private-triage on the product
      operationId: untag-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
        - description: The word, matched without regard to capitals
          in: path
          name: tag
          required: true
          schema:
            description: The word, matched without regard to capitals
            maxLength: 191
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take a tag off a finding
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
    put:
      description: |-
        Puts a free-text tag on one issue in one component of this product.

        **No fixed vocabulary**, because none has been earned yet. A tag that becomes universal is a signal that it should be promoted to a real concept — "waiting on vendor" is a state the tool would want to reason about rather than a string somebody typed.

        **One issue in one component of one product**, not one place and not one build: a kernel flaw at sixty places is one thing somebody is tagging, and a tag is about the work rather than about a release.

        Matched without regard to capitals and shown back as it was typed. Tagging what already carries the tag succeeds and keeps the first spelling.

        **Tagging is triage**, so it asks for the triage right: a tag changes what a filtered list answers, and somebody who may only read should not move work into or out of a saved filter.

        **Requires:** public-triage or private-triage on the product
      operationId: tag-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
        - description: The word, matched without regard to capitals
          in: path
          name: tag
          required: true
          schema:
            description: The word, matched without regard to capitals
            maxLength: 191
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Tag a finding with a word
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/decision:
    get:
      description: |-
        Returns the decision currently suppressing this finding, if any, together with everything decided here before — withdrawn claims, and claims that stopped applying when an upstream version changed.

        `standing` is absent when nothing has been decided, or when a claim is still waiting for approval: a claim nobody has agreed to suppresses nothing.

        Read `previously` before deciding again. A claim that lapsed on a version bump is usually still the right answer, and re-affirming it is a different request from making a new one.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-finding-decision
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: Which place, as the findings list gives it
          in: path
          name: place
          required: true
          schema:
            description: Which place, as the findings list gives it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get what has been decided about a finding
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
    post:
      description: |-
        Records how a finding was triaged: `affected`, `not-applicable`, `deferred`, `wont-fix`, `already-fixed` or `patch-needed`.

        `not-applicable` requires a `justification` from the standard VEX vocabulary. `deferred` requires `deferred_until` as a date. `already-fixed` requires `fixed_version`, the version whoever packages the component states the fix arrived in — it is recorded for a reader and never compared against what ships.

        **`patch-needed` is the backport case**: a fix is being carried into this build and the version does not move. It requires `committed_to`, the date the work lands, and it closes the only way a backport can — the next inventory declares the patch it carries and says what that patch resolves, so the finding goes while the version stays where it was.

        `upgrade-needed` is not recorded here. A bump answers a component rather than one finding, so it is recorded from the component and covers everything open on it.

        The decision applies to every build running the same component and consumer upstream versions, including future releases — it is matched by code, not copied between releases. It stops applying automatically when either upstream version changes.

        The response says whether a second person must approve it. Most outcomes require approval; a deferral shorter than the configured threshold does not.

        It also says how many findings this one judgment covers, and how many distinct versions of the component sit at this place — more than one means a single decision cannot honestly cover all of them.

        **Requires:** public-triage or private-triage on the product
      operationId: decide
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: Which place, as the findings list gives it
          in: path
          name: place
          required: true
          schema:
            description: Which place, as the findings list gives it
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record a triage decision for a finding
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/decision/reaffirmation:
    post:
      description: |-
        Re-makes a decision that stopped applying because an upstream version moved, at the versions this finding has now. `previous` is the decision being re-made, from `previously` in `GET .../decision`.

        Only the person who made the original may do this, and it normally needs no second approver: two people already agreed to the claim, and a version bump is a prompt to re-check rather than a new claim.

        It does need approval again if the vulnerability's severity has risen since the original was agreed to, or if nothing was ever agreed to. What was agreed was that this did not matter much, which is not an agreement about what it has become. The response says whether a second person is needed.

        Where no second person is needed, the earlier agreement is carried onto the new claim and recorded as carried. The approver named agreed to the previous claim's reasoning, not to what is written here.

        `reasoning` is required. "Still true" with nothing behind it is what a re-affirmation becomes when it is made too easy.

        **Requires:** public-triage or private-triage on the product
      operationId: reaffirm-decision
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: place
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reaffirm-decisionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-affirm a decision after an upstream version changed
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/reach:
    get:
      description: |-
        Returns the three parts of what a judgment made here covers.

        `here` is how many places in this build. `automatic` are other builds it reaches without anybody doing anything, because their upstream versions and chains already match — a decision is a claim about a combination of code, not about a release. `differing` hold the same issue at the same place at another version, so each is a separate judgment.

        Only `differing` is a choice. The first two follow from the matching rules and are there to be told, not agreed to — and showing them as one number is how a decision comes to reach builds the person making it never knew about.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-decision-reach
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: place
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show how far a decision here would reach
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/resolve:
    post:
      description: |-
        Closes a flaw somebody recorded here, in one build, because it has been fixed there. Every location of the issue in that build is closed together.

        **Only a flaw somebody recorded.** Everywhere else, resolution is computed from scans rather than declared, which is what stops a fix being reported that shipped in nobody's release. A flaw recorded by hand is the one case with no such evidence and no prospect of any — no scan reports it — so a person closes it or nothing does. An issue a scanner found is refused.

        **A reason is required.** A closure with no reason is a record saying somebody closed it and nothing else.

        **Nothing reopens one.** Closing is a considered act, and this is the way it is undone: it is not.

        **Requires:** public-triage or private-triage on the product
      operationId: resolve-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resolve-findingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Close a recorded flaw as fixed in this build
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/pending-upgrades:
    get:
      description: |-
        Everything committed for this build, one row per bump — a source package at the version it was built at, moving to another version — with what it would still close here.

        **What it covers is a match, not a list.** A finding is covered when its component folds to the same key in this build, so changing the version a release is moving to is one row, and an issue published tonight against the same package is covered by this morning's commitment with nobody acting.

        **The fix-bundle query read from the other end.** A triager reads a bump and the issues it closes; a coordinator reads a build and the bumps it is waiting on. One query rather than two reports that will eventually disagree.

        **Nothing here is declared done.** A piece of work has landed when the build stops holding it, which the scans already say — a declared fix that is still open after a scan has run is a missed target, and the scan is independent evidence against the claim.

        **Each row says where it stands** — planned, landed, or lapsed — derived on every read from the scans and the date the promise named, and set by nobody. A lapsed upgrade returns as one item to whoever holds it: the findings it covers stay covered, because deciding them again one at a time is the thing the promise was made instead of. They return on their own only when the component moved and they did not close, which needs nothing extra — a decision is keyed on the version it was made against and stops applying the moment that version changes.

        There is no separate 'replanned': re-promising writes a new date and the standing promise is the one read, so a replanned upgrade is a planned one with a later date.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-pending-upgrades
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPlannedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the upgrades one build is waiting on
      tags:
        - Remediation
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/readiness:
    get:
      description: |-
        Answers the question asked before shipping: is what we are about to ship better or worse than what we last shipped. "8 criticals now, v2.4.1 shipped with 4."

        The release is the newest one cut from this branch, **built the same way**, that has been scanned here — a branch built for one chip beside a release built for another compares two different pieces of software and reads as a regression somebody then goes looking for.

        Both sides come from scans already collected, so this asks nothing new of a build pipeline. Where there is nothing to compare against, `shipped` is absent and `why` says what is missing rather than reporting zeroes, because a release that shipped clean and a release nobody scanned are not the same answer.

        Counted as issues at components at or above the deployment's line, which `floor` names.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-readiness
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Compare a branch against the last release cut from it
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/register:
    get:
      description: |-
        One row per issue and place in this build, with its state, what was claimed, who claimed it, who agreed, when each of those happened, its deadline and whether that was met.

        **The complement of the audit list, not a variant of it.** The audit list says what was decided; an auditor's first question is what was *known*, decided or not — so `undecided` rows are in here, and closed ones too. A register of only what is still open answers a different question.

        **Current state, and no `as_of`.** Reconstructing the view as of a past date was asked for and refused: each row already carries the dates that evidence what is being checked, and a reconstruction would be a second answer about the past that has to be kept honest against the first.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-disposition-register
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 200
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Get-disposition-registerResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List every known vulnerability in a build and its disposition
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/register.{format}:
    get:
      description: |-
        The register as a file. Read with your own visibility as it streams, like every other export here.

        **Requires:** any signed-in person, and not a pipeline key. Exports only what you may see.
      operationId: export-disposition-register
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: format
          required: true
          schema:
            enum:
              - csv
              - json
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Export the disposition register
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Exports only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/runs/{run}:
    get:
      description: |-
        One run, with what it was measured with and what it changed — broken down by the rating in force, and with how much of what it opened is known to be exploited.

        **A receipt says a run happened; this says what it did.** A row reading "7,604 opened" is a number with no shape, and somebody looking at a build that jumped overnight is asking which of them matter.

        Counted as issues at components, the unit every other count here uses: a component reached twenty ways carries the same issue twenty times, so counting rows would report how much the dependency graph shares rather than how much changed.

        Derived when it is asked for rather than stored, so it moves as findings close and reopen — and narrowed by what you may see, like every other count here.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-scan-run
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The run, as a receipt or a finding names it
          in: path
          name: run
          required: true
          schema:
            description: The run, as a receipt or a finding names it
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what one run of the scanner did
      tags:
        - Ingest
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/scans:
    get:
      description: |-
        Returns uploads newest first, each with its state: `reading` (accepted, not yet parsed), `scanning` (parsed, vulnerability scan pending), `scanned` (complete), or `failed` with the reason.

        Because uploads return 202 before parsing, this is how a build pipeline finds out whether its SBOM was usable. An API key sees only the uploads it sent itself.

        **Requires:** any recognized credential. Answers only what you may see.
      operationId: list-scans
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List uploaded scans and their status
      tags:
        - Ingest
      x-openpsirt-requires:
        scope: any
        note: Answers only what you may see.
    post:
      description: |-
        Accepts a CycloneDX 1.x, SPDX 2.x or SPDX 3.x SBOM and any number of OpenVEX documents as multipart form fields named `inventory` and `suppressions`. The format is taken from the document itself; a major version this does not read is rejected by name.

        The product, branch and variant must already exist; an upload naming something undeclared is rejected and the error says which part is missing.

        **Returns 202 before the documents are parsed.** A success here means they were accepted for processing, not that they were valid. Poll `GET .../scans` to find out whether they parsed and what the scan found.

        **Requires:** public-triage or private-triage on the product. A pipeline key covering this product, branch and variant sends without any of these, and is how a build sends.
      operationId: upload-scan
      parameters:
        - description: The declared product this build is of
          in: path
          name: product
          required: true
          schema:
            description: The declared product this build is of
            type: string
        - description: The declared branch or tag
          in: path
          name: stream
          required: true
          schema:
            description: The declared branch or tag
            type: string
        - description: The declared way that stream is built
          in: path
          name: variant
          required: true
          schema:
            description: The declared way that stream is built
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              inventory:
                contentType: application/json,application/octet-stream
              suppressions:
                contentType: application/json,application/octet-stream
            schema:
              properties:
                inventory:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                suppressions:
                  items:
                    contentEncoding: binary
                    contentMediaType: application/octet-stream
                    format: binary
                    type: string
                  type: array
              required:
                - inventory
              type: object
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload an SBOM and its VEX documents
      tags:
        - Ingest
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
        note: A pipeline key covering this product, branch and variant sends without any of these, and is how a build sends.
  /v1/products/{product}/streams/{stream}/variants/{variant}/scans/{scan}/documents/{document}:
    get:
      description: |-
        Returns the bytes as they arrived, byte for byte: the hash on the receipt is over what comes back from here, so a copy can be checked against what was actually read.

        **A tagged release keeps its documents and a branch build does not.** A nightly build's contents are let go once they have been read, because keeping them costs storage that grows with the calendar; a tag's are kept because re-scanning it years from now needs both what it contained and what the build had already argued about its own patches. One that was let go answers **410**, which says the bytes went on purpose — the record of what arrived is still on the receipt.

        Named through the scan it belongs to rather than on its own, so whoever may read the receipt may read what it describes and there is one rule rather than two.

        **Requires:** any recognized credential. Answers only what you may see.
      operationId: fetch-scan-document
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The upload, as the receipt names it
          in: path
          name: scan
          required: true
          schema:
            description: The upload, as the receipt names it
            format: int64
            type: integer
        - description: Which of its documents, as the receipt names it
          in: path
          name: document
          required: true
          schema:
            description: Which of its documents, as the receipt names it
            format: int64
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Fetch a scan document
      tags:
        - Ingest
      x-openpsirt-requires:
        scope: any
        note: Answers only what you may see.
  /v1/products/{product}/streams/{stream}/variants/{variant}/vex:
    get:
      description: |-
        Returns an OpenVEX document saying what stands about the third-party components this build ships: every approved `not applicable` and `already fixed` claim, as `not_affected` and `fixed` statements with the justification and the reasoning somebody wrote.

        **Approved claims only**, and a deferral is absent rather than exported as anything — silence already reads as affected in this format.

        **Public findings only.** `undisclosed=true` includes the rest for somebody who may read them, which is a preview rather than a thing to publish.

        Requires a publisher configured for this deployment: a document naming none has nobody as its author.

        **Requires:** public-read or public-triage or private-read or private-triage on the product. Answers only what you may see. A grant on one case does not reach it: the document is about the whole build rather than about one issue.
      operationId: get-vex
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: Include findings nobody has announced. A preview, not a document to publish
          explode: false
          in: query
          name: undisclosed
          schema:
            description: Include findings nobody has announced. A preview, not a document to publish
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statements"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Generate a VEX document for a build
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-read
          - public-triage
          - private-read
          - private-triage
        note: "Answers only what you may see. A grant on one case does not reach it: the document is about the whole build rather than about one issue."
  /v1/products/{product}/tags:
    get:
      description: |-
        Every tag anybody has used here, most-used first.

        What a filter offers rather than a vocabulary: the list is what people have actually written, which is also the evidence for promoting one of them to a real concept.

        **Only the words on findings you may read.** A tag row carries no visibility of its own, so the list is narrowed by the findings it was written on — reading it is a read act, and writing one is the act that asks for triage.

        **Requires:** public-read or public-triage or private-read or private-triage on the product. Answers only the words on findings you may see.
      operationId: list-tags
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyString"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's tags
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-read
          - public-triage
          - private-read
          - private-triage
        note: Answers only the words on findings you may see.
  /v1/products/{product}/triage-floor:
    put:
      description: |-
        Sets the least severity worth triaging for one product, overriding what the deployment says. Below the line a finding is still recorded, still counted and still reportable, and it carries no deadline — it is out of the working list, not out of the system.

        An empty value clears the override, so the product follows the deployment again. Clearing is not the same as stating the deployment's current line: a product that stated it would stop following when the deployment changed.

        Deadlines are rewritten afterwards, away from the request, because moving the line moves what is on a clock at all. The response returns before that has finished.

        **Requires:** administrator
      operationId: set-product-triage-floor
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageFloorBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set what a product considers worth triaging
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: deployment
  /v1/products/{product}/variants:
    get:
      description: |-
        Every variant declared under this product, with how much is open in each.

        A variant is a way one release is built — a hardware platform, a flavor — and it is independent of the branch: every stream may be built as any of them. One variant is the ordinary case, and the interface hides the dimension where there is only one.

        Each says whether it is customer-facing, which feeds how urgent a finding in it is, and defaults to customer-facing where nobody has said.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
