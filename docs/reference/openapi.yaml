      summary: Export the record of judgments
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Exports only what you may see.
  /v1/claims/{id}:
    delete:
      description: |-
        Withdraws the claim so none of it applies to any finding. A claim is one argument however many places it covers, so this takes back all of it; holding part of one back is setting rows aside, at `POST /v1/claims/{id}/approval`. The record is kept — a withdrawn claim reads as proposed, approved, then withdrawn. Requires no approval.

        **Requires:** public-triage or private-triage on the product
      operationId: withdraw-claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a triage claim
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
    get:
      description: |-
        Returns one claim whole: what it says, where it lands, what it covers now, and what became of it.

        A claim is one proposer's action however many decisions it wrote, so the outcome, the reason, the dates and the version are the claim's rather than any row's. `happened` reads the claim as a whole — `mixed` where its rows did not all end the same way — and `argument` names no decision, because nothing here acts on one.

        `rows`, `issues` and `places` are what it wrote. `folds`, `packages`, `consumers` and `findings` are what it covers **now**, which grows as builds appear with nobody acting; what somebody consented to is on the approval, at `GET /v1/claims/{id}/approvals`.

        For the earlier justifications see `GET /v1/claims/{id}/revisions` and for the discussion `GET /v1/claims/{id}/comments`.

        **Requires:** any signed-in person, and not a pipeline key. Answers only claims you may read every row of.
      operationId: get-claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a claim
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only claims you may read every row of.
  /v1/claims/{id}/approval:
    post:
      description: |-
        Approves every waiting decision in a claim as one action, under the same rules each decision is approved under: not by the person who proposed it, and against the revision of the reasoning that stands now.

        Name decisions in `except` to set them aside. The rest is approved; those are moved into a claim of their own, marked sent back, and `because` is recorded on each as a comment — the same way sending back records a reason. The response names that claim.

        Pass `batch` to approve several claims under one name, undone together with `DELETE /v1/approval-batches/{batch}`.

        Returns 404 for a claim you may not act on every row of, and 409 if you proposed it.

        **Requires:** approver or public-triage or private-triage on the product. The proposer may not approve their own.
      operationId: approve-claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimApprovalBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimApprovedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a claim
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - approver
          - public-triage
          - private-triage
        note: The proposer may not approve their own.
  /v1/claims/{id}/approvals:
    get:
      description: |-
        Returns every approval recorded against this claim, including ones later withdrawn, each naming the revision of the justification it was given for.

        An approval carrying `carried_from` was not given for this claim. A re-affirmation states its own reasoning and stands on the agreement its predecessor had, so the person named agreed to the earlier claim's words; `carried_from` is the approval where those are.

        A withdrawn approval is kept rather than deleted: who agreed to what, and when it stopped counting, is part of the record.

        `covered` is how many findings the claim covered **when it was agreed to**. A claim applies to every build running the same versions, so it covers more as builds appear — with nobody acting, and nobody having agreed to the larger number. Comparing this against what it covers now is the point of keeping it.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-claim-approvals
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyApprovalBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who approved a claim
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/claims/{id}/comments:
    get:
      description: |-
        Returns the comments on a claim, oldest first, with who wrote each and when. A comment that has been edited also carries when it was last changed.

        Comments are separate from the justification and never affect an approval.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-claim-comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyCommentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List comments on a claim
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
    post:
      description: |-
        Adds a markdown comment to a claim. Comments are separate from the justification and never affect an approval, so an approved claim can be annotated at any time.

        A comment may later be edited by its author only, and editing overwrites it rather than keeping revisions.

        **Requires:** approver or public-triage or private-triage on the product
      operationId: comment-on-claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment-on-claimRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment-on-claimResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a comment to a claim
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - approver
          - public-triage
          - private-triage
  /v1/claims/{id}/elsewhere:
    put:
      description: |-
        Stores a link to a ticket, a thread or a change — and sends nothing to it. A stored link has no egress at all, which is what makes it available to a deployment that has not decided to let anything out; the half that *sends* is a separate thing a deployment configures.

        Anybody who may argue about the claim may set it: a link is a note about where the conversation is rather than a judgment, and needing a second person for it would leave it unset.

        Sent empty it is cleared. A stale link is worse than none — it sends somebody to a ticket that closed for a different reason.

        **Requires:** public-triage or private-triage on the product
      operationId: point-claim-elsewhere
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Point-claim-elsewhereRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record where this claim's work is happening
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/claims/{id}/promise:
    put:
      description: |-
        Changes the version a promised upgrade moves to, or the date it is promised by, on the claim and on every commitment it wrote.

        **This withdraws any existing approval** and returns every row of the claim to the review queue. An approver agreed to a version by a date; changing either is changing what they agreed to, so it goes through the same act revising the words does.

        `reasoning` is required and is recorded as a revision — saying why a date moved is what the second person has to read, and the revisions are where what was said before survives being changed.

        **Requires:** public-triage or private-triage on the product
      operationId: repromise-upgrade
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Repromise-upgradeRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change what a release is moving to
      tags:
        - Remediation
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/claims/{id}/reasoning:
    put:
      description: |-
        Replaces the justification text with a new revision. Earlier revisions are kept and remain readable.

        A claim is one argument however many places it covers, so this revises all of it. **It withdraws any existing approval** and returns every row of the claim to the review queue, marked as previously approved. Requires no approval of its own.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.

        **Requires:** public-triage or private-triage on the product
      operationId: revise-claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Revise-claimRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a claim's justification
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/claims/{id}/revisions:
    get:
      description: |-
        Returns every revision of the justification, oldest first, with who wrote each and when.

        A claim is one argument however many places it covers, so its reasoning is one text with one history. An approval names the specific revision that was agreed to, so this is how to read what an approver actually saw rather than what the text says now.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-claim-revisions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyRevisionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a claim's justification history
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/claims/{id}/send-back:
    post:
      description: |-
        Asks the author for more before agreeing to any of a claim. Every waiting decision in it leaves the review queue together and comes back when the author revises.

        `because` is required and is recorded as a comment on each decision. Needs no approval of its own. You cannot send back a claim whose words are your own.

        **Requires:** approver or public-triage or private-triage on the product. The proposer may not approve their own.
      operationId: send-claim-back
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Send-claim-backRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a claim back for more
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - approver
          - public-triage
          - private-triage
        note: The proposer may not approve their own.
  /v1/claims/{id}/split:
    post:
      description: |-
        Moves the rows named into a claim of their own, belonging to you, carrying the argument they were made under and sitting with you rather than in the review queue. Revise it to give them an argument of their own.

        This is the proposer's side of setting rows aside: an approver reading a bulk claim may agree to most of it and hold some back, and until this the author could only withdraw the whole thing and start again. Each act is refused to the other — an approver holding rows back is agreeing to the rest in the same action, and a proposer doing that would be approving their own claim.

        `because` is required and is recorded as a comment on the new claim. Naming a row that is not part of the claim is refused rather than ignored, and so is naming all of what is still being argued — that is a revision or a withdrawal.

        **Requires:** public-triage or private-triage on the product
      operationId: split-claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Split-claimRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Split-claimResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Hold part of a claim back
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/comments/{id}:
    put:
      description: |-
        Replaces the text of a comment. Only its author may do this.

        **What it said before is kept**, and read back with `GET /v1/comments/{id}/history`. A comment is part of the record that goes public at disclosure, and a record whose earlier text is unrecoverable is readable rather than checkable — which is the property the whole append-only history exists for.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.

        **Requires:** approver or public-triage or private-triage on the product. Only the author may edit a comment.
      operationId: edit-comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Edit-commentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a comment
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - approver
          - public-triage
          - private-triage
        note: Only the author may edit a comment.
  /v1/comments/{id}/history:
    get:
      description: |-
        Every version of a comment that has been replaced, oldest first. The comment itself carries what it says now.

        A comment is part of the record that goes public at disclosure, so what it said before has to be recoverable: an edit that overwrites leaves a record somebody can read and nobody can check.

        Answers only where you may read what the comment is about — the same rule as reading the comment itself, asked of the decision rather than of the comment, because two rules for one question is one rule out of step.

        **Requires:** public-triage or private-triage on the product
      operationId: get-comment-history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyWasSaidBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List earlier revisions of a comment
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/compliance:
    get:
      description: |-
        By severity: how much closed inside its deadline, how much did not, how much is deferred by decision, and how much is plainly late.

        **A deferral is its own number and not a failure**, so `deferred` is neither met nor late.

        Counted in the same unit as every other screen: one issue at one component, not one row per place. A group is closed when no place is still open, met when none of the closed ones was late, deferred when every open place is covered by a standing deferral, and overdue when anything open is past its date and uncovered.

        A closed finding keeps the deadline it carried; only open ones lose theirs at end of life or below the triage line.

        **A product is required** — a place identity carries no product, so this cannot be asked across the deployment.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-compliance-rate
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyRateBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report what proportion of work met its deadline
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/decisions:
    get:
      description: |-
        Returns triage decisions on products you may triage, newest first, with the justification text for each.

        Filter by `outcome` to list dismissals (`not-applicable`, `wont-fix`) or postponements (`deferred`), by `state` to separate what is approved from what is still waiting or has been withdrawn, and by `product` to limit to one product.

        Set `expired=true` to list deferrals whose date has passed — the findings that have come back and need judging again.

        Set `stopped=true` for everything that has stopped standing — lapsed decisions and expired deferrals as one list. A decision can be both, so asking the two separately and adding the totals counts some of them twice.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-decisions
      parameters:
        - description: Limit to one product, by name
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name
            type: string
        - description: Limit to one outcome
          explode: false
          in: query
          name: outcome
          schema:
            description: Limit to one outcome
            enum:
              - affected
              - not-applicable
              - deferred
              - wont-fix
              - already-fixed
              - upgrade-needed
              - patch-needed
            type: string
        - description: Limit to one state
          explode: false
          in: query
          name: state
          schema:
            description: Limit to one state
            enum:
              - proposed
              - approved
              - withdrawn
              - lapsed
            type: string
        - description: Only deferrals whose date has passed
          explode: false
          in: query
          name: expired
          schema:
            description: Only deferrals whose date has passed
            type: boolean
        - description: Lapsed decisions and expired deferrals as one list. A decision can be both, so the two asked separately do not add up
          explode: false
          in: query
          name: stopped
          schema:
            description: Lapsed decisions and expired deferrals as one list. A decision can be both, so the two asked separately do not add up
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List triage decisions
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/decisions/{id}:
    get:
      description: |-
        Returns one decision with the justification as it currently stands, where it applies, who proposed it and how long it has stood.

        What it says — the outcome, the justification, the dates — belongs to the claim it is one row of, at `claim_id`. For the earlier justifications see `GET /v1/claims/{id}/revisions`, and for who agreed to which of them see `GET /v1/claims/{id}/approvals`.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a triage decision
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/deferrals/repeated:
    get:
      description: |-
        Places deferred more than once, most-deferred first, with how long they have been put off for in total.

        The cumulative threshold already refuses a further deferral past a point, one item at a time. What it cannot show is the shape across everything: one item deferred three times is a judgment, and forty of them is a policy nobody wrote down.

        Counted over the judgments rather than the findings they cover, so the order is not decided by how far a component spreads through an image.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-repeated-deferrals
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: How many deferrals make something worth listing. One is an ordinary judgment
          explode: false
          in: query
          name: at_least
          schema:
            default: 2
            description: How many deferrals make something worth listing. One is an ordinary judgment
            format: int64
            maximum: 50
            minimum: 2
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: Where in the list to start
          explode: false
          in: query
          name: offset
          schema:
            description: Where in the list to start
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyRepeatBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List repeated deferrals
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/disclosing:
    get:
      description: |-
        Returns findings nobody has announced whose embargo is running out, soonest first, and the ones whose date has already arrived.

        **Before the date, not on it.** The date arriving is the last moment to act on something rather than the first useful warning, and a list that only ever showed what was already past would be a list of decisions somebody has already failed to make.

        **Nothing here discloses anything.** Reaching the date escalates: the row appears and the people who can act on it are told. Publishing embargoed detail because a timer expired is the wrong default — if the fix is not ready, disclosing anyway is a decision a person makes.

        Every row is undisclosed by definition, so this list is a disclosure in its own right: a product you may not read undisclosed work in contributes nothing to it, not even a count.

        **Requires:** private-read or private-triage on the product. What you hold decides what comes back rather than whether you may ask. A product you may not read undisclosed work in contributes nothing, not even a count.
      operationId: list-approaching-disclosure
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - description: How many days ahead to look
          explode: false
          in: query
          name: within
          schema:
            default: 30
            description: How many days ahead to look
            format: int64
            maximum: 365
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: Where in the list to start
          explode: false
          in: query
          name: offset
          schema:
            description: Where in the list to start
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyEmbargoedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what is approaching disclosure
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - private-read
          - private-triage
        note: A product you may not read undisclosed work in contributes nothing, not even a count.
        narrowed: true
  /v1/disclosure-extensions:
    get:
      description: |-
        Every request to move a disclosure date that nobody has agreed to yet, across the products you may read undisclosed work in, newest first.

        **Until this there was nowhere to be that second person.** A request could be read on the finding it belongs to and nowhere else, so the only way to find one was to already know it existed — which is the failure the review queue exists to prevent, in the one place where what is being agreed to is how long something stays hidden.

        **Your own requests are here too**, marked as yours. You cannot agree to one — the endpoint refuses it — but a proposer looking for what is holding a case up should not have their own request hidden from them.

        Agree with `POST /v1/disclosure-extensions/{id}/approval`.

        **Requires:** any signed-in person, and not a pipeline key. Only where you may read undisclosed work.
      operationId: list-pending-extensions
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Where in the list to start
          explode: false
          in: query
          name: offset
          schema:
            description: Where in the list to start
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPendingExtensionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List extension requests waiting for a second person
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Only where you may read undisclosed work.
  /v1/disclosure-extensions/{id}/approval:
    post:
      description: |-
        Records a second person agreeing, and moves the date.

        The person who asked may not be the one who agrees. That is the control the threshold exists to reach, and an extension somebody approved for themselves is the same as one nobody approved.

        **Requires:** private-triage on the product. Not the person who asked for it.
      operationId: agree-to-extension
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a disclosure-date extension
      tags:
        - Findings
      x-openpsirt-requires:
        scope: product
        any_of:
          - private-triage
        note: Not the person who asked for it.
  /v1/findings:
    get:
      description: |-
        The findings list, without a product picked.

        **One row per product, issue and component.** The same library carrying the same issue in two products is two pieces of work, decided separately by different people; in three builds of one product it is one row, and `builds` says how many. Each row names one of those builds so there is somewhere to link to.

        **Every product's own triage line still applies.** `severity` raises the line for the whole page and never lowers it below what a product decided; `below_floor` turns every line off, which is how the rows a line keeps out are asked for.

        **An issue that exists only in products you hold nothing on answers as an issue that does not exist**, and `total` says the same.

        `beneath` is not offered: a subtree is a walk over one build's edges. Neither is `differs`, which is a statement about a selection of builds. Both are on the per-product list, which is where a build can be named.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-findings-anywhere
      parameters:
        - description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
          explode: false
          in: query
          name: severity
          schema:
            description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
            enum:
              - low
              - medium
              - high
              - critical
            type: string
        - description: Keep only issues somebody is known to be exploiting
          explode: false
          in: query
          name: exploited
          schema:
            description: Keep only issues somebody is known to be exploiting
            type: boolean
        - description: Keep only issues where an upstream fixed version is known
          explode: false
          in: query
          name: fixable
          schema:
            description: Keep only issues where an upstream fixed version is known
            type: boolean
        - description: Include what this product does not consider worth triaging. Those are always recorded and counted; this asks to see them in the list
          explode: false
          in: query
          name: below_floor
          schema:
            description: Include what this product does not consider worth triaging. Those are always recorded and counted; this asks to see them in the list
            type: boolean
        - description: "Keep only what is open against components of these names, whatever version. Any of them, not all: a component is one name and asking for two means either"
          explode: true
          in: query
          name: component
          schema:
            description: "Keep only what is open against components of these names, whatever version. Any of them, not all: a component is one name and asking for two means either"
            items:
              maxLength: 191
              type: string
            maxItems: 200
            type:
              - array
              - "null"
        - description: "Keep only what somebody marked with one of these words, matched without regard to capitals. Any of them, not all. Free text: what is in use here is listed at /v1/products/{product}/tags"
          explode: true
          in: query
          name: tag
          schema:
            description: "Keep only what somebody marked with one of these words, matched without regard to capitals. Any of them, not all. Free text: what is in use here is listed at /v1/products/{product}/tags"
            items:
              maxLength: 191
              type: string
            maxItems: 200
            type:
              - array
              - "null"
        - description: Keep only rows whose component name or issue name contains this, ignoring capitals. Issue names include every alias, so searching the name a reporter used reaches the row filed under the name a scanner used. A way to find a package, or an advisory, in a list of thousands — where component is the exact package name
          explode: false
          in: query
          name: q
          schema:
            description: Keep only rows whose component name or issue name contains this, ignoring capitals. Issue names include every alias, so searching the name a reporter used reaches the row filed under the name a scanner used. A way to find a package, or an advisory, in a list of thousands — where component is the exact package name
            maxLength: 200
            type: string
        - description: Keep only components of these package kinds, as the package identifier spells them — deb, apk, rpm, golang, cargo, pypi, npm, gem, generic, oci, github, maven, or anything else a producer emits. The kind is read out of the identifier rather than chosen from a list, so any string is accepted and one nothing carries matches nothing. Not the language's name — Rust is cargo and Python is pypi
          explode: true
          in: query
          name: ecosystem
          schema:
