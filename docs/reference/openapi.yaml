              schema:
                $ref: "#/components/schemas/ModeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set the role assignment mode
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
