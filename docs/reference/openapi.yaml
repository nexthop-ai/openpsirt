          enum:
            - planned
            - landed
            - lapsed
          type: string
        to:
          description: The version it moves to, as the commitment recorded it
          type: string
        upstream:
          description: "What to call it: the source package"
          type: string
      required:
        - fold
        - upstream
        - from
        - to
        - components
        - issues
        - places
        - declared_at
        - state
      type: object
    PlannedUpgradeBody:
      additionalProperties: false
