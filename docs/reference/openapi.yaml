        **Read with your own visibility, as it streams.** It is the same query the screen reads, paged and written out as it goes.

        Each product applies its own triage line, so the file states that rather than naming one line, and `product` is a column.

        Takes every filter the cross-product list takes. `beneath` and `differs` are not offered here, for the reason that list gives.

        **Requires:** any signed-in person, and not a pipeline key. Exports only what you may see.
      operationId: export-findings-anywhere
      parameters:
        - in: path
          name: format
          required: true
          schema:
            enum:
              - csv
              - json
            type: string
        - description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
          explode: false
          in: query
          name: severity
          schema:
            description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
            enum:
              - low
              - medium
              - high
              - critical
            type: string
        - description: Keep only issues somebody is known to be exploiting
          explode: false
          in: query
          name: exploited
          schema:
            description: Keep only issues somebody is known to be exploiting
            type: boolean
        - description: Keep only issues where an upstream fixed version is known
          explode: false
          in: query
          name: fixable
          schema:
            description: Keep only issues where an upstream fixed version is known
            type: boolean
        - description: Include what this product does not consider worth triaging. Those are always recorded and counted; this asks to see them in the list
          explode: false
          in: query
          name: below_floor
          schema:
            description: Include what this product does not consider worth triaging. Those are always recorded and counted; this asks to see them in the list
            type: boolean
        - description: "Keep only what is open against components of these names, whatever version. Any of them, not all: a component is one name and asking for two means either"
