            type: boolean
        - description: Keep only what one of these VEX publishers has a standing statement about
          explode: true
          in: query
          name: vex_publisher
          schema:
            description: Keep only what one of these VEX publishers has a standing statement about
            items:
              maxLength: 191
              type: string
            maxItems: 200
            type:
              - array
              - "null"
        - description: Keep only what was first seen here after this date, as 2026-03-31
