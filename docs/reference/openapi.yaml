          in: query
          name: vex_status
          schema:
            description: Keep only what a VEX statement says one of these about, in the format's own vocabulary. With a publisher, both must hold
            items:
              enum:
                - not_affected
                - affected
                - fixed
                - under_investigation
              type: string
            type:
              - array
              - "null"
        - description: Keep only groups whose issue we rated differently from the world — what has been re-prioritized here
          explode: false
          in: query
          name: reassessed
          schema:
            description: Keep only groups whose issue we rated differently from the world — what has been re-prioritized here
            type: boolean
        - description: Keep only what a person recorded here, or only what a scanner reported. Left out, both. The ones a person recorded are the only ones a person may close by hand
          explode: false
          in: query
          name: origin
          schema:
            description: Keep only what a person recorded here, or only what a scanner reported. Left out, both. The ones a person recorded are the only ones a person may close by hand
            enum:
              - scanner
              - manual
            type: string
        - description: Keep only what a promised upgrade covers, or only what none covers. Derived from the decisions rather than stored, so withdrawing a promise puts what it covered back with nothing to clean up. 'unplanned' is the working list once planned work is out of view, and is what the by-issue list asks unless told otherwise; 'either' is how a reader asks for it back, and is what leaving this out means
          explode: false
          in: query
          name: planned
          schema:
            description: Keep only what a promised upgrade covers, or only what none covers. Derived from the decisions rather than stored, so withdrawing a promise puts what it covered back with nothing to clean up. 'unplanned' is the working list once planned work is out of view, and is what the by-issue list asks unless told otherwise; 'either' is how a reader asks for it back, and is what leaving this out means
            enum:
              - planned
              - unplanned
              - either
            type: string
        - description: Keep only groups a scanner reached by comparing a published identifier against an upstream version range, never against an advisory for the package in its own ecosystem. A distribution backports fixes without moving the upstream version, so these are neither confirmed nor refuted — somebody has to look, and finding them one at a time is not a thing anybody does
          explode: false
          in: query
          name: unconfirmed
          schema:
            description: Keep only groups a scanner reached by comparing a published identifier against an upstream version range, never against an advisory for the package in its own ecosystem. A distribution backports fixes without moving the upstream version, so these are neither confirmed nor refuted — somebody has to look, and finding them one at a time is not a thing anybody does
            type: boolean
        - description: "Drop components of these names. One package can drown the list: on a switch image the kernel carried 4,943 of 6,822 rows"
          explode: true
          in: query
          name: exclude
          schema:
            description: "Drop components of these names. One package can drown the list: on a switch image the kernel carried 4,943 of 6,822 rows"
            items:
              maxLength: 191
              type: string
            maxItems: 200
            type:
              - array
              - "null"
        - description: "Which order to page in. Urgency by default, which is what the list is designed around: what somebody with an hour should look at first. A finding with no deadline sorts last whichever direction is asked for"
          explode: false
          in: query
          name: sort
          schema:
            description: "Which order to page in. Urgency by default, which is what the list is designed around: what somebody with an hour should look at first. A finding with no deadline sorts last whichever direction is asked for"
            enum:
              - urgency
              - age
              - deadline
              - places
              - epss
              - severity
            type: string
        - description: Order the other way — oldest, nearest deadline, fewest places, lowest first
          explode: false
          in: query
          name: asc
          schema:
            description: Order the other way — oldest, nearest deadline, fewest places, lowest first
            type: boolean
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Export findings across every product
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Exports only what you may see.
  /v1/issues/{vulnerability}:
    get:
      description: |-
        Every build that carries this issue, across every product you may see, with how far it has been decided in each.

        **One row per build and component**, not per place: the same component in two builds is two things somebody ships, and sixty places of it in one build is one piece of work with a count.

        **Narrowed the way every other read is**, per product and per visibility. A page that spans products is exactly where filtering afterwards gets forgotten, and the count is the leak even when no row is shown.

        Answers by any name the issue goes by.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-issue
      parameters:
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 200
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List findings for one issue across every product
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/keys:
    get:
      description: |-
        Which credentials exist, what each may send, when it was last used and whether it still works. The secrets are not here and cannot be: what is stored is a digest.

        **Requires:** administrator
      operationId: list-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyKeyBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List API keys
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
    post:
      description: |-
        Creates a credential a build may send scans with, and returns its secret. The secret is shown once and stored hashed: a credential store that can hand back what it holds gives up every pipeline's key with a copy of the database.

        **Requires a session.** A credential cannot create another, and a key created by one would outlive it.

        **Requires:** administrator
      operationId: create-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredKeyBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an API key
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/keys/{name}:
    delete:
      description: |-
        Stops it working, without removing the record of what it sent. Revoking one credential leaves every other pipeline running.

        **Requires:** administrator
      operationId: revoke-key
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw an API key
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/measures:
    get:
      description: |-
        Four figures about how this deployment is working, as against what it holds: how long a finding sits before anybody proposes anything, how long a claim waits for a second person, what each person got through, and how much came back.

        **The two waits come back three ways each** — the middle, what nine in ten came in under, and the longest — so a caller reads three numbers per wait rather than one.

        **Per severity**, because a critical waiting a week and a low waiting a week are not the same fact.

        **Bounded, and it says so.** The two waits are worked out from at most the most recent few thousand claims in the window; `sampled` says how many and `capped` says whether the ceiling was reached. A figure quoted from part of a window without saying so is the one thing a number like this must not be.

        **Send-backs are counted for the deployment rather than per person**: the record holds that a claim was sent back and not by whom, and the reason travels as a comment.

        Narrowed to what you may read, like every count here — so two people asking get different answers rather than one of them getting an error.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-measures
      parameters:
        - description: How far back to measure
          explode: false
          in: query
          name: days
          schema:
            default: 90
            description: How far back to measure
            format: int64
            maximum: 366
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasuresBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show how long triage is taking and who is doing it
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/my-claims:
    get:
      description: |-
        Returns the claims you proposed, newest first, with what happened to each: still waiting, sent back, approved, withdrawn, lapsed, an agreement undone, or several of those where a claim's rows ended differently.

        This is the other half of the review queue's `mine=true`, which lists only what is still pending — so approved, withdrawn, lapsed and undone all present there as the row disappearing. Approval itself sends no message; this is where it is seen.

        Narrowed to what you may still read.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-my-claims
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BecameOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the outcomes of your own claims
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/notes/{id}:
    put:
      description: |-
        Replaces the text of a note. Only its author may do this: an edit another person could make is not a correction.

        **What it said before is kept**, and read back with `GET /v1/notes/{id}/history`. A note is part of the record that goes public at disclosure, and a record whose earlier text is unrecoverable is readable rather than checkable.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.

        **Requires:** public-triage or private-triage on the product. Only the author may edit a note. The product is the note's own, not one in the path.
      operationId: edit-issue-note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Edit-issue-noteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteWritten"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a note on an issue
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
        note: Only the author may edit a note. The product is the note's own, not one in the path.
  /v1/notes/{id}/history:
    get:
      description: |-
        Every version of a note that has been replaced, oldest first. The note itself carries what it says now.

        A note is part of the record that goes public at disclosure, so what it said before has to be recoverable: an edit that overwrites leaves a record somebody can read and nobody can check.

        Answers only where you may read what the note is about — the same rule as reading the note itself, asked of the issue rather than of the note, because two rules for one question is one rule out of step.

        **Requires:** any signed-in person, and not a pipeline key. Answers only where you may read what the note is about, which is the note's own product and issue rather than anything in the path.
      operationId: get-issue-note-history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyWasSaidBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List earlier revisions of a note
      tags:
        - Triage
      x-openpsirt-requires:
        scope: person
        note: Answers only where you may read what the note is about, which is the note's own product and issue rather than anything in the path.
  /v1/notifications:
    delete:
      description: |-
        Takes everything off your list at once, and says how many that was. Conditions that are still true will not come back while they hold.

        **Requires:** your own credential
      operationId: acknowledge-all-notifications
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acknowledge-all-notificationsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Acknowledge everything waiting on you
      tags:
        - Notifications
      x-openpsirt-requires:
        scope: self
    get:
      description: |-
        Returns what you have not dealt with, newest first, and how many there are.

        Everyone has one of these, and what appears in it differs by what you hold: work arriving, a dismissal sent back, an approval an edit withdrew, or — for an administrator — that the tool itself is unwell.

        Two lifetimes, and the difference matters to a caller. An **event** happened once and goes away when you acknowledge it. A **condition** is true while something is true and clears itself when that stops, so a build that resumes being scanned leaves this list without anybody dismissing it.

        **Requires:** your own credential
      operationId: list-notifications
      parameters:
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List your notifications
      tags:
        - Notifications
      x-openpsirt-requires:
        scope: self
  /v1/notifications/{id}:
    delete:
      description: |-
        Takes one off your list.

        Yours only. A notification identifier is a number a caller supplies, and one belonging to somebody else answers the same way as one that does not exist.

        Acknowledging a condition hides it rather than resolving it: what it is about is still true, and the pass that derives it will not raise it again while it holds.

        **Requires:** your own credential
      operationId: acknowledge-notification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Acknowledge one notification
      tags:
        - Notifications
      x-openpsirt-requires:
        scope: self
  /v1/outbound:
    get:
      description: |-
        The destinations configured, which kinds go to each, and whether they are working.

        **The signing secret is never returned.** It signs our requests rather than authenticating anybody to us, so it has to be stored recoverably — and showing it would put a shared secret on a page.

        **Requires:** administrator
      operationId: list-outbound
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyOutboundBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List where this deployment sends things
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
    post:
      description: |-
        Records a destination: a URL, a shared secret to sign with, and which kinds go there — one kind by name, or `*` for all of them.

        **One signed request, not an adapter each.** Slack, Teams, a tracker driven by automation and paging all take an HTTP request with a JSON body, so one shape reaches all of them.

        **What it carries is what the channel rules already allow.** A notification about a finding nobody has announced carries the fact that there is something and a link, and nothing else — the same body a mail would carry, composed by the same code.

        **Every request is signed.** `X-OpenPSIRT-Timestamp` and `X-OpenPSIRT-Signature: sha256=…`, an HMAC over the timestamp, a dot, and the body — so a receiver can tell one of ours from one anybody could make, and cannot replay yesterday's.

        **https only, and a redirect is refused rather than followed.** The body is signed and not encrypted, and a redirect asks us to send a signed request somewhere else, which is what the restriction exists to prevent.

        **Requires:** administrator
      operationId: add-outbound
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Add-outboundRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a kind of notification somewhere
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/outbound/{name}/{kind}:
    delete:
      description: |-
        Takes a destination out of use. What was already sent stays recorded, because where something went is a question asked afterwards.

        **Requires:** administrator
      operationId: retire-outbound
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop sending a kind somewhere
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people:
    get:
      description: |-
        Lists everybody who may sign in, with the roles each of them holds and the products those apply to.

        Nobody appears here by having authenticated. Access is granted in advance, so this list is what an administrator has decided rather than who has turned up.

        **Requires:** administrator
      operationId: list-people
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPersonBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
    post:
      description: |-
        Records somebody so that they may sign in, and optionally what they hold. Recording the same person again confirms them and adds any roles named.

        **Requires a session.** A personal token cannot record a person, because the account it would create outlives the token and is not bounded by it.

        **Requires:** administrator
      operationId: record-person
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredPersonBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a user and grant roles
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/tokens:
    get:
      description: |-
        Lists every personal token in the deployment, whose it is, what it may send and when it was last used.

        Without it a stale token is found only when somebody leaves and nobody knows what breaks if it is turned off.

        **Requires:** administrator
      operationId: list-all-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List all users' API tokens
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}:
    get:
      description: |-
        Returns one person: the roles in force for them, every grant and withdrawal against them, how much of the triage record they proposed and agreed to, and what this deployment has told them.

        `told` includes what they have already acknowledged and what has since cleared, because the question it answers is what was sent rather than what is waiting. It is not narrowed by what they may read now: a line about an undisclosed finding, sent while they held the role that reached it, is exactly what an investigation is looking for.

        `held` and `told` are the first page of each; `held_total` and `told_total` say how many there are.

        **Requires:** administrator
      operationId: read-person
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            maxLength: 191
            type: string
        - description: How many of each list to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many of each list to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutPersonBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read one user
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}/assignments:
    get:
      description: |-
        The open findings assigned to somebody, most urgent first, in the same units as what nobody is dealing with: **one item per issue in a component in a product**, not one per build. The same code built several ways is one piece of work, and it was taken on as one.

        Send `me` as the identity for your own.

        An identity nobody holds answers with an empty list rather than a 404, which is also what an identity somebody holds answers when none of their work is yours to see. The two are deliberately the same.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see. An identity nobody holds answers as one whose work you cannot see.
      operationId: list-assigned
      parameters:
        - description: Their sign-in identity, or 'me' for your own
          in: path
          name: identity
          required: true
          schema:
            description: Their sign-in identity, or 'me' for your own
            type: string
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-assignedResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what one person is dealing with
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see. An identity nobody holds answers as one whose work you cannot see.
  /v1/people/{identity}/assignments/hand-back:
    post:
      description: |-
        Returns all their open findings to the unassigned list. For when somebody has left, or their last role is removed.

        Nothing tells this software that somebody has gone — membership is read at sign-in, and a person who has left never signs in again. So this is an action an administrator takes rather than something that happens on its own, and until it is taken their work is in no list at all: not in the shared one because it is assigned, and not in anybody's own because they are not here.

        Send `to` instead to hand it to a named person rather than to nobody.

        **Requires:** administrator
      operationId: hand-back-assignments
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Hand-back-assignmentsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hand-back-assignmentsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Hand back everything one person is dealing with
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}/deactivation:
    delete:
      description: |-
        Lets somebody who was deactivated sign in again, with whatever they still hold. Their roles were never withdrawn, so nothing has to be granted back.

        What they were dealing with was handed back when they left and is not returned to them: somebody else may have picked it up, and reassigning it here would take it off them silently.

        **Requires:** administrator
      operationId: reactivate-person
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            maxLength: 191
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reactivate a user
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
    put:
      description: |-
        Records that somebody has left. They are refused at every way in — a session, a personal token, a group-bound sign-in — from the next request onward, their sessions are ended, and what they were dealing with is handed back so it is not held by somebody who is gone.

        Nobody is deleted. The record names them as the proposer of judgments and the approver of others, and their roles are left where they are: what somebody held is part of why the record reads as it does, and bringing them back should not mean reconstructing it. What stops them is the date.

        Deactivating somebody already deactivated succeeds and moves nothing, because the date is when they left.

        `released` says how much work was handed back.

        **Requires:** administrator
      operationId: deactivate-person
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            maxLength: 191
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deactivate-personResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Deactivate a user
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}/identifier:
    delete:
      description: |-
        Clears the identifier a sign-in provider pinned to somebody, so that the next person to arrive under their username binds it again. Their authorization and their roles are untouched.

        **Use it after changing sign-in provider.** An identifier belongs to the provider that issued it, so every account pinned to the old one is refused once a new one is configured: the name matches and the identifier does not.

        It re-opens the window a pinned identifier closes, in which whoever arrives under that username is taken to be its holder. Do it when you expect them to sign in.

        **Requires:** administrator
      operationId: unbind-identifier
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Unbind a user's provider identifier
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}/roles/{product}/{role}:
    delete:
      description: |-
        Withdraws one role from one person. Takes effect at their next request; end their sessions to cut them off now.

        If it was their last role on that product, everything they were dealing with there goes back to the unassigned list. Otherwise that work is in no list at all: not in the shared one because it is assigned, and not in theirs because they can no longer open it. `released` says how much moved.

        The grant is removed rather than marked as ended. What somebody used to hold is answered by the record of what they did, so this list only ever says what is true today.

        **Requires:** administrator
      operationId: withdraw-role
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: role
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdraw-roleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a user's role on a product
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}/roles/{role}:
    delete:
      description: |-
        Withdraws a role held across the estate. Takes effect at their next request; end their sessions to cut them off now.

        It leaves no per-product grants in its place: anything still wanted on one product is granted there deliberately. Roles held against a named product are untouched, and are withdrawn one at a time through the path that names the product.

        Where this was their last role in a product, what they were dealing with there goes back to the unassigned list. `released` says how much moved in total.

        **Requires:** administrator
      operationId: withdraw-estate-role
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: role
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdraw-estate-roleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a user's role on every product
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}/sessions:
    delete:
      description: |-
        Takes effect at once, whichever copy of the application answers next. Roles and group mappings are re-read at sign-in, so withdrawing one takes effect then; this is what makes somebody leaving immediate instead.

        **Requires:** administrator
      operationId: end-sessions
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: End all of a user's sessions
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/people/{identity}/tokens/{name}:
    delete:
      description: |-
        Revokes one person's token on their behalf. It stops working immediately; the record of what it sent stays.

        An owner withdraws their own through their own token paths. This is for the ones whose owner is no longer here to do it.

        **Requires:** administrator
      operationId: revoke-anyones-token
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw another user's API token
      tags:
        - Administration
      x-openpsirt-requires:
        scope: deployment
  /v1/products:
    get:
      description: |-
        Lists the products declared here, with what each one holds.

        A scan may only be filed against something declared, so this is the first question to ask after an upload is refused for naming something unknown.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-products
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyProductBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List products
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
    post:
      description: |-
        Records a product so scans may be filed against it. Declaring one that already exists succeeds without changing anything, so this can run on every build.

        **Requires:** administrator
      operationId: declare-product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredProductBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a product
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: deployment
  /v1/products/{product}/comparison:
    get:
      description: |-
        Returns what was fixed, what is newly present, and what is still there between two builds of one product.

        Between **any** two, not only adjacent ones: what a release note has to answer is usually about the last release a customer has, which is rarely the previous one.

        Each fixed entry says why it went, because "fixed by upgrading" and "fixed by a carried patch" are different sentences to a reader. `superseded` is the one to read carefully — it means the version moved and the issue came with it, so it was not fixed at all.

        A still-present entry carrying `arrived_from` is the same failure seen from the other side: somebody moved that version since the earlier build and the issue came with it, so the bump did not reach the fix.

        **Public findings only unless you ask otherwise.** Its destination is usually a public document, so including something undisclosed should be deliberate rather than something pasted in without noticing.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: compare-releases
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The earlier build's stream — a branch or a tag
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The earlier build's stream — a branch or a tag
            type: string
        - description: The earlier build's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: The earlier build's variant
            type: string
        - description: The later build's stream
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: The later build's stream
            type: string
        - description: The later build's variant
          explode: false
          in: query
          name: to_variant
          required: true
          schema:
            description: The later build's variant
            type: string
        - description: Include findings nobody has disclosed
          explode: false
          in: query
          name: include_undisclosed
          schema:
            description: Include findings nobody has disclosed
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Compare two builds
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/comparison.{format}:
    get:
      description: |-
        What was fixed, what is newly present and what is still there between two builds, as a file.

        One file with a `change` column rather than three files: it is one comparison, and three of anything that has to be kept together is three chances to send somebody two of them.

        Each fixed row says why it went. `superseded` is the one to read carefully — the version moved and the issue came with it, so it was not fixed at all. A still-present row carrying `arrived from` is that same failure from the other side.

        **Public findings only unless you ask otherwise**, because the destination is usually a public document.

        **Requires:** any signed-in person, and not a pipeline key. Exports only what you may see.
      operationId: export-comparison
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: format
          required: true
          schema:
            enum:
              - csv
              - json
            type: string
        - description: The earlier build's stream — a branch or a tag
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The earlier build's stream — a branch or a tag
            type: string
        - description: The earlier build's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: The earlier build's variant
            type: string
        - description: The later build's stream
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: The later build's stream
            type: string
        - description: The later build's variant
          explode: false
          in: query
          name: to_variant
          required: true
          schema:
            description: The later build's variant
            type: string
        - description: Include findings nobody has disclosed
          explode: false
          in: query
          name: include_undisclosed
          schema:
            description: Include findings nobody has disclosed
            type: boolean
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Export a comparison of two builds
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Exports only what you may see.
  /v1/products/{product}/comparison/notes:
    get:
      description: |-
        The same comparison as markdown, in the form somebody pastes into a release note. Returned as `text/markdown` rather than as a string in a JSON field, because the point of it is that it goes straight in.

        **It carries what was fixed and nothing else.** Not what is still present, not what newly appeared, and not a bump that carried the issue with it — those are statements about what a build contains, and the document for them is a VEX, which a customer's own scanner reads. The comparison itself still answers all three.

        Worst first and stably ordered, so two runs over the same pair of builds produce the same document. A lead line names both builds, the day, and the scanner and vulnerability-database versions the later build was last measured with.

        **Public findings only unless you ask otherwise**, as the comparison itself is. Where fixes are left out for not having been disclosed, the note says how many and never which.

        A release that fixed nothing answers with a sentence saying so, not with an empty body: zero bytes is also what a truncated response and the wrong pair of builds look like.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-release-notes
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The earlier build's stream
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The earlier build's stream
            type: string
        - description: The earlier build's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: The earlier build's variant
            type: string
        - description: The later build's stream
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: The later build's stream
            type: string
        - description: The later build's variant
          explode: false
          in: query
          name: to_variant
          required: true
          schema:
            description: The later build's variant
            type: string
        - description: Include findings nobody has disclosed
          explode: false
          in: query
          name: include_undisclosed
          schema:
            description: Include findings nobody has disclosed
            type: boolean
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Render a comparison as release notes
      tags:
        - Reports
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/components/{component}:
    get:
      description: |-
        What each build ships, what is open against it there, where it could go, and what has already been promised.

        **Answered per build, because the answer differs by build.** A stream staying on a maintained older line and a stream that has moved on are different work with different testing, and one target across both would be wrong for one of them.

        **Where it could go carries two counts.** `fixed_here` is how many of what is open name that exact version as their fix, which is the release's own security content; `reached` is how many the upgrade closes altogether, counting everything fixed at or before it. The second is the one somebody choosing a version is asking about, and it needs the ecosystem's ordering: where that is not defined the two counts are equal, `ordered` is false, and the list is not ranked. Ranked on `fixed_here` a quiet release late on a maintained line sorts near the bottom while carrying every fix before it.

        **A build is listed because it ships the component**, not because something is open against it. A package carrying nothing of its own still answers with the version it ships and how many things pull it in, which is the ordinary case for anything vendored in pre-built.

        **One entry per version rather than per build.** A build shipping a name at two versions holds two components, and they are two different pieces of code to decide about.

        `due_at` is what a commitment about that build is gated against, and is absent where nothing is open.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: get-component
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPerBuildBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show a component across the builds that carry it
      tags:
        - Findings
      x-openpsirt-requires:
        scope: person
        note: Answers only what you may see.
  /v1/products/{product}/components/{component}/upgrade:
    post:
      description: |-
        Answers everything open against a component in the releases named, in one act: each is recorded as `upgrade-needed`, carrying the version it moves to and the date the work will be done.

        **Coverage is the component, not a version pair.** Moving to 3.5.2 is a claim that it answers what is open on the package — including findings recorded as fixed in 3.5.0 — and the next scan says which of that was true. Deciding it from the versions would need an ordering per ecosystem this does not have.

        **Whether a second person agrees depends on the date.** At or before the earliest deadline among what this covers, it stands on its own: nothing is hidden for longer than the policy already allowed. Past it, the promise defers the worst thing it covers and it waits for approval. The response says which.

        **Not bounded.** A bulk judgment is, because nothing re-checks one and a sentence answering a thousand findings has to stay a size a reviewer can follow. A promise is re-checked by the next scan, and narrowing it would make the record false: the bump closes what it closes.

        **Saying who carries it is part of the act**, not a second one: name a `person` or a `team`, and every finding the promise covers is handed to them in the same transaction, so a promise nobody is carrying and a holder with no promise are both impossible. A team is a perfectly good holder — moving a package is work a queue tracks rather than a judgment one person makes — and it stays unheld until somebody on it takes it. The handover is product-wide like every other, because the promise is per build and who is carrying the work is not.

        **Requires:** public-triage or private-triage on the product
      operationId: plan-upgrade
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpgradeBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedUpgradeBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record moving a component as the answer to what is open against it
      tags:
        - Triage
      x-openpsirt-requires:
        scope: product
        any_of:
          - public-triage
          - private-triage
  /v1/products/{product}/end-of-life:
    put:
      description: |-
        Sets the date support ends for every release of a product that has not stated its own. Past it, nothing on the product carries a remediation deadline and a build that stops being scanned is expected rather than a fault.

        Nothing is deleted or hidden: the findings and the history stay, and stay reportable. What ends is what is expected of us.

        An empty date clears it, because extended support happens. Deadlines are rewritten afterwards, away from the request; the response returns before that has finished.

        **Requires:** administrator
      operationId: set-product-end-of-life
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndOfLifeBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set when a product goes out of support
      tags:
        - Catalog
      x-openpsirt-requires:
        scope: deployment
  /v1/products/{product}/findings:
    get:
      description: |-
        Returns one row per vulnerability-and-component pair, not one row per place the component appears. Each row gives the number of places it occupies and how many of those the build's VEX documents already answer.

        Ordered by urgency — known-exploited first, then whether the build ships to customers, then severity, then likelihood. Supports limit and offset.

        **Every filter is applied here, and `total` counts what it admits** rather than what the page holds.

        `under` keeps what one container holds directly; `beneath` keeps what sits at a component or anywhere under it, which is what the dependency tree's cumulative count counts. The tree counts distinct issues and this list is one row per issue and component, so a subtree holding one issue at two components is two rows here and one there.

        `stream` and `variant` are optional and independent. With both named the list is one build. With either left out it answers for every build under the product that matches the rest: a row is still one issue in one component, its place count is across every build it is in, and `builds` says how many those are. Across more than one build a row carries `stream` and `variant` naming one of them to link to, and carries no `owner`, `parent`, `middle` or `chains` — a chain belongs to one build's graph. `beneath` is a walk over one build's edges and is refused unless both are named.

        **Requires:** any signed-in person, and not a pipeline key. Answers only what you may see.
      operationId: list-findings
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: Limit to one branch or tag. Left out, every one under the product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Left out, every one under the product
            type: string
        - description: Limit to one variant. Left out, every one under the product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Left out, every one under the product, and independent of the branch
            type: string
        - description: Keep only what sits at this component or anywhere under it — what the dependency tree's cumulative count counts. The name must be in the build; a name that is not, or that the build holds at more than one version, is refused
          explode: false
          in: query
          name: beneath
          schema:
            description: Keep only what sits at this component or anywhere under it — what the dependency tree's cumulative count counts. The name must be in the build; a name that is not, or that the build holds at more than one version, is refused
            type: string
        - description: Keep only groups open in some builds of this selection and not others. Meaningless where the selection is one build, and ignored there
          explode: false
          in: query
          name: differs
          schema:
            description: Keep only groups open in some builds of this selection and not others. Meaningless where the selection is one build, and ignored there
            type: boolean
        - description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
          explode: false
          in: query
          name: severity
          schema:
            description: Keep only issues rated this badly or worse. 'low' excludes nothing, including issues carrying no rating
            enum:
              - low
              - medium
              - high
              - critical
            type: string
        - description: Keep only issues somebody is known to be exploiting
          explode: false
          in: query
          name: exploited
          schema:
            description: Keep only issues somebody is known to be exploiting
            type: boolean
        - description: Keep only issues where an upstream fixed version is known
          explode: false
          in: query
          name: fixable
          schema:
